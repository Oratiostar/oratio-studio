var SEC = [
 {id:"sehen", emo:"🏛️", t:["Sehenswürdigkeiten","À voir"], i:["Die Klassiker, die man als Münchner trotzdem immer wieder gern zeigt.","Les classiques que même les Munichois aiment montrer encore et encore."], c:[
  [["Marienplatz & Neues Rathaus","Marienplatz & Nouvel hôtel de ville"],["Das Herz der Stadt. Das neugotische Neue Rathaus (1867–1909) hat ein Glockenspiel mit 43 Glocken und 32 lebensgroßen Figuren – um 11 und 12 Uhr, von März bis Oktober auch um 17 Uhr. Dazu die Mariensäule von 1638.","Le cœur de la ville. Le Nouvel hôtel de ville néogothique (1867–1909) abrite un carillon de 43 cloches et 32 figures grandeur nature – à 11 h et 12 h, de mars à octobre aussi à 17 h. Plus la colonne de Marie de 1638."],"Zentrum"],
  [["Frauenkirche","Frauenkirche"],["Wahrzeichen mit den zwei Zwiebeltürmen (rund 99 m). Im Eingang liegt der „Teufelstritt“: ein dunkler Fußabdruck im Boden. Der Legende nach hat der Teufel hier gestampft. 2004 entschieden die Münchner per Bürgerentscheid, dass keine Gebäude höher als diese Türme werden.","Emblème aux deux tours à bulbes (env. 99 m). Dans l’entrée se trouve le « pas du diable » : une empreinte noire dans le sol. Selon la légende, le diable y a frappé du pied. En 2004, les Munichois ont décidé par référendum qu’aucun bâtiment ne dépasserait ces tours."],"Wahrzeichen"],
  [["Alter Peter","Alter Peter"],["Die Peterskirche: etwa 300 Stufen hinauf auf den Turm – und du hast bei Föhn einen Blick bis zu den Alpen.","L’église Saint-Pierre : environ 300 marches jusqu’en haut – et par temps de foehn, vue jusqu’aux Alpes."],"Aussicht"],
  [["Viktualienmarkt","Viktualienmarkt"],["Seit 1807 der Markt mitten in der Stadt: Obst, Käse, Fisch, Gewürze, Blumen – und der Biergarten unter Kastanien mit wechselnden Brauereien. Am Rand: der Brunnen für Karl Valentin und Liesl Karlstadt.","Le marché au cœur de la ville depuis 1807 : fruits, fromages, poissons, épices, fleurs – et la brasserie en plein air sous les marronniers. Sur le côté : la fontaine dédiée à Karl Valentin et Liesl Karlstadt."],"Markt"],
  [["Residenz","Résidence royale"],["Das größte Stadtschloss Deutschlands: ab 1385 über Jahrhunderte gewachsen, mit Schatzkammer, Antiquarium und dem Cuvilliés-Theater. Vor dem Eingang: die Löwen – wer sie anfasst, hat Glück.","Le plus grand palais urbain d’Allemagne : agrandi pendant des siècles à partir de 1385, avec trésor, Antiquarium et théâtre Cuvilliés. Devant l’entrée : les lions – les toucher porte bonheur."],"Geschichte"],
  [["Schloss Nymphenburg","Château de Nymphenburg"],["Die Sommerresidenz der Wittelsbacher (Baubeginn 1664) mit riesigem Park, Kanälen, Badenburg und der berühmten Schönheitengalerie von König Ludwig I.","Résidence d’été des Wittelsbach (construction dès 1664) avec un immense parc, des canaux, la Badenburg et la célèbre galerie des beautés de Louis Iᵉʳ."],"Schloss"],
  [["Olympiapark & Olympiaturm","Parc olympique & Tour olympique"],["Für die Spiele 1972 gebaut: das berühmte Zeltdach (Frei Otto, Behnisch) und der 291 m hohe Turm mit Drehrestaurant. Heute Konzerte, Eislaufen, Sommerrodeln, Klettern auf dem Dach – und ein Erinnerungsort für die Opfer des Anschlags 1972.","Construit pour les Jeux de 1972 : le célèbre toit-tente (Frei Otto, Behnisch) et la tour de 291 m avec restaurant panoramique. Aujourd’hui concerts, patinage, luge d’été, escalade sur le toit – et un lieu de mémoire pour les victimes de l’attentat de 1972."],"Olympia"],
  [["Kunstareal","Quartier des musées"],["Die drei Pinakotheken (Alte, Neue, Moderne), das Lenbachhaus mit dem „Blauen Reiter“ (Kandinsky, Marc), das Museum Brandhorst und die Glyptothek – eine der dichtesten Museumsmeilen Europas.","Les trois Pinacothèques (ancienne, nouvelle, moderne), le Lenbachhaus avec le « Cavalier bleu » (Kandinsky, Marc), le Museum Brandhorst et la Glyptothèque – l’un des quartiers de musées les plus denses d’Europe."],"Kunst"],
  [["BMW Welt & Museum","BMW Welt & musée"],["Der „Vierzylinder“ (Museum 1973) und die geschwungene BMW Welt (2007) neben dem Olympiapark: Autos, Motorräder und Architektur zum Staunen.","Le « quatre-cylindres » (musée, 1973) et la BMW Welt aux courbes audacieuses (2007) à côté du parc olympique : voitures, motos et architecture impressionnante."],"Technik"],
  [["Allianz Arena","Allianz Arena"],["Seit 2005 die Heimat des FC Bayern (gegründet 1900): rund 75.000 Plätze, die Hülle aus Folienkissen leuchtet rot, blau oder weiß.","Depuis 2005, le stade du FC Bayern (fondé en 1900) : environ 75 000 places, l’enveloppe en coussins translucides s’illumine en rouge, bleu ou blanc."],"Fußball"]
 ]},
 {id:"natur", emo:"🌊", t:["Isar, Parks & Natur","Isar, parcs & nature"], i:["Münchner sind draußen, sobald die Sonne scheint – und die Stadt macht es einem leicht.","Les Munichois sont dehors dès que le soleil brille – et la ville s’y prête."], c:[
  [["Englischer Garten","Jardin anglais"],["1789 angelegt, rund 375 Hektar – größer als der Central Park in New York. Monopteros mit Blick auf die Skyline, Kleinhesseloher See zum Rudern, der Chinesische Turm mit Biergarten (ca. 7.000 Plätze) und: mehrere Wiesen, auf denen man (ja, wirklich) nackt in der Sonne liegen darf.","Aménagé en 1789, environ 375 hectares – plus grand que Central Park à New York. Monopteros avec vue sur la ville, lac de Kleinhesselohe pour ramer, Tour chinoise avec brasserie en plein air (env. 7 000 places) et : plusieurs prairies où l’on peut (vraiment) bronzer nu."],"Park"],
  [["Eisbach-Welle","Vague de l’Eisbach"],["Am Rand des Englischen Gartens steht seit den 1970ern eine stehende Welle – mitten in der Stadt wird gesurft, das ganze Jahr, auch im Winter. Zuschauen darf jeder, aufs Brett nur Geübte: die Strömung ist gefährlich.","Au bord du Jardin anglais, une vague stationnaire existe depuis les années 1970 – on surfe en pleine ville, toute l’année, même en hiver. Tout le monde peut regarder, mais seuls les experts montent sur la planche : le courant est dangereux."],"Surfen"],
  [["Isar & Flaucher","Isar & Flaucher"],["Die Isar wurde zurückgebaut, damit sie wieder wild fließen darf. An den Kiesbänken wird gegrillt, gebadet und Musik gemacht. Der Flaucher im Süden ist der Sommer-Treffpunkt.","L’Isar a été renaturée pour retrouver son cours sauvage. Sur les bancs de gravier, on grille, on se baigne et on fait de la musique. Le Flaucher au sud est le lieu de rendez-vous de l’été."],"Sommer"],
  [["Hirschgarten","Hirschgarten"],["Ein Park mit echten Hirschen und einer der größten Biergärten der Welt – rund 8.000 Plätze.","Un parc avec de vrais cerfs et l’une des plus grandes brasseries en plein air du monde – environ 8 000 places."],"Biergarten"],
  [["Westpark, Luitpoldpark, Olympiaberg","Westpark, Luitpoldpark, Olympiaberg"],["Der Olympiaberg ist aus Trümmern des Zweiten Weltkriegs aufgeschüttet – im Winter Rodeln, im Sommer Sonnenuntergang mit Alpenblick.","La colline olympique a été érigée avec les gravats de la Seconde Guerre mondiale – luge en hiver, coucher de soleil avec vue sur les Alpes en été."],"Aussicht"],
  [["Die Alpen vor der Haustür","Les Alpes à la porte"],["Bei Föhn (warmer Fallwind) sieht man die Berge zum Greifen nah. Wandern, Skifahren und Seen sind in 45 bis 90 Minuten erreichbar – die Zugspitze (2.962 m, höchster Berg Deutschlands) mit dem Zug in etwa 1,5 Stunden bis Garmisch.","Par foehn (vent chaud et descendant), les montagnes semblent toutes proches. Randonnée, ski et lacs à 45–90 minutes – la Zugspitze (2 962 m, plus haut sommet d’Allemagne) à environ 1 h 30 en train jusqu’à Garmisch."],"Berge"]
 ]},
 {id:"essen", emo:"🍺", t:["Essen, Bier & Biergärten","Cuisine, bière & Biergärten"], i:["Brotzeit, Weißwurst und eine Maß – aber es gibt Regeln.","Brotzeit, Weißwurst et une chope – mais il y a des règles."], c:[
  [["Weißwurst-Regel","La règle de la Weißwurst"],["Weißwürste isst man traditionell nur vormittags – „nicht das Zwölfuhrläuten hören“. Mit süßem Senf und Brezn, die Haut wird gezuzelt oder abgezogen. Erfunden wurde sie der Legende nach 1857 am Marienplatz.","On mange traditionnellement la Weißwurst le matin – « sans entendre sonner midi ». Avec moutarde douce et bretzel ; on la suce ou on retire la peau. Selon la légende, elle a été inventée en 1857 sur la Marienplatz."],"Klassiker"],
  [["Biergarten-Recht","Le droit des Biergärten"],["Seit 1812 ist es erlaubt, die eigene Brotzeit mitzubringen – nur Getränke kauft man dort. Tischtuch drauf, Radi, Obatzda, Brezn, Leberkäs: so geht München.","Depuis 1812, on peut apporter son propre repas – seules les boissons s’achètent sur place. Nappe sur la table, radis, Obatzda, bretzel, Leberkäs : c’est ça, Munich."],"Tradition"],
  [["Die sechs Wiesn-Brauereien","Les six brasseries de la Wiesn"],["Augustiner, Hacker-Pschorr, Hofbräu, Löwenbräu, Paulaner und Spaten. Nur Münchner Brauereien dürfen auf dem Oktoberfest ausschenken. Dazu Weißbier-Klassiker wie Franziskaner und Schneider.","Augustiner, Hacker-Pschorr, Hofbräu, Löwenbräu, Paulaner et Spaten. Seules les brasseries de Munich peuvent servir à l’Oktoberfest. Plus des classiques de bière blanche comme Franziskaner et Schneider."],"Bier"],
  [["Hofbräuhaus","Hofbräuhaus"],["Gegründet 1589 als herzogliche Brauerei. Heute Touristenmagnet mit Blasmusik – die Münchner gehen lieber in den Augustiner-Keller oder zu den Wirtshäusern im Viertel.","Fondé en 1589 comme brasserie ducale. Aujourd’hui un aimant à touristes avec fanfare – les Munichois préfèrent l’Augustiner-Keller ou les auberges de quartier."],"Haus"],
  [["Schmankerl-Liste","Liste de spécialités"],["Schweinsbraten mit Knödel, Schweinshaxe, Leberkässemmel, Obatzda, Radi, Kaiserschmarrn, Dampfnudel, Auszogne, Fischsemmel, Spezi (Cola-Orange) und Radler.","Rôti de porc avec boulettes, jarret de porc, Leberkässemmel, Obatzda, radis, Kaiserschmarrn, Dampfnudel, Auszogne, sandwich au poisson, Spezi (cola-orange) et Radler."],"Probieren"],
  [["Starkbierzeit","Saison de la bière forte"],["Vor Ostern gibt es in Fastenzeit das Starkbier – am berühmtesten ist der „Salvator“ vom Nockherberg mit dem Derblecken (Politiker-Kabarett).","Avant Pâques, pendant le carême, on boit la bière forte – le plus célèbre est le « Salvator » du Nockherberg avec le Derblecken (cabaret politique)."],"Frühjahr"]
 ]},
 {id:"wiesn", emo:"🎡", t:["Oktoberfest (Wiesn)","Oktoberfest (Wiesn)"], i:["Das größte Volksfest der Welt – und für Münchner ein ganz eigener Kalender.","La plus grande fête populaire du monde – et pour les Munichois un calendrier à part."], c:[
  [["Ursprung 1810","Origine en 1810"],["Es begann als Hochzeitsfest von Kronprinz Ludwig und Therese – die Wiese heißt deshalb Theresienwiese. Das erste Pferderennen war am 17. Oktober 1810.","Tout a commencé par le mariage du prince héritier Louis et de Thérèse – d’où le nom Theresienwiese. La première course de chevaux a eu lieu le 17 octobre 1810."],"Geschichte"],
  [["Zahlen","Chiffres"],["Rund 16 bis 18 Tage, Ende am ersten Sonntag im Oktober, jedes Jahr etwa 6 bis 7 Millionen Gäste, die Maß hat einen Liter. Der Wiesn-Anstich mit „O’zapft is!“ durch den Oberbürgermeister startet das Fest.","Environ 16 à 18 jours, fin le premier dimanche d’octobre, chaque année environ 6 à 7 millions de visiteurs ; la chope contient un litre. Le coup d’envoi « O’zapft is ! » est donné par le maire."],"Fakten"],
  [["Bavaria","Bavaria"],["Die 18 m hohe Bronzestatue über der Theresienwiese ist innen hohl – im Kopf gibt es Aussichtsplätze.","La statue de bronze de 18 m au-dessus de la Theresienwiese est creuse – la tête abrite des places d’observation."],"Ruhmeshalle"],
  [["Wiesn-Tipps","Conseils Wiesn"],["Unter der Woche und vormittags ist es entspannter. Tracht ist üblich, aber kein Muss. Die Reservierung im Zelt ist heiß begehrt – die Wiesn-Wirte haben ihre eigenen Regeln. Und: Die „Oide Wiesn“ ist die ruhigere, traditionelle Ecke.","En semaine et le matin, c’est plus calme. Le costume traditionnel est courant mais pas obligatoire. Les réservations sous tente sont très recherchées. Et : la « Oide Wiesn » est le coin plus calme et traditionnel."],"Tipps"]
 ]},
 {id:"technik", emo:"⚡", t:["Technik & Wissenschaft","Technique & science"], i:["Für Elektroniker ist München ein Pilgerort.","Pour un électronicien, Munich est un lieu de pèlerinage."], c:[
  [["Deutsches Museum","Deutsches Museum"],["1903 von Oskar von Miller gegründet, auf der Museumsinsel in der Isar – eines der größten Wissenschafts- und Technikmuseen der Welt. Es gibt ein nachgebautes Bergwerk, Schiffe, Flugzeuge, Physik, Elektrizität, Chemie, Musikinstrumente und Computer. Man braucht mehrere Tage, nicht Stunden.","Fondé en 1903 par Oskar von Miller sur l’île des musées dans l’Isar – l’un des plus grands musées de science et technique au monde. Mine reconstituée, bateaux, avions, physique, électricité, chimie, instruments de musique et ordinateurs. Il faut plusieurs jours, pas quelques heures."],"Muss man sehen"],
  [["1882: Strom über 57 km","1882 : le courant sur 57 km"],["Bei der Internationalen Elektrizitätsausstellung im Münchner Glaspalast (1882) wurde zum ersten Mal elektrische Energie über eine weite Strecke übertragen: von Miesbach nach München, rund 57 km – Idee von Marcel Deprez, organisiert von Oskar von Miller.","Lors de l’Exposition internationale d’électricité au Glaspalast de Munich (1882), de l’énergie électrique a été transmise pour la première fois sur une longue distance : de Miesbach à Munich, environ 57 km – idée de Marcel Deprez, organisée par Oskar von Miller."],"Strom"],
  [["Georg Simon Ohm","Georg Simon Ohm"],["Der Mann hinter dem Ohmschen Gesetz war ab 1849 Professor in München und starb hier 1854. Sein Grab liegt auf dem Alten Südlichen Friedhof.","L’homme derrière la loi d’Ohm a été professeur à Munich dès 1849 et y est mort en 1854. Sa tombe se trouve au Alter Südfriedhof."],"Ohm"],
  [["Joseph von Fraunhofer","Joseph von Fraunhofer"],["Er entdeckte die dunklen Linien im Sonnenspektrum und baute die besten Linsen seiner Zeit; die Fraunhofer-Gesellschaft hat ihre Zentrale in München.","Il a découvert les raies sombres du spectre solaire et construit les meilleures lentilles de son temps ; la Fraunhofer-Gesellschaft a son siège à Munich."],"Optik"],
  [["Firmen mit Münchner Wurzeln","Entreprises munichoises"],["Siemens (Konzernzentrale in München), Rohde & Schwarz (Sitz in München – Messtechnik!), BMW, MAN, Airbus-Standorte, Infineon in Neubiberg am Stadtrand und viele Start-ups. Dazu die TU München und die LMU.","Siemens (siège à Munich), Rohde & Schwarz (siège à Munich – instruments de mesure !), BMW, MAN, sites d’Airbus, Infineon à Neubiberg en périphérie et beaucoup de start-ups. Plus la TU München et la LMU."],"Industrie"],
  [["U-Bahn als Kunst","Le métro comme art"],["Seit 1971 fährt die U-Bahn – und viele Stationen sind gestaltet: Candidplatz, Westfriedhof, Georg-Brauchle-Ring, Olympia-Einkaufszentrum und mehr. Ein Ausflug mit Fahrkarte statt Eintritt.","Le métro circule depuis 1971 – et beaucoup de stations sont décorées : Candidplatz, Westfriedhof, Georg-Brauchle-Ring, Olympia-Einkaufszentrum et d’autres. Une excursion avec un ticket plutôt qu’un billet d’entrée."],"Tipp"]
 ]},
 {id:"sport", emo:"⚽", t:["Sport & Kultur","Sport & culture"], i:["Von Mia san mia bis Oper.","De « Mia san mia » à l’opéra."], c:[
  [["FC Bayern & 1860","FC Bayern & 1860"],["Der FC Bayern München (1900) ist Rekordmeister, die Löwen vom TSV 1860 (1860) sind die Traditionsmannschaft der Stadt. Die Stadt ist geteilt: Rot oder Blau.","Le FC Bayern Munich (1900) est le recordman de titres, les « Lions » du TSV 1860 (1860) sont le club de tradition. La ville est partagée : rouge ou bleu."],"Fußball"],
  [["Oper & Theater","Opéra & théâtre"],["Die Bayerische Staatsoper am Max-Joseph-Platz, die Münchner Philharmoniker im Gasteig HP8, das Gärtnerplatztheater und die Kammerspiele – dazu Karl Valentin als Münchner Kabarett-Legende.","L’Opéra d’État de Bavière sur la Max-Joseph-Platz, la Philharmonie de Munich au Gasteig HP8, le Gärtnerplatztheater et les Kammerspiele – et Karl Valentin, légende du cabaret munichois."],"Bühne"],
  [["Film","Cinéma"],["Die Bavaria Film Studios in Geiselgasteig: hier entstanden unter anderem „Das Boot“ und „Die unendliche Geschichte“. Man kann das Gelände besichtigen.","Les studios Bavaria Film à Geiselgasteig : c’est là que furent tournés notamment « Das Boot » et « L’Histoire sans fin ». Le site se visite."],"Kino"],
