h += '<div class="mstats">' + STATS.map(function(s){ return "<div><b>" + e(s[0]) + "</b><small>" + e(T(s[1])) + "</small></div>"; }).join("") + "</div>";
h += '<input id="msu" class="in msuche" type="search" autocomplete="off" placeholder="' + (fr ? "Chercher à Munich … (ex. Isar, bière, Ohm)" : "In München suchen … (z. B. Isar, Bier, Ohm)") + '">';
h += '<p class="mcount" id="mcnt">' + nCards + (fr ? " infos dans " : " Infos in ") + (SEC.length + 2) + (fr ? " sections" : " Abschnitten") + "</p>";
h += '<nav class="mnav" id="mnav">' + navH + "</nav>";
SEC.forEach(function(s){
  h += '<section class="msec" id="' + s.id + '"><h2><i>' + s.emo + "</i>" + e(T(s.t)) + '</h2><p class="in1">' + e(T(s.i)) + '</p><div class="mgrid">';
  s.c.forEach(function(c){
    h += '<article class="mc" data-t="' + e((c.t[0] + " " + c.t[1] + " " + c.p[0] + " " + c.p[1]).toLowerCase()) + '"><h3>' + e(T(c.t)) + "</h3>" + para(T(c.p)) + '<span class="tag">' + e(T(c.g)) + "</span></article>";
  });
  h += "</div></section>";
});
h += '<section class="msec" id="dialekt"><h2><i>🗣️</i>' + (fr ? "Bavarois de poche" : "Bairisch für die Hosentasche") + '</h2><p class="in1">' + (fr ? "Quelques mots que tu entendras à Munich." : "Ein paar Wörter, die du in München garantiert hörst.") + '</p><div class="mc big" data-t="bairisch dialekt servus"><table class="mt">' + DIA.map(function(d){ return "<tr><td>" + e(d[0]) + "</td><td>" + e(fr ? d[2] : d[1]) + "</td></tr>"; }).join("") + "</table></div></section>";
h += '<section class="msec" id="quiz"><h2><i>🎯</i>' + (fr ? "Quiz sur Munich" : "München-Quiz") + '</h2><p class="in1">' + (fr ? "10 questions tirées au hasard parmi " : "10 zufällige Fragen aus ") + QZ.length + (fr ? " – combien en sais-tu ?" : " – wie viel weißt du über München?") + '</p><div class="mc mq" id="mq"></div></section>';
h += '<p class="mfoot">' + (fr ? "Remarque : j’ai écrit ces informations à partir de mes connaissances. Les horaires, prix et dates peuvent changer – vérifie avant de partir." : "Hinweis: Die Infos habe ich nach bestem Wissen zusammengetragen. Öffnungszeiten, Preise und Termine können sich ändern – vor dem Besuch kurz nachschauen.") + "</p>";
main.innerHTML = h;

/* Suche */
$("#msu").addEventListener("input", function(ev){
  var w = ev.target.value.toLowerCase().split(/\s+/).filter(Boolean), total = 0;
  main.querySelectorAll(".msec").forEach(function(sec){ var n = 0; sec.querySelectorAll(".mc[data-t]").forEach(function(c){ var ok = !w.length || w.every(function(t){ return c.dataset.t.indexOf(t) >= 0; }); c.hidden = !ok; if (ok) n++; }); total += n; if (sec.querySelector(".mc[data-t]")) sec.hidden = !!w.length && !n; });
  $("#mcnt").textContent = w.length ? total + (fr ? " résultats" : " Treffer") : nCards + (fr ? " infos dans " : " Infos in ") + (SEC.length + 2) + (fr ? " sections" : " Abschnitten");
});

/* Quiz: 10 zufällige Fragen */
(function(){
  var box = $("#mq"), i = 0, pts = 0, set = [];
  function neu(){ set = QZ.slice().sort(function(){ return Math.random() - .5; }).slice(0, 10); i = 0; pts = 0; show(); }
  function show(){
    if (i >= set.length){ box.innerHTML = '<p class="q">' + (fr ? "Résultat : " : "Ergebnis: ") + pts + " / " + set.length + '</p><p class="ex">' + (pts >= 9 ? (fr ? "Un vrai Munichois !" : "Echter Münchner!") : pts >= 5 ? (fr ? "Pas mal – servus !" : "Nicht schlecht – Servus!") : (fr ? "Il faut revenir à Munich !" : "Da hilft nur: nochmal nach München!")) + '</p><button class="btn go" type="button" id="mqr">' + (fr ? "Rejouer" : "Nochmal") + "</button>"; $("#mqr").onclick = neu; return; }
    var q = set[i]; box.innerHTML = '<div class="bar"><i style="width:' + (i / set.length * 100) + '%"></i></div><p class="q">' + (i + 1) + ". " + e(T(q[0])) + '</p><div class="opts">' + q[1][0].map(function(o, k){ return '<button type="button" class="o" data-k="' + k + '">' + e(fr ? q[1][1][k] : o) + "</button>"; }).join("") + '</div><p class="ex" hidden></p>';
    box.querySelectorAll("button.o").forEach(function(b){ b.onclick = function(){ var k = +b.dataset.k; box.querySelectorAll("button.o").forEach(function(x){ x.disabled = true; if (+x.dataset.k === q[2]) x.classList.add("ok"); }); if (k === q[2]) pts++; else b.classList.add("no"); var ex = box.querySelector(".ex"); ex.hidden = false; ex.textContent = T(q[3]);
      var nx = document.createElement("button"); nx.type = "button"; nx.className = "btn go"; nx.style.marginTop = "10px"; nx.textContent = i + 1 >= set.length ? (fr ? "Résultat" : "Ergebnis") : (fr ? "Suivant" : "Weiter"); nx.onclick = function(){ i++; show(); }; box.appendChild(nx); }; });
  }
  neu();
})();
})();
WZ.kopf("muenchen");
document.documentElement.lang = WZ.lang === "fr" ? "fr" : "de";
document.title = WZ.lang === "fr" ? "Munich – Oratio Place" : "München erleben – Oratio Place";
</script>
</body>
