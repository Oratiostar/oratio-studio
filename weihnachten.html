<style>
#xmSnow{position:fixed;inset:0;pointer-events:none;z-index:0}
main{position:relative;z-index:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.chip{border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:99px;padding:5px 12px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.chip:hover{border-color:var(--acc)}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--onacc,#fff)}
.xtwo{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.xtwo{grid-template-columns:minmax(0,1fr)}}
.xtwo>.card,.xtwo>div>.card{min-width:0}
.cvwrap{width:100%;max-width:440px;margin:0 auto}
.cvwrap.wide{max-width:640px}.cvwrap.tall{max-width:300px}
.cvwrap canvas{display:block;width:100%;height:auto;border-radius:16px;box-shadow:var(--shadow);border:3px solid var(--acc)}
textarea.in{resize:vertical;min-height:70px}
.chk{display:flex;gap:8px;align-items:flex-start;margin:10px 0 0;font-size:14px}
.chk input{margin-top:3px;accent-color:var(--acc)}
.checks .chk{margin:4px 0}
.sharebar{margin:6px 0}
.sharebar .btn{text-decoration:none;display:inline-block}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#23304a;color:#fff;padding:10px 16px;border-radius:12px;z-index:200;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.vcard{max-width:640px;margin:0 auto;text-align:center}
.vcard .cvwrap{margin-top:8px}
.vlead{font-size:20px;font-weight:700;margin:8px 0}
.vfoot{text-align:center;color:var(--muted);font-size:14px;margin-top:24px}
.backl{margin-top:22px}
.wlist{display:grid;gap:10px;margin-top:12px}
.wi{display:flex;flex-direction:column;gap:10px}
.wt{white-space:pre-wrap;line-height:1.5}
.wrow{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.wrow:first-of-type{margin-top:8px}
.wrow .btn{text-decoration:none;display:inline-block}
.reveal{margin:14px auto;padding:22px 16px;border-radius:16px;border:3px dashed var(--acc);font-size:22px;font-weight:800;cursor:pointer;max-width:420px;user-select:none}
.reveal.open{border-style:solid;background:var(--soft);color:var(--acc);font-size:34px;animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.7);opacity:.2}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.doors{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:420px;margin:12px auto}
.door{aspect-ratio:1;border-radius:12px;border:3px solid #7d0f1f;background:linear-gradient(145deg,#c4162b,#8f1020);color:#ffe9a8;font:800 24px/1 "Inter",system-ui,sans-serif;cursor:pointer;box-shadow:inset 0 0 0 3px rgba(255,224,138,.35),var(--shadow);transition:transform .15s}
.door:hover{transform:scale(1.04)}
.door.open{background:linear-gradient(145deg,#1d6a46,#0f4a2f);border-color:#0b3125;color:#d9ffe9}
.door.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.advtxt{max-width:420px;margin:10px auto;padding:12px 14px;border-radius:12px;background:var(--soft);border:2px solid var(--line);text-align:left}
.advgrid{display:grid;gap:6px}
.advrow{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:center}
.advrow span{font-weight:800;color:var(--acc);text-align:right}
.wzrow{display:grid;grid-template-columns:1fr 88px auto;gap:6px;margin-top:8px}
.wzrow input:first-child{grid-column:1/-1}
.wzl{list-style:none;padding:0;margin:10px 0;text-align:left}
.wzl li{padding:10px 4px;border-bottom:1px solid var(--line)}
.wzl .pr{color:var(--muted);margin-left:6px}
.qz h2{margin-top:6px}
.qn{color:var(--muted);font-weight:700;font-size:14px}
.qo{display:grid;gap:8px;margin:12px 0}
.qo .btn{text-align:left}
.qo .btn.good{background:#2a9a4a;border-color:#1c7a36;color:#fff;opacity:1}
.qo .btn.bad{background:var(--bad);border-color:var(--bad);color:#fff;opacity:1}
.bingo{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:560px;margin:12px 0}
.bc{aspect-ratio:1;padding:4px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--fg);font:600 11.5px/1.2 "Inter",system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;hyphens:auto;overflow-wrap:anywhere}
.bc.on{background:var(--acc);border-color:var(--acc);color:#fff}
.bc.free{font-weight:800}
@media (min-width:600px){.bc{font-size:13px}}
@media (max-width:599px){.bingo{gap:4px}.bc{aspect-ratio:auto;min-height:92px;font-size:9.2px;line-height:1.15;padding:3px;overflow-wrap:anywhere;hyphens:auto;-webkit-hyphens:auto}}
.orns{display:flex;flex-wrap:wrap;gap:6px}
.orn{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:5px 10px;font:600 14px "Inter",system-ui,sans-serif;cursor:pointer}
.orn i{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.3)}
.orn.on{border-color:var(--acc);background:var(--soft)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);cursor:pointer;padding:0}
.sw.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--acc)}
.drop{margin-bottom:10px}
.piano{position:relative;height:150px;max-width:520px;margin:0 auto;user-select:none;touch-action:none}
.pk{position:absolute;top:0;width:12.5%;height:100%;border:2px solid #9aa7ba;border-radius:0 0 8px 8px;background:linear-gradient(#fff,#e8eef7);cursor:pointer;padding:0}
.pk.blk{width:8%;height:62%;background:linear-gradient(#2a2f3a,#0e1118);border-color:#0e1118;z-index:2}
.pk.hit{background:var(--acc);border-color:var(--acc)}
.burow{display:grid;grid-template-columns:1.4fr 1fr auto;gap:6px;margin-top:6px}
.bbar{height:14px;border-radius:99px;background:var(--soft);overflow:hidden;margin:8px 0}
.bbar i{display:block;height:100%;border-radius:99px;transition:width .2s}
p.ok{color:var(--ok);font-weight:700}p.bad{color:var(--bad);font-weight:700}
.et{width:100%;border-collapse:collapse;margin:8px 0}
.et td{padding:8px 4px;border-bottom:1px solid var(--line)}.et td:last-child{text-align:right;font-weight:700;white-space:nowrap}
@media print{
  header,footer,#xmSnow,.crumb,.backl,.sharebar,.vfoot,.toast,.xtwo>.card,.row,.hint,.status,h1,.sub,.warn{display:none!important}
  body{background:#fff}
  main{padding:0}.xtwo{display:block}
  .cvwrap canvas{box-shadow:none;border:none}
  .bingo{max-width:none}
  .bc{border:1px solid #000;color:#000;background:#fff;font-size:11pt}
  .wzl li{color:#000}
  body:not(.print-brief) .card{border:none;box-shadow:none}
}

/* ---------- bunte Weihnachtswelt ---------- */
body{background:radial-gradient(circle at 8% 0%,rgba(230,57,70,.16),transparent 42%),radial-gradient(circle at 92% 8%,rgba(76,195,110,.16),transparent 42%),radial-gradient(circle at 50% 100%,rgba(255,210,63,.18),transparent 48%),radial-gradient(circle at 100% 70%,rgba(63,176,216,.12),transparent 40%),var(--bg) fixed}
.lights{display:flex;justify-content:space-between;align-items:flex-start;height:26px;margin:-8px 0 6px;position:relative;overflow:hidden;pointer-events:none}
.lights::before{content:"";position:absolute;left:0;right:0;top:3px;height:2px;background:#2f5d3a;border-radius:2px;opacity:.7}
.lights i{display:block;width:9px;height:14px;margin-top:4px;border-radius:50% 50% 55% 55%;background:var(--c);box-shadow:0 0 9px 1px var(--c);animation:tw 2.2s ease-in-out infinite;animation-delay:var(--d);position:relative}
.lights i:nth-child(even){margin-top:8px}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.35}}
.hero{position:relative;border-radius:26px;margin:8px 0 12px;overflow:hidden;height:380px;box-shadow:0 12px 30px rgba(40,30,110,.35);background:#16225f}
.hero-bg{position:absolute;inset:0}.hero-bg svg{width:100%;height:100%;display:block}
.hero-t{position:absolute;left:0;right:0;top:0;padding:22px 24px 40px;background:linear-gradient(180deg,rgba(10,14,50,.62),rgba(10,14,50,0));color:#fff}
.hero h1{color:#fff;font-size:40px;margin:2px 0 6px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.hero-s{margin:0;max-width:min(52ch,46%);font-size:16px;text-shadow:0 1px 4px rgba(0,0,0,.55)}
.hero-z{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.hero-z span{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:5px 13px;font-size:14px;box-shadow:var(--shadow)}
.hero-z b{font-size:16px;color:var(--acclink)}
.gsec{margin:24px 0}
.gland{position:relative;height:128px;border-radius:22px;overflow:hidden;margin:0 0 12px;box-shadow:0 6px 18px rgba(30,30,80,.25)}
.gland svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.gland::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,10,40,.62),rgba(8,10,40,.1) 62%,rgba(8,10,40,0));pointer-events:none}
.gh2{position:absolute;left:16px;top:0;bottom:0;margin:0;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:12px;align-content:center;z-index:2;color:#fff;max-width:75%}
.gh2 span{grid-row:1/3;display:grid;place-items:center;width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.5);font-size:28px;align-self:center}
.gh2 span{grid-row:1}.gh2 b{font-size:24px;line-height:1.15;text-shadow:0 2px 6px rgba(0,0,0,.55);align-self:end}
.gh2 small{font-size:13.5px;font-weight:600;opacity:.95;text-shadow:0 1px 4px rgba(0,0,0,.55);align-self:start}
.xgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin:12px 0}
.xcard{position:relative;display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:20px;border:2px solid color-mix(in srgb,var(--c1) 50%,var(--card));background:linear-gradient(150deg,color-mix(in srgb,var(--c2) 26%,var(--card)),color-mix(in srgb,var(--c1) 9%,var(--card)));color:var(--fg);text-decoration:none;box-shadow:0 4px 14px color-mix(in srgb,var(--c1) 18%,transparent);transition:transform .15s,box-shadow .15s,border-color .15s;overflow:hidden}
.xcard::after{content:"";position:absolute;right:-26px;top:-26px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c2) 40%,transparent),transparent 70%);pointer-events:none}
.xcard:hover,.xcard:focus-visible{transform:translateY(-4px) rotate(-.6deg);border-color:var(--c1);box-shadow:0 10px 22px color-mix(in srgb,var(--c1) 32%,transparent)}
.xcard .xs{display:grid;place-items:center;width:54px;height:54px;border-radius:17px;background:linear-gradient(145deg,var(--c1),var(--c2));font-size:28px;line-height:1;box-shadow:0 4px 10px color-mix(in srgb,var(--c1) 40%,transparent),inset 0 2px 0 rgba(255,255,255,.4)}
.xcard b{font-size:17px;margin-top:2px}
.xcard .xd{font-size:14px;color:var(--muted);line-height:1.4}
.thead{display:flex;gap:16px;align-items:center;padding:16px 18px;border-radius:22px;margin:8px 0 16px;color:#fff;background:linear-gradient(120deg,rgba(0,0,0,.22),rgba(0,0,0,0)),linear-gradient(120deg,var(--c1),color-mix(in srgb,var(--c2) 70%,var(--c1)));box-shadow:0 8px 22px color-mix(in srgb,var(--c1) 35%,transparent);position:relative;overflow:hidden}
.thead::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 92% 0%,rgba(255,255,255,.3),transparent 50%);pointer-events:none}
.tsym{display:grid;place-items:center;flex:none;width:62px;height:62px;border-radius:20px;background:rgba(255,255,255,.24);border:1px solid rgba(255,255,255,.45);font-size:34px}
.thead h1{color:#fff;margin:0;font-size:26px;text-shadow:0 2px 5px rgba(0,0,0,.3)}
.thead .sub{color:rgba(255,255,255,.96);margin:4px 0 0;font-size:15px;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.thead>div{min-width:0}
@media (max-width:599px){.hero{height:340px;border-radius:20px}.hero-t{padding:16px 16px 30px}.hero h1{font-size:30px}.hero-s{font-size:14.5px}.gland{height:104px}.hero-s{max-width:none}.gh2 span{width:44px;height:44px;font-size:23px}.gh2 b{font-size:18px}.thead{padding:14px;gap:12px}.tsym{width:50px;height:50px;font-size:27px;border-radius:16px}.thead h1{font-size:21px}.xgrid{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){.lights i{animation:none}.xcard{transition:none}}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin:12px 0}
.rtile{display:flex;flex-direction:column;gap:4px;padding:8px;border-radius:16px;border:2px solid var(--line,#ddd);background:var(--card);color:var(--fg);text-align:left;cursor:pointer;font:inherit;transition:transform .15s,box-shadow .15s}
.rtile:hover,.rtile:focus-visible{transform:translateY(-3px);box-shadow:0 8px 18px rgba(0,0,0,.2)}
.rtile.on{border-color:#c8202a;box-shadow:0 0 0 3px rgba(200,32,42,.25)}
.rpic{position:relative;aspect-ratio:5/3;border-radius:12px;overflow:hidden}.rpic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rtn{font-weight:700;padding:0 4px}.rtm{font-size:.82em;opacity:.75;padding:0 4px 4px}
.rbig .rpic{border-radius:16px}
.plsec{margin:12px 0}.plsec h2{margin:0 0 6px}
.plsec.now{border-color:#2a9a4a;box-shadow:0 0 0 4px rgba(42,154,74,.22)}
.badge{font-size:12px;background:#2a9a4a;color:#fff;border-radius:99px;padding:2px 9px;vertical-align:middle;font-weight:700}
.plrow{display:flex;align-items:center;gap:10px;margin:4px 0;padding:7px 6px;border-radius:10px}
.plrow:hover{background:var(--soft)}.plrow span{flex:1}.plrow.on span{text-decoration:line-through;opacity:.55}
.resteps{padding-left:22px;line-height:1.55}.resteps li{margin:9px 0}
.wcard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.wlang{color:var(--muted);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.wgr{font-size:22px;font-weight:800;line-height:1.25;overflow-wrap:anywhere}
.wcard .row{justify-content:center}.wcard.big .wgr{font-size:32px}
.wi.big .wt{font-size:20px;font-weight:700}
.sheet{--pc:#b3202f;--pb:#fff3f0;--pl:#e8b4b8}
.sheet-tisch,.sheet-anh{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tkarte{border:3px solid var(--pc);border-radius:14px;background:var(--pb);color:var(--pc);text-align:center;padding:16px 8px;aspect-ratio:2/1.1;display:flex;flex-direction:column;justify-content:center;gap:4px;box-shadow:inset 0 0 0 4px var(--pb),inset 0 0 0 5px var(--pl)}
.tk-n{font:800 28px/1.1 Georgia,"Times New Roman",serif;overflow-wrap:anywhere}
.tk-s{letter-spacing:.3em;font-size:13px;color:var(--pl)}.tk-s.small{letter-spacing:.1em;font-size:12px;color:var(--pc);opacity:.8}
.mkarte{max-width:440px;margin:0 auto;border:5px double var(--pc);border-radius:12px;background:var(--pb);color:var(--pc);padding:28px 22px;text-align:center;font-family:Georgia,"Times New Roman",serif}
.mk-t{font-size:30px;font-weight:700;line-height:1.15;margin:6px 0;overflow-wrap:anywhere}.mk-u{font-size:15px;opacity:.85}
.mk-l{height:2px;width:70px;background:var(--pl);margin:14px auto}
.mk-g{margin:14px 0}.mk-g small{display:block;font:700 11px "Inter",system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;opacity:.7}.mk-g span{font-size:18px;overflow-wrap:anywhere}
.mk-o{letter-spacing:.4em;color:var(--pl)}
.anh{position:relative;border:2px solid var(--pc);border-radius:12px;background:var(--pb);color:var(--pc);padding:28px 10px 14px;text-align:center}
.anh-h{position:absolute;top:9px;left:50%;width:13px;height:13px;border-radius:50%;border:2px solid var(--pc);background:var(--bg);transform:translateX(-50%)}
.anh-t{font:800 18px/1.2 Georgia,"Times New Roman",serif;overflow-wrap:anywhere}.anh-n{margin-top:8px;overflow-wrap:anywhere}.anh-v{font-size:14px;opacity:.85}.blank{opacity:.6}
@page{size:A4;margin:12mm}
@media print{
  .lights,.hero,.hero-z,.thead,.gsec{display:none!important}
  .xtwo.keep>.card{display:block!important;border:none;box-shadow:none}
  .sheet-tisch,.sheet-anh{gap:8mm}
  .tkarte,.anh,.mkarte{-webkit-print-color-adjust:exact;print-color-adjust:exact;break-inside:avoid}
  .plrow button{display:none}
  .plsec{break-inside:avoid;border:none}
}
