let DOCS = null, VOCAB = null;
const nrm = t => String(t||"").toLowerCase().replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u").replace(/ß/g,"ss").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ae/g,"a").replace(/oe/g,"o").replace(/ue/g,"u");
function lev(a,b,m){ if (Math.abs(a.length-b.length)>m) return m+1; let p=[...Array(b.length+1).keys()]; for(let i=1;i<=a.length;i++){ const c=[i]; let mn=i; for(let j=1;j<=b.length;j++){ c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); if(c[j]<mn) mn=c[j]; } if(mn>m) return m+1; p=c; } return p[b.length]; }
async function sucheVorbereiten(){
  if (DOCS) return;
  if (!SUCHE) SUCHE = await holen("daten/suche.json");
  if (!EXTRA) { try { EXTRA = await holen("daten/suche-extra.json"); } catch(e){ EXTRA = []; } }
  DOCS = [];
  for (const [wid, sid, text] of SUCHE){
    const w = weltInfo(wid); const s = w && w.seiten.find(p => p.id === sid); if (!s) continue;
    DOCS.push({s:"studio",wid:w.id,t:nrm(s.titel+" "+(T(s.titel))), k:nrm((s.kurz||"")+" "+T(s.kurz||"")+" "+(w.name?T(w.name):"")), b:nrm(text), w:1, mk:()=>({chip:T(w.name), bg:hexOf(w.farbe), light:hell(w.farbe), titel:T(s.titel), kurz:s.kurz?T(s.kurz):"", href:'#/s/'+w.id+'/'+encodeURIComponent(s.id)})});
  }
  for (const [k, lv, href, t1, t2, s1, s2, text] of EXTRA)
    DOCS.push({s:(k==="de"?"de":"xm"),t:nrm(t1+" "+t2), k:nrm(s1+" "+s2), b:nrm(text), w:1, mk:()=>({chip:(WNAME[k]||[k,k])[LANG==="fr"?1:0]+(lv?" · "+lv:""), bg:WFARBE[k]||"#555", light:false, titel:LANG==="fr"?t2:t1, kurz:LANG==="fr"?s2:s1, href})});
  for (const [href, sym, t1, t2, s1, s2, kw] of WTOOLS)
    DOCS.push({s:"wz",t:nrm(t1+" "+t2), k:nrm(s1+" "+s2), b:nrm(kw), kw:nrm(kw), w:3, mk:()=>({chip:U("werkzeug"), bg:"linear-gradient(135deg,#e0703a,#e0527a)", light:false, titel:sym+" "+(LANG==="fr"?t2:t1), kurz:LANG==="fr"?s2:s1, href})});
  VOCAB = new Set(); const rx=/[a-z0-9]{4,}/g;
  for (const d of DOCS){ for (const part of [d.t,d.k]) (part.match(rx)||[]).forEach(x=>VOCAB.add(x)); }
}
function varianten(w){
  const v = new Set([w]); (SYN[w]||[]).forEach(x=>v.add(nrm(x)));
  if (w.length>=4){ const m = w.length>=7?2:1; for (const x of VOCAB){ if (x.startsWith(w)||w.startsWith(x)&&x.length>=4){ v.add(x); continue; } if (w.length>=5 && Math.abs(x.length-w.length)<=m && lev(w,x,m)<=m) v.add(x); } }
  return [...v].slice(0,24);
}
function bewerte(d, vars){ // vars: Array je Suchwort -> Varianten; gibt {sc, hit} zurück
  let sc = 0, hit = 0;
  for (const vs of vars){
    let best = 0;
    for (let i=0;i<vs.length;i++){ const x = vs[i], pen = i===0?1:0.6;
      let s = 0;
      if (d.t.includes(x)) s = new RegExp("(^|[^a-z0-9])"+x.replace(/[^a-z0-9]/g,"")).test(d.t)? 12 : 8;
      else if (d.kw && d.kw.includes(x)) s = 9;
      else if (d.k.includes(x)) s = 4;
      else if (d.b.includes(x)) s = 1.5;
      best = Math.max(best, s*pen);
    }
    if (best>0) hit++; sc += best;
  }
  return {sc: sc*d.w, hit};
}
async function sucheAnzeigen(q, scope){
  q = decodeURIComponent(q||"").trim();
  document.title = q+" – Oratio Place";brand(scope==="studio"||(scope&&scope.startsWith("w:"))?"studio":"place");
  await sucheVorbereiten();
  const worte = nrm(q).split(/[^a-z0-9+#.]+/).filter(Boolean);
  let res = [], teil = false;
  if (worte.length){
    const vars = worte.map(varianten);
    const alle = DOCS.filter(d => !scope || (scope.startsWith("w:") ? d.wid===scope.slice(2) : d.s===scope)).map(d => ({d, ...bewerte(d, vars)})).filter(x => x.hit>0);
    let voll = alle.filter(x => x.hit===worte.length);
    if (!voll.length) { teil = true; voll = alle; }
    voll.sort((a,b) => (b.hit-a.hit) || (b.sc-a.sc));
    res = voll.slice(0,100).map(x => x.d.mk());

  const lk = scope && scope!=="studio" && !scope.startsWith("w:") ? '<div class="crumb"><a href="#/">'+esc(U("place"))+'</a> › <a href="'+(scope==="de"?"deutsch.html":"weihnachten.html")+'">'+esc(scope==="de"?U("deN"):U("xmN"))+'</a></div><input id="lq" class="in" type="search" autocomplete="off" value="'+esc(q)+'" placeholder="'+esc(U(scope==="de"?"sucheDe":"sucheXm"))+'" style="margin:8px 0">' : '';
  app.innerHTML = lk+'<h1>“'+esc(q)+'”</h1><p class="sub">'+res.length+' '+U("treffer")+(teil?' – '+U("teilw"):'')+'</p><div class="treffer">'+res.map(r =>
    '<a href="'+esc(r.href)+'"><span class="chip'+(r.light?" light":"")+'" style="background:'+r.bg+'">'+esc(r.chip)+'</span><b>'+esc(r.titel)+'</b>'+(r.kurz?'<small>'+esc(r.kurz)+'</small>':'')+'</a>').join("")+'</div>'
    + (res.length ? "" : '<p>'+U("keine")+'</p>');
  const lq = $("#lq"); if (lq) { lq.addEventListener("input", () => { clearTimeout(st); const v = lq.value.trim(); st = setTimeout(() => { location.hash = v ? "#/qs/"+scope+"/"+encodeURIComponent(v) : "#/"; }, 320); }); }
  app.querySelectorAll('a[href*="?r="]').forEach(a => a.addEventListener("click", ev => { const m = a.getAttribute("href").match(/^(.*)\?r=(.*)$/); if (m) { ev.preventDefault(); try { sessionStorage.setItem("xm-rez", m[2]); } catch(e){} location.href = m[1]; } }));
}

async function route(){

  const imStudio = ["studio","w","s","qw"].includes(p[0]) || (p[0]==="qs" && p[1]==="studio");
