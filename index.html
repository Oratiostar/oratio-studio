function hell(f){ const h = hexOf(f).replace("#",""); const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16); return (0.299*r+0.587*g+0.114*b) > 165; }
function dunkler(f, k){ const h = hexOf(f).replace("#",""); const c=[0,2,4].map(i=>Math.round(parseInt(h.substr(i,2),16)*k)); return "rgb("+c.join(",")+")"; }
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
let LANG = "de", FR = null, INDEX = null, SUCHE = null;

const U = k => UI[LANG][k];

/* Mini-Markup wie in Studio: **fett**, `code`, [[farbe:text]], \n */
function md(t){
  let s = esc(T(String(t)));
  s = s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code>$1</code>");
  s = s.replace(/\[\[(#?\w+):(.+?)\]\]/g,(m,c,x)=>'<b style="color:'+(FARBEN[c]||c)+'">'+x+'</b>');
  return s.replace(/\n/g,"<br>");
}

/* ============================================================ Daten laden */
async function holen(pfad){ const r = await fetch(pfad); if(!r.ok) throw new Error(pfad); return r.json(); }
async function welt(id){ if(!WELT[id]) WELT[id] = await holen("daten/welt_"+id+".json"); return WELT[id]; }
async function vergl(id){ if(!(id in VERGL)){ VERGL[id] = (INDEX.vergleich||[]).includes(id) ? await holen("daten/vergleich_"+id+".json") : {}; } return VERGL[id]; }
const weltInfo = id => INDEX.welten.find(w => w.id === id);

/* ============================================================ Rechner (wie tb_kern.py) */
const PRE = {p:1e-12,n:1e-9,u:1e-6,"µ":1e-6,m:1e-3,k:1e3,K:1e3,M:1e6,G:1e9,T:1e12};
function parseSI(text){
  if (text === null || text === undefined) return null;
  let t = String(text).trim().replace(/,/g,".").replace(/Ω|ohm|Ohm/g,"");
  if (!t) return null;
  let m = t.match(/^([+-]?\d+)([pnuµmkKMGTR])(\d+)$/);
  if (m) return parseFloat(m[1]+"."+m[3]) * (m[2]==="R" ? 1 : PRE[m[2]]);
  m = t.match(/^([+-]?(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?)\s*([pnuµmkKMGT]?)\s*([A-Za-z°%\/]*)$/);
  if (!m) return null;

    '<a class="welt" data-k="'+weltKat(w.id).join(" ")+'" href="#/w/'+w.id+'"><div class="kopf'+(hell(w.farbe)?" light":"")+'" style="background:'+hexOf(w.farbe)+'"><div class="ic">'+weltSym(w)+'</div><b>'+esc(T(w.name))+'</b></div><div class="t"><div class="n">'+w.seiten.length+' '+U("seiten")+'</div>'+esc(T(w.untertitel))+'</div></a>').join("")
    + [["icon-werkstatt.html","🎨","linear-gradient(135deg,#2f66d0,#8a5ad8)","icN","icT"],["datei-werkstatt.html","🗂️","linear-gradient(135deg,#e0703a,#e0527a)","dtN","dtT"]].map(x =>
      '<a class="welt" data-k="werkzeuge" href="'+x[0]+'"><div class="kopf" style="background:'+x[2]+'"><div class="ic">'+x[1]+'</div><b>'+esc(U(x[3]))+'</b></div><div class="t"><div class="n">'+esc(U("icZ"))+'</div>'+esc(U(x[4]))+'</div></a>').join("");
  app.innerHTML = '<div class="crumb"><a href="#/">'+esc(U("place"))+'</a> › '+esc(U("studio"))+'</div><h1>Oratio Studio</h1><p class="sub">'+U("startsub")+'</p>'+chips+'<div class="grid">'+karten+'</div>';
  const filtere = () => {
    document.querySelectorAll(".kat").forEach(b => b.classList.toggle("on", b.dataset.k === KATWAHL));
    document.querySelectorAll(".grid .welt").forEach(a => { a.hidden = !(KATWAHL === "alle" || a.dataset.k.split(" ").includes(KATWAHL)); });
  };
  document.querySelectorAll(".kat").forEach(b => b.onclick = () => { KATWAHL = b.dataset.k; filtere(); });
  filtere();
}
function weltseite(id){
  const w = weltInfo(id); if (!w) return nichts();
  document.title = T(w.name)+" – Oratio Studio";brand("studio");
  const grp = new Map(); w.seiten.forEach(s => { const g = s.gruppe || ""; if(!grp.has(g)) grp.set(g, []); grp.get(g).push(s); });
  const offen = grp.size <= 3;
  let h = '<div class="crumb"><a href="#/">'+esc(U("place"))+'</a> › <a href="#/studio">'+esc(U("studio"))+'</a> › '+esc(T(w.name))+'</div>'+bannerHTML(w, w.name, w.untertitel)+'<input class="in" id="wf" placeholder="'+esc(U("filter"))+'" style="margin-bottom:6px">';
  h += '<div id="wl">'+[...grp].map(([g, ss]) => (g ? '<details class="gr"'+(offen?" open":"")+'><summary>'+esc(T(g))+'<span>'+ss.length+'</span></summary>' : '<div class="gr card" style="padding:0">')
     +'<div class="liste">'+ss.map(s=>'<a href="#/s/'+w.id+'/'+encodeURIComponent(s.id)+'" data-t="'+esc((T(s.titel)+" "+s.titel+" "+T(s.kurz||"")).toLowerCase())+'">'+esc(T(s.titel))+(s.kurz?'<small>'+esc(T(s.kurz))+'</small>':'')+'</a>').join("")+'</div>'+(g?'</details>':'</div>')).join("")+'</div>';
  app.innerHTML = h;
  $("#wf").addEventListener("input", e => { const q = e.target.value.toLowerCase().trim();
    document.querySelectorAll("#wl details").forEach(d => { let n = 0; d.querySelectorAll("a").forEach(a => { const ok = !q || a.dataset.t.includes(q); a.style.display = ok ? "" : "none"; if(ok) n++; }); d.style.display = n ? "" : "none"; if (q && n) d.open = true; }); });
}
async function seitenansicht(wid, sid){
  const w = weltInfo(wid); if (!w) return nichts();
  const wd = await welt(wid), s = wd.seiten.find(p => p.id === sid); if (!s) return nichts();
  document.title = T(s.titel)+" – Oratio Studio";brand("studio");
  let h = '<div class="crumb"><a href="#/">'+esc(U("place"))+'</a> › <a href="#/studio">'+esc(U("studio"))+'</a> › <a href="#/w/'+w.id+'">'+esc(T(w.name))+'</a> › '+esc(T(s.titel))+'</div>'+bannerHTML(w, s.titel, s.kurz, s.symbol);
  if (s.tags && s.tags.length) h += '<div class="tags">'+s.tags.filter(t=>t.length>2&&!/[\/()]/.test(t)).slice(0,10).map(t=>'<span class="tag">'+esc(t)+'</span>').join("")+'</div>';
  for (const b of s.bloecke){ const f = BAUSTEIN[b.t]; try { h += f ? f(b, w.farbe) : ""; } catch(e){ h += '<div class="platz">'+esc(b.t)+': '+esc(e.message)+'</div>'; } }
  if (s.siehe && s.siehe.length){
    const links = s.siehe.map(x => { const [a,b] = x.includes(":") ? x.split(":") : [wid, x]; const ww = weltInfo(a); const sp = ww && ww.seiten.find(p=>p.id===b); return sp ? '<a href="#/s/'+a+'/'+encodeURIComponent(b)+'">'+esc(T(sp.titel))+'</a>' : ""; }).join("");
    if (links) h += '<h2 class="h">'+U("siehe")+'</h2><div class="siehe">'+links+'</div>';
  }
  app.innerHTML = h; window.scrollTo(0,0);
}
async function sucheAnzeigen(q){
  q = decodeURIComponent(q||"").trim();
  document.title = q+" – Oratio Studio";brand("studio");
  if (!SUCHE) SUCHE = await holen("daten/suche.json");
  const worte = q.toLowerCase().split(/\s+/).filter(Boolean), res = [];
  if (worte.length) for (const [wid, sid, text] of SUCHE){
    const w = weltInfo(wid); const s = w && w.seiten.find(p => p.id === sid); if (!s) continue;
    const titel = (T(s.titel)+" "+s.titel).toLowerCase(), kurz = (T(s.kurz||"")+" "+(s.kurz||"")).toLowerCase(), all = titel+" "+kurz+" "+text;
    if (!worte.every(x => all.includes(x))) continue;
    let sc = 0; worte.forEach(x => { if (titel.includes(x)) sc += 5; if (kurz.includes(x)) sc += 2; });
    res.push([sc, w, s]);
  }
  res.sort((a,b) => b[0]-a[0]);
  app.innerHTML = '<h1>“'+esc(q)+'”</h1><p class="sub">'+res.length+' '+U("treffer")+'</p><div class="treffer">'+res.slice(0,80).map(([_, w, s]) =>
    '<a href="#/s/'+w.id+'/'+encodeURIComponent(s.id)+'"><span class="chip'+(hell(w.farbe)?" light":"")+'" style="background:'+hexOf(w.farbe)+'">'+esc(T(w.name))+'</span><b>'+esc(T(s.titel))+'</b>'+(s.kurz?'<small>'+esc(T(s.kurz))+'</small>':'')+'</a>').join("")+'</div>'
    + (res.length ? "" : '<p>'+U("keine")+'</p>');
}
function nichts(){ app.innerHTML = '<p>'+U("weg")+' <a href="#/studio">'+U("studio")+'</a></p>'; }

async function route(){
  const p = decodeURIComponent((location.hash || "#/").slice(1)).split("/").filter(Boolean);
  try {
    if (!p.length) placeseite();
    else if (p[0] === "studio") startseite();
    else if (p[0] === "lifestyle") lifestyleseite();
    else if (p[0] === "w") weltseite(p[1]);
    else if (p[0] === "s") await seitenansicht(p[1], p.slice(2).join("/"));
    else if (p[0] === "q") await sucheAnzeigen(p.slice(1).join("/"));
    else nichts();
  } catch(e){ app.innerHTML = '<p>'+esc(e.message)+'</p>'; }
  $("#q").placeholder = U("suche");
}

/* ============================================================ Kopfleiste */
function theme(){ let t = "auto"; try { t = localStorage.getItem("theme") || "auto"; } catch(e){} return t; }
function setTheme(t){ if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t); }
function beschrifte(){ $("#bLang").textContent = LANG === "de" ? "🇫🇷 FR" : "🇩🇪 DE"; const t = theme(); $("#bTheme").textContent = t==="dark" ? "🌙 "+U("dunkel") : t==="light" ? "☀️ "+U("hellm") : "🖥️ "+U("auto");
  $("#fuss").innerHTML = esc(U("stand"))+' · <a href="impressum.html">'+U("imp")+'</a>'; document.documentElement.lang = LANG; }
$("#bTheme").onclick = () => { const n = {auto:"dark",dark:"light",light:"auto"}[theme()]; try { localStorage.setItem("theme", n); } catch(e){} setTheme(n); beschrifte(); route(); };
$("#bLang").onclick = async () => { LANG = LANG === "de" ? "fr" : "de"; try { localStorage.setItem("lang", LANG); } catch(e){} await frLaden(); beschrifte(); route(); };
let st; $("#q").addEventListener("input", e => { clearTimeout(st); const v = e.target.value; st = setTimeout(() => { location.hash = v.trim() ? "#/q/"+encodeURIComponent(v.trim()) : "#/studio"; }, 280); });
async function frLaden(){ if (LANG === "fr" && FR === null) { try { FR = await holen("daten/sprache_fr.json"); } catch(e){ FR = {}; } } }

(async function start(){
  setTheme(theme());
  try { INDEX = await holen("daten/index.json"); await frLaden(); beschrifte(); window.addEventListener("hashchange", route); route(); }
  catch(e){ app.innerHTML = '<p>Daten konnten nicht geladen werden. Bitte die Seite über einen Webserver öffnen (nicht direkt als Datei).</p>'; }
})();
</script>
