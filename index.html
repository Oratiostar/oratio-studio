body.sl.gta::before{background:var(--hero) bottom center/min(900px,160%) auto no-repeat;opacity:.55}
html:root body.sl.gta header{background:var(--gbar);border-bottom:2px solid var(--gp);box-shadow:0 2px 18px rgba(255,46,136,.45)}
html:root body.sl.gta header,html:root body.sl.gta header a,html:root body.sl.gta header b{color:var(--gbarx)}
html:root body.sl.gta .crumb{background:var(--gs);color:var(--gm);border:1px solid var(--gline);box-shadow:0 0 12px rgba(255,46,136,.3)}
html:root body.sl.gta .crumb a{color:var(--gh)}
html:root body.sl.gta .ribbon{background:linear-gradient(90deg,#c2155f,#d1480e)!important;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.45);box-shadow:0 0 18px rgba(255,46,136,.55)}
html:root body.sl.gta .ribbon::after{border-top-color:#7a0a47}
html:root body.sl.gta .in,html:root body.sl.gta #sq{background:var(--gs);color:var(--gx);border:1px solid var(--gline)}
html:root body.sl.gta #sq::placeholder,html:root body.sl.gta .in::placeholder{color:var(--gm)!important}
html:root body.sl.gta .ph{background:var(--gph);box-shadow:0 0 22px rgba(255,46,136,.5),0 4px 0 rgba(0,0,0,.3)}
html:root body.sl.gta .ph h1{color:var(--gphx);font-family:"Poppins","Inter",sans-serif;font-style:italic;letter-spacing:.04em;text-shadow:none}
html:root body.sl.gta .phbad{background:#fff;border-color:var(--gt);box-shadow:0 0 14px var(--gt)}
html:root body.sl.gta .phsub{background:var(--gs);color:var(--gm);border:1px solid var(--gline)}
html:root body.sl.gta .phsub em,html:root body.sl.gta .phsub .phw{color:var(--gh)!important;font-weight:700}
html:root body.sl.gta .slnav a{background:var(--gnav);color:var(--gnavx);border-left-color:var(--gp);box-shadow:0 0 0 1px var(--gline)}
html:root body.sl.gta .slnav a.act{background:linear-gradient(90deg,#ff3d97,#ff9a3c)!important;color:#2a0a3a;border-left-color:var(--gy);box-shadow:0 0 16px rgba(255,46,136,.55);text-shadow:none}
html:root body.sl.gta .slmain{background:var(--gs);border:1px solid var(--gline);box-shadow:0 0 28px rgba(255,46,136,.25),0 14px 30px -10px rgba(0,0,0,.45);color:var(--gx)}
html:root body.sl.gta .slmain::before{content:"";display:block;height:118px;margin:-16px -22px 14px;border-radius:19px 19px 0 0;background:var(--hero) center bottom/cover no-repeat;border-bottom:3px solid var(--gp)}
html:root body.sl.gta .slmain h2.h{color:var(--gh);border-bottom:3px solid var(--gp);font-variant:normal;text-transform:uppercase;font-style:italic;font-family:"Poppins","Inter",sans-serif;letter-spacing:.05em;font-size:18px}
html:root body.sl.gta .slmain .txt,html:root body.sl.gta .slmain p,html:root body.sl.gta .slmain li,html:root body.sl.gta .slmain td{color:var(--gx)}
html:root body.sl.gta .slmain b,html:root body.sl.gta .slmain strong{color:inherit;font-weight:800}
html:root body.sl.gta .slmain a{color:var(--gl);font-weight:700}
html:root body.sl.gta .tw{background:rgba(255,255,255,.04);border:1px solid var(--gline)}
html:root body.sl.gta .slmain .tw{border:1px solid var(--gline);box-shadow:0 0 14px rgba(255,46,136,.2)}
html:root body.sl.gta .tw .ti,html:root body.sl.gta .slmain th{background:var(--gth)!important;color:#fff}
html:root body.sl.gta .slmain tbody tr:nth-child(odd) td{background:rgba(255,255,255,.35)}
html:root body.sl.gta .slmain tbody tr:nth-child(even) td{background:rgba(255,46,136,.09)}
html:root body.sl.gta .slmain td{border-top:1px solid rgba(255,46,136,.18)}
html:root body.sl.gta .slmain td.b{color:var(--gh)}
html:root body.sl.gta .hint{background:var(--gs2);border:1px solid var(--gline);border-left:7px solid var(--c);color:var(--gx)}
html:root body.sl.gta .hint b.k{color:var(--gh)}
html:root body.sl.gta .tag,html:root body.sl.gta .slmain .tag{background:var(--gtagb);color:var(--gtag);border:1px solid var(--gline)}
html:root body.sl.gta .slmain .formel,html:root body.sl.gta .slmain .rech{background:var(--gs2);border:1px solid var(--gt);color:var(--gx)}
html:root body.sl.gta .slmain .siehe a,html:root body.sl.gta .siehe a{background:var(--gtagb);border:1px solid var(--gp);color:var(--gtag)}
html:root body.sl.gta .schbtn,html:root body.sl.gta .slmain a.knopf{background:linear-gradient(90deg,#ff3d97,#ff9a3c);color:#2a0a3a}
html:root body.sl.gta details.gr{background:var(--gs);border:1px solid var(--gline);box-shadow:0 0 18px rgba(255,46,136,.28)}
html:root body.sl.gta details.gr>summary{color:var(--gh);font-family:"Poppins","Inter",sans-serif;text-transform:uppercase;font-style:italic;letter-spacing:.04em}
html:root body.sl.gta details.gr>summary span{color:var(--gx)}
html:root body.sl.gta #wl .liste a{background:var(--gs2);border:1px solid var(--gline);color:var(--gx)}
html:root body.sl.gta #wl .liste a b{color:var(--gx)}

      suche:"Alles durchsuchen …",welten:"Alle Welten",seiten:"Seiten",startsub:"Elektronik & Informatik zum Nachschlagen",weltW:"Wähle deine Welt",sucheSt:"Suchen … z. B. 7400, I²C, chmod, Ohm",sucheXm:"In der Weihnachtswelt suchen …",sucheDe:"Im Deutschkurs suchen …",tips:["Nicht jedes USB-C-Kabel kann alles: Es gibt reine Ladekabel (USB 2.0), Datenkabel (5/10/20 Gbit/s) und Videoübertragung (DisplayPort).","Eine LED braucht immer einen Vorwiderstand, sonst brennt sie durch.","Elkos sind gepolt: Der Streifen am Gehäuse markiert den Minuspol.","Die GPIO-Pins des Raspberry Pi vertragen nur 3,3 V – 5 V können ihn zerstören.","Parallelschaltung: Der Gesamtwiderstand ist immer kleiner als der kleinste Einzelwiderstand.","Ohmsches Gesetz: U = R × I – daraus folgen auch I = U / R und R = U / I.","Beim Löten erst die Spitze verzinnen, dann Pad und Anschlussbein gleichzeitig erwärmen.","I²C braucht zwei Pull-up-Widerstände, meist 4,7 kΩ nach VCC.","1 kB sind 1000 Byte, 1 KiB sind 1024 Byte.","Große Kondensatoren vor dem Anfassen über einen Widerstand entladen.","Ohmsches Gesetz: U = R · I. Mit zwei Werten kennst du immer den dritten.","Leistung: P = U · I. Ein Widerstand mit 0,25 W wird bei mehr Leistung heiß und brennt durch.","In der Reihenschaltung addieren sich Widerstände, in der Parallelschaltung wird der Gesamtwert kleiner als der kleinste.","Ein Spannungsteiler aus 1 kΩ und 2 kΩ macht aus 5 V etwa 3,3 V – gut für Signale, nicht für Lasten.","Die Farbringe eines Widerstands liest du von der Seite, an der die Ringe dichter am Rand sitzen.","Kondensator-Aufdruck 104 heißt 10 und vier Nullen in Pikofarad: 100 nF.","Jeder IC bekommt 100 nF direkt zwischen Plus und Masse. Das verhindert viele rätselhafte Fehler.","Nach der Zeit τ = R · C ist ein Kondensator zu 63 % geladen, nach 5 τ praktisch voll.","Eine rote LED braucht etwa 2 V, eine blaue oder weiße etwa 3 V.","Bei der LED ist das längere Bein die Anode (Plus), die abgeflachte Gehäuseseite die Kathode.","An einer Siliziumdiode fallen etwa 0,7 V ab, an einer Schottky-Diode nur etwa 0,3 V.","Relais und Motoren brauchen eine Freilaufdiode, sonst zerstört die Abschaltspitze den Transistor.","Ein Transistor als Schalter: Basisstrom etwa ein Zehntel des Laststroms, dann schaltet er sicher durch.","Für 3,3-V-Logik brauchst du einen Logic-Level-MOSFET. Ein IRF540 schaltet damit nicht richtig durch.","Ein MOSFET-Gate braucht einen Widerstand nach Masse, sonst schaltet er beim Einschalten zufällig.","Der 7805 braucht mindestens 7 V am Eingang. Was darüber liegt, wird Wärme.","LM317: Ausgangsspannung = 1,25 V · (1 + R2/R1). R1 ist meist 240 Ω.","Ein Schaltregler ist bei großem Spannungsunterschied viel sparsamer als ein Linearregler.","Ein Operationsverstärker mit Gegenkopplung regelt so, dass beide Eingänge gleiche Spannung haben.","Der LM358 kommt am Ausgang nur bis etwa 1,5 V unter die Versorgung. Für mehr brauchst du einen Rail-to-Rail-Typ.","Ein Komparator wie der LM393 hat einen offenen Kollektor – ohne Pull-up-Widerstand kommt nichts heraus.","NE555 astabil: f ≈ 1,44 / ((R1 + 2·R2) · C).","NE555 monostabil: Die Impulsdauer ist 1,1 · R · C.","Ein Uhrenquarz schwingt mit 32 768 Hz. 15-mal halbiert ergibt das genau 1 Hz.","Offene CMOS-Eingänge fangen Störungen ein. Unbenutzte Eingänge immer an Plus oder Masse legen.","Mit NAND-Gattern allein lässt sich jede andere Logikfunktion bauen.","74HC arbeitet von 2 bis 6 V, 74HCT versteht zusätzlich TTL-Pegel, 74LS braucht genau 5 V.","Das 74HC595 macht aus drei Mikrocontroller-Pins acht Ausgänge – und lässt sich beliebig verketten.","Ein Taster prellt: Er schließt mehrmals in wenigen Millisekunden. Entprellen mit R-C oder per Software.","Ein Pull-up-Widerstand von 10 kΩ gibt einem Eingang einen sicheren Ruhepegel.","Ein Flip-Flop speichert genau ein Bit. Verbindest du /Q mit D, halbiert es den Takt.","Hexadezimal: Eine Ziffer steht für genau vier Bit. 0xFF ist 255.","Ein Byte hat 8 Bit und kann 256 verschiedene Werte annehmen.","I²C braucht nur zwei Leitungen, SDA und SCL – und zwei Pull-up-Widerstände, meist 4,7 kΩ.","Bei UART wird gekreuzt: TX des einen Geräts geht an RX des anderen.","SPI ist schnell, braucht aber für jedes Gerät eine eigene Chip-Select-Leitung.","Ein GPIO-Pin des Raspberry Pi liefert höchstens etwa 16 mA, alle zusammen etwa 50 mA.","Der Arduino Uno arbeitet mit 5 V, ESP32 und Raspberry Pi mit 3,3 V. Dazwischen gehört ein Pegelwandler.","Der Raspberry Pi hat keinen analogen Eingang. Dafür nimmst du einen Wandler wie den MCP3008.","Ein 10-Bit-ADC teilt die Spannung in 1024 Stufen. Bei 5 V sind das etwa 4,9 mV pro Stufe.","PWM schaltet sehr schnell ein und aus. Der Tastgrad bestimmt die mittlere Spannung.","Ein Servo erwartet alle 20 ms einen Impuls von 1 bis 2 ms Länge.","Servos und Motoren nie aus dem Mikrocontroller-Pin versorgen. Eigene Versorgung, gemeinsame Masse.","Beim Messen mit dem Multimeter: Spannung parallel zum Bauteil, Strom in Reihe.","Vor dem Messen von Widerständen die Schaltung spannungsfrei machen.","Beim Oszilloskop gehört die Masseklemme an die Schaltungsmasse – sie ist mit dem Schutzleiter verbunden.","Gutes Löten: Erst Lötstelle und Draht erhitzen, dann das Lot zuführen. Die Stelle glänzt kegelförmig.","Fehlersuche beginnt immer mit der Versorgung: Liegt die richtige Spannung direkt am IC an?","Eine gemeinsame Masse ist Pflicht, wenn zwei Schaltungen Signale austauschen.","Ein Optokoppler trennt zwei Stromkreise: Innen überträgt nur Licht das Signal.","Ein Dezibel-Merkwert: +6 dB heißt doppelte Spannung, +20 dB zehnfache Spannung.","Ein RC-Tiefpass hat die Grenzfrequenz f = 1 / (2π · R · C).","Wechselspannung aus der Steckdose: 230 V ist der Effektivwert, die Spitze liegt bei etwa 325 V.","Ein Li-Ion-Akku hat 3,7 V Nennspannung, voll 4,2 V. Unter etwa 3 V nimmt er Schaden.","Akku-Laufzeit grob: Kapazität in mAh geteilt durch den Strom in mA ergibt Stunden.","Der Raspberry Pi 5 braucht ein Netzteil mit 5 V und 5 A, sonst drosselt er die USB-Anschlüsse.","Eine IPv roche GPIO du Raspberry Pi fournit au plus 16 mA, 50 mA au total.","L’Arduino Uno travaille en 5 V, l’ESP32 et le Raspberry Pi en 3,3 V : il faut un convertisseur de niveau.","Le Raspberry Pi n’a pas d’entrée analogique : utilise un convertisseur comme le MCP3008.","Un CAN 10 bits divise la tension en 1024 pas, soit environ 4,9 mV à 5 V.","La PWM commute très vite ; le rapport cyclique fixe la tension moyenne.","Un servo attend toutes les 20 ms une impulsion de 1 à 2 ms.","N’alimente jamais servos et moteurs par une broche : alimentation séparée, masse commune.","Au multimètre : la tension se mesure en parallèle, le courant en série.","Avant de mesurer une résistance, coupe l’alimentation du circuit.","La pince de masse de l’oscilloscope va sur la masse du circuit ; elle est reliée à la terre.","Bonne soudure : chauffe d’abord la pastille et le fil, puis apporte l’étain.","Le dépannage commence par l’alimentation : la bonne tension arrive-t-elle sur le CI ?","Une masse commune est obligatoire dès que deux circuits échangent des signaux.","Un optocoupleur sépare deux circuits : seul la lumière transmet le signal.","Repère en décibels : +6 dB double la tension, +20 dB la décuple.","Un filtre RC passe-bas a pour fréquence de coupure f = 1 / (2π · R · C).","Secteur : 230 V est la valeur efficace, la crête atteint environ 325 V.","Un accu Li-ion a 3,7 V nominaux, 4,2 V chargé ; sous 3 V environ il s’abîme.","Autonomie : capacité en mAh divisée par le courant en mA donne des heures.","Le Raspberry Pi 5 exige une alimentation 5 V 5 A, sinon il bride ses ports USB.","Une adresse IPv4 a 32 bits ; le masque /24 laisse 254 adresses pour les appareils.","ESD : une étincelle imperceptible peut déjà détruire un composant CMOS.","Les fils de pontage fins supportent à peine 1 A : pour moteurs et rubans LED, prends plus gros.","Un trigger de Schmitt a deux seuils : il transforme un signal lent en front net."],

const PRE = {p:1e-12,n:1e-9,u:1e-6,"µ":1e-6,m:1e-3,k:1e3,K:1e3,M:1e6,G:1e9,T:1e12};
function parseSI(text){
  if (text === null || text === undefined) return null;
  let t = String(text).trim().replace(/,/g,".").replace(/Ω|ohm|Ohm/g,"");
  if (!t) return null;
  let m = t.match(/^([+-]?\d+)([pnuµmkKMGTR])(\d+)$/);
  if (m) return parseFloat(m[1]+"."+m[3]) * (m[2]==="R" ? 1 : PRE[m[2]]);
  m = t.match(/^([+-]?(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?)\s*([pnuµmkKMGT]?)\s*([A-Za-z°%\/]*)$/);
  if (!m) return null;
  return parseFloat(m[1]) * (m[2] ? PRE[m[2]] : 1);
}
function g4(v, n){ let s = Number(v).toPrecision(n); if (s.indexOf("e")>=0) return null; return String(parseFloat(s)); }

  unit = unit || "";

  if (v === null || !isFinite(v)) return "–";
  if (v === 0) return ("0 "+unit).trim();
  const a = Math.abs(v); let f = 1e-12, s = "p";
  for (const [ff,ss] of [[1e12,"T"],[1e9,"G"],[1e6,"M"],[1e3,"k"],[1,""],[1e-3,"m"],[1e-6,"µ"],[1e-9,"n"],[1e-12,"p"]]) { if (a >= ff*0.99995){ f=ff; s=ss; break; } }

  return (txt.replace(".",",")+" "+s+unit).trim();
}

  }

    DOCS.push({s:(k==="de"?"de":"xm"),t:nrm(t1+" "+t2), k:nrm(s1+" "+s2), b:nrm(text), w:1, mk:()=>({chip:(WNAME[k]||[k,k])[LANG==="fr"?1:0]+(lv?" · "+lv:""), bg:WFARBE[k]||"#555", light:false, titel:LANG==="fr"?t2:t1, kurz:LANG==="fr"?s2:s1, href})});
  for (const [k, lv, href, t1, t2, s1, s2, text] of ALLES)
    DOCS.push({s:"alles",t:nrm(t1+" "+t2), k:nrm(s1+" "+s2), b:nrm(text), w:k==="welt"?2:1, mk:()=>({chip:(WNAME[k]||[k,k])[LANG==="fr"?1:0], bg:WFARBE[k]||"#555", light:false, titel:LANG==="fr"?t2:t1, kurz:LANG==="fr"?s2:s1, href})});
  for (const [href, sym, t1, t2, s1, s2, kw] of WTOOLS)
    DOCS.push({s:"wz",t:nrm(t1+" "+t2), k:nrm(s1+" "+s2), b:nrm(kw), kw:nrm(kw), w:3, mk:()=>({chip:U("werkzeug"), bg:"linear-gradient(135deg,#e0703a,#e0527a)", light:false, titel:sym+" "+(LANG==="fr"?t2:t1), kurz:LANG==="fr"?s2:s1, href})});
  VOCAB = new Set(); const rx=/[a-z0-9]{4,}/g;

}
function varianten(w){
  const v = new Set([w]); (SYN[w]||[]).forEach(x=>v.add(nrm(x)));
  if (w.length>=4){ const m = w.length>=7?2:1; for (const x of VOCAB){ if (x.startsWith(w)||w.startsWith(x)&&x.length>=4){ v.add(x); continue; } if (w.length>=5 && Math.abs(x.length-w.length)<=m && lev(w,x,m)<=m) v.add(x); } }
  return [...v].slice(0,24);
}
function bewerte(d, vars){ // vars: Array je Suchwort -> Varianten; gibt {sc, hit} zurück
  let sc = 0, hit = 0;
  for (const vs of vars){
    let best = 0;
    for (let i=0;i<vs.length;i++){ const x = vs[i], pen = i===0?1:0.6;
      let s = 0;
      if (d.t.includes(x)) s = new RegExp("(^|[^a-z0-9])"+x.replace(/[^a-z0-9]/g,"")).test(d.t)? 12 : 8;
      else if (d.kw && d.kw.includes(x)) s = 9;
      else if (d.k.includes(x)) s = 4;
      else if (d.b.includes(x)) s = 1.5;
      best = Math.max(best, s*pen);
    }
    if (best>0) hit++; sc += best;
  }
  return {sc: sc*d.w, hit};
}
