<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sprachkurse – Oratio Place</title>
<meta name="description" content="Kostenlose Sprachkurse von A1 bis C1: Deutsch für Französischsprachige und Französisch für Deutschsprachige. Cours de langues gratuits.">
<meta property="og:title" content="Sprachkurse – Oratio Place">
<meta property="og:url" content="https://oratioplace.com/sprachkurse.html">
<meta property="og:image" content="https://oratioplace.com/vorschau.png">
<link rel="icon" href="logo-place.png">
<link rel="apple-touch-icon" href="logo-place.png">
<link rel="stylesheet" href="werkzeuge/wz.css">
<style>
body{background:linear-gradient(180deg,#e8f0ff,#fff1f4 55%,#fff6dc)!important;background-attachment:fixed}
:root[data-theme="dark"] body{background:#14192b!important}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background:#14192b!important}}
.crumb{font-size:14px;margin:4px 0 12px;color:var(--muted)}
.hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px;margin:18px 0}
.sc{display:flex;flex-direction:column;border-radius:24px;overflow:hidden;text-decoration:none;color:var(--fg);background:var(--card);border:2px solid var(--line);box-shadow:var(--shadow);transition:transform .15s}
@media (hover:hover){.sc:hover{transform:translateY(-4px)}}
.sc:focus-visible{outline:3px solid var(--acc,#2f5fd0);outline-offset:3px}
.sc .top{padding:26px 22px;color:#fff;display:flex;gap:16px;align-items:center}
.sc .top .big{font-size:46px;line-height:1}
.sc .top h2{margin:0;font-size:26px;color:#fff}.sc .top p{margin:4px 0 0;opacity:.95}
.sc .bd{padding:18px 22px 22px;line-height:1.55}
.sc .bd ul{margin:8px 0 14px;padding-left:20px}
.sc .go{display:inline-block;border-radius:12px;padding:9px 18px;font-weight:800;color:#fff}
.de .top{background:linear-gradient(120deg,#ff9f1a,#ff3b8a 50%,#7a4dff)}.de .go{background:#7a4dff}
.fr .top{background:linear-gradient(120deg,#1d4fd8,#4f7cff 55%,#e03131)}.fr .go{background:#1d4fd8}
.lv{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}.lv span{padding:3px 11px;border-radius:99px;font-weight:800;font-size:13px;color:#fff}
.info{border-radius:18px;padding:14px 18px;background:var(--card);border:1px solid var(--line);line-height:1.6;margin-bottom:20px}
</style>
</head>
<body>
<main id="hub" data-nt></main>
<script src="werkzeuge/wz.js"></script>
<script>
WZ.kopf("sprachkurse");
(function(){
var fr = WZ.lang === "fr", L = function(a, b){ return fr ? b : a; };
document.documentElement.lang = fr ? "fr" : "de";
document.title = L("Sprachkurse", "Cours de langues") + " – Oratio Place";
var lv = '<div class="lv"><span style="background:#2f9e44">A1</span><span style="background:#1c7ed6">A2</span><span style="background:#f08c00">B1</span><span style="background:#e8590c">B2</span><span style="background:#862e9c">C1</span></div>';
document.getElementById("hub").innerHTML =
 '<div class="crumb"><a href="index.html">Oratio Place</a> › ' + L("Sprachkurse", "Cours de langues") + '</div>' +
 '<h1>🗣️ ' + L("Sprachkurse", "Cours de langues") + '</h1>' +
 '<p>' + L("Zwei komplette Kurse von A1 bis C1, kostenlos, mit Erklärungen, Beispielen zum Anhören, Dialogen, Karteikarten und Übungen. Dein Fortschritt wird auf diesem Gerät gespeichert.", "Deux cours complets de A1 à C1, gratuits, avec explications, exemples audio, dialogues, cartes de vocabulaire et exercices. Ta progression est enregistrée sur cet appareil.") + '</p>' +
 '<div class="hub">' +
 '<a class="sc de" href="deutsch.html"><div class="top"><div class="big">🇩🇪</div><div><h2>' + L("Deutschkurs", "Cours d’allemand") + '</h2><p>' + L("Cours d’allemand · für Französischsprachige", "Pour francophones · Deutschkurs") + '</p></div></div><div class="bd">' + lv +
 '<ul><li>' + L("66 Lektionen mit Übungen", "66 leçons avec exercices") + '</li><li>' + L("Grammatik und Nachschlage-Bereich", "Grammaire et section de référence") + '</li><li>' + L("Aussprache, Wortschatz, Dialoge", "Prononciation, vocabulaire, dialogues") + '</li></ul><span class="go">' + L("Deutsch lernen →", "Apprendre l’allemand →") + '</span></div></a>' +
 '<a class="sc fr" href="franzoesisch.html"><div class="top"><div class="big">🇫🇷</div><div><h2>' + L("Französischkurs", "Cours de français") + '</h2><p>' + L("Cours de français · für Deutschsprachige", "Pour germanophones · Französischkurs") + '</p></div></div><div class="bd">' + lv +
 '<ul><li>' + L("Erklärungen auf Deutsch, Beispiele auf Französisch", "Explications en allemand, exemples en français") + '</li><li>' + L("Überall mit deutscher Übersetzung und Vorlesefunktion", "Partout avec traduction allemande et lecture audio") + '</li><li>' + L("Aussprache, Konjugation, Dialoge, Übungen", "Prononciation, conjugaison, dialogues, exercices") + '</li></ul><span class="go">' + L("Französisch lernen →", "Apprendre le français →") + '</span></div></a>' +
 '</div><div class="info"><b>' + L("Tipp:", "Astuce :") + '</b> ' + L("Die Vorlesefunktion (🔊) nutzt die Stimmen deines Geräts. Wenn eine Sprache nicht vorgelesen wird, installiere in den Geräteeinstellungen eine Sprachausgabe für Deutsch bzw. Französisch.", "La lecture audio (🔊) utilise les voix de ton appareil. Si une langue n’est pas lue, installe dans les réglages de l’appareil une voix pour l’allemand ou le français.") + '</div>';
})();
</script>
</body>
</html>
