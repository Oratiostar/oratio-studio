[2,"monitor",M("HDR einfach erklärt: HDR10, DisplayHDR 400/600/1000, Dimmzonen","Le HDR expliqué simplement : HDR10, DisplayHDR 400/600/1000, zones de rétroéclairage"),M("HDR (High Dynamic Range) bedeutet größeren Unterschied zwischen sehr hellen und sehr dunklen Bildteilen. Entscheidend sind Helligkeit (in Nits) und Kontrast:\n• HDR10: ein Eingangsformat. Ein Monitor kann „HDR10 akzeptieren“ und trotzdem kaum besser aussehen.\n• VESA DisplayHDR 400: Mindestniveau mit etwa 400 Nits, ohne richtige Dimmzonen oft kaum besser als SDR.\n• DisplayHDR 600/1000: Dimmzonen und deutlich hellere Spitzen, echtes HDR-Gefühl. Meist Mini-LED.\n• DisplayHDR True Black 400/500/600: der OLED-Standard. Spitzenhelligkeit ist geringer, aber echtes Schwarz sorgt für starken Kontrast.\nWindows 11: Einstellungen > System > Anzeige > HDR einschalten, dann „SDR-Inhalte“ auf angenehme Helligkeit stellen. Für Spiele HDR im Spiel prüfen, nicht jede Umsetzung ist gut.","Le HDR (High Dynamic Range) signifie un plus grand écart entre les zones très claires et très sombres. Ce qui compte, c'est la luminosité (en nits) et le contraste :\n• HDR10 : un format d'entrée. Un écran peut « accepter le HDR10 » sans paraître sensiblement meilleur.\n• VESA DisplayHDR 400 : niveau minimal avec environ 400 nits ; sans vraies zones de rétroéclairage, souvent à peine mieux que le SDR.\n• DisplayHDR 600/1000 : zones de rétroéclairage et pics bien plus lumineux, vrai ressenti HDR. Généralement du Mini-LED.\n• DisplayHDR True Black 400/500/600 : la norme OLED. La luminosité de crête est plus faible, mais le vrai noir donne un fort contraste.\nWindows 11 : Paramètres > Système > Affichage > activer le HDR, puis régler le « contenu SDR » sur une luminosité agréable. Pour les jeux, vérifie le HDR dans le jeu ; toutes les implémentations ne sont pas bonnes.")],
[2,"monitor",M("Farbraum, Farbtiefe und Kalibrierung: sRGB, DCI-P3, 10 bit, Delta E","Espace colorimétrique, profondeur de couleur et calibrage : sRGB, DCI-P3, 10 bits, Delta E"),M("Wichtig für Foto, Video und Design:\n• sRGB: Standard-Farbraum für Web und Windows. Ein Monitor mit 99 % sRGB reicht für Büro und Alltag.\n• DCI-P3: größerer Farbraum (Kino, HDR). Gute Gaming-/Creator-Monitore und OLEDs decken 90–100 % ab.\n• Adobe RGB: für Druck und Fotografie, Profi-Monitore.\n• 8 bit gegen 10 bit: 8 bit zeigt 16,7 Mio. Farben, 10 bit über eine Milliarde, mit weicheren Farbverläufen. Viele Monitore nutzen 8 bit + FRC.\n• Delta E (ΔE): Abweichung von der Referenzfarbe. Unter 2 ist für das Auge kaum sichtbar, unter 1 ist professionell.\nWer farbkritisch arbeitet, kalibriert mit einem Messgerät (Colorimeter). Für alle anderen reicht der Werksmodus „sRGB“ oder „Standard“. Starke Übersättigung im „Vivid“-Modus ist nicht genauer.","Important pour la photo, la vidéo et le design :\n• sRGB : espace colorimétrique standard pour le web et Windows. Un écran à 99 % sRGB suffit pour la bureautique et l'usage courant.\n• DCI-P3 : espace plus large (cinéma, HDR). Les bons écrans gaming/créateurs et les OLED couvrent 90–100 %.\n• Adobe RGB : pour l'impression et la photographie, écrans professionnels.\n• 8 bits contre 10 bits : le 8 bits affiche 16,7 millions de couleurs, le 10 bits plus d'un milliard, avec des dégradés plus doux. Beaucoup d'écrans utilisent du 8 bits + FRC.\n• Delta E (ΔE) : écart par rapport à la couleur de référence. En dessous de 2, à peine visible ; en dessous de 1, niveau professionnel.\nPour un travail critique sur les couleurs, calibre avec une sonde (colorimètre). Pour tous les autres, le mode d'usine « sRGB » ou « Standard » suffit. La forte sursaturation du mode « Vivid » n'est pas plus précise.")],
[2,"monitor",M("Anschlüsse: HDMI, DisplayPort, USB-C und DSC","Connecteurs : HDMI, DisplayPort, USB-C et DSC"),M("Welche Kabel wirklich funktionieren:\n• HDMI 2.0: bis 4K bei 60 Hz oder 1440p bei etwa 144 Hz (8 bit).\n• HDMI 2.1: bis 4K bei 120 Hz und mehr (je nach Kabel), wichtig für Konsolen und Fernseher.\n• DisplayPort 1.4: 4K bei 120 Hz mit DSC, 1440p bei 240 Hz. Der Standard am PC.\n• DisplayPort 2.1: noch mehr Bandbreite (UHBR20) für 4K ab 240 Hz ohne Kompression, bisher noch selten.\n• USB-C / Thunderbolt: kann Bild, Daten und Strom über ein Kabel senden (Alt-Mode), ideal für Laptops.\nDSC (Display Stream Compression) komprimiert das Bild so gering, dass es praktisch unsichtbar ist. Es ermöglicht hohe Auflösungen und Hz über ältere Anschlüsse. Nutze das beigelegte oder ein zertifiziertes Kabel (VESA oder „Ultra High Speed“ bei HDMI 2.1). Billige Kabel sind die häufigste Ursache für Aussetzer bei hohen Hz.","Quels câbles fonctionnent vraiment :\n• HDMI 2.0 : jusqu'à la 4K à 60 Hz ou le 1440p à environ 144 Hz (8 bits).\n• HDMI 2.1 : jusqu'à la 4K à 120 Hz et plus (selon le câble), important pour consoles et téléviseurs.\n• DisplayPort 1.4 : 4K à 120 Hz avec DSC, 1440p à 240 Hz. Le standard sur PC.\n• DisplayPort 2.1 : encore plus de bande passante (UHBR20) pour la 4K à partir de 240 Hz sans compression, encore rare.\n• USB-C / Thunderbolt : peut transmettre image, données et alimentation par un seul câble (Alt-Mode), idéal pour les portables.\nLe DSC (Display Stream Compression) compresse l'image si peu qu'elle reste pratiquement invisible. Il permet de hautes résolutions et Hz sur d'anciens connecteurs. Utilise le câble fourni ou un câble certifié (VESA, ou « Ultra High Speed » pour HDMI 2.1). Les câbles bon marché sont la cause la plus fréquente de coupures à hauts Hz.")],
[2,"monitor",M("Entspiegelt, glänzend, PWM-Flimmern, Backlight-Bleeding: Qualität und Augen","Antireflet, brillant, scintillement PWM, backlight bleeding : qualité et yeux"),M("Weitere Dinge, die man vor dem Kauf prüfen sollte:\n• Oberfläche: matt (entspiegelt) ist im hellen Raum besser, glänzend (Glossy, meist OLED) wirkt kontrastreicher, spiegelt aber.\n• Flimmerfrei (Flicker-Free): Bei vielen Monitoren wird die Helligkeit durch schnelles An-Aus (PWM) geregelt, was bei manchen Menschen Kopfschmerzen auslöst. Achte auf „flimmerfrei“ in Tests.\n• Backlight-Bleeding und IPS-Glow: Lichtflecken an den Rändern in dunklen Räumen sind bei LCDs normal in kleinem Maß, aber Serienstreuung ist groß.\n• Pixelfehler: Garantie nach ISO 9241-307 (Klassen), je nach Hersteller sind wenige Fehler erlaubt. Null-Pixelfehler-Garantien gibt es bei einigen Marken.\n• Blaulichtfilter und Pausen: Der Filter bringt wenig. Alle 20 Minuten 20 Sekunden in die Ferne schauen entlastet die Augen mehr.\n• Höhe und Neigung: Die Oberkante des Bildschirms auf Augenhöhe oder etwas darunter, Abstand etwa eine Armlänge.","Autres points à vérifier avant l'achat :\n• Surface : mate (antireflet) est meilleure en pièce claire, brillante (glossy, surtout OLED) donne plus de contraste mais reflète.\n• Sans scintillement (flicker-free) : sur beaucoup d'écrans, la luminosité est réglée par un allumage-extinction rapide (PWM), ce qui provoque des maux de tête chez certaines personnes. Cherche « flicker-free » dans les tests.\n• Backlight bleeding et IPS glow : de légères taches lumineuses sur les bords en pièce sombre sont normales avec les LCD, mais la dispersion de série est grande.\n• Pixels défectueux : garantie selon l'ISO 9241-307 (classes) ; selon le fabricant, quelques défauts sont tolérés. Certaines marques offrent une garantie zéro pixel défectueux.\n• Filtre lumière bleue et pauses : le filtre apporte peu. Regarder au loin 20 secondes toutes les 20 minutes soulage davantage les yeux.\n• Hauteur et inclinaison : le haut de l'écran à hauteur des yeux ou un peu en dessous, distance d'environ une longueur de bras.")],
[3,"monitor",M("Ultrawide, gebogen, mehrere Monitore: was ist sinnvoll?","Ultrawide, incurvé, plusieurs écrans : qu'est-ce qui a du sens ?"),M("Kurz zu den Formen:\n• Ultrawide 21:9 (34″ bei 3440 × 1440): mehr Platz nebeneinander, immersiv im Spiel, ersetzt oft zwei Monitore. Videos in 16:9 haben schwarze Balken.\n• Super-Ultrawide 32:9 (49″ bei 5120 × 1440): wie zwei WQHD-Monitore ohne Rand. Sehr breit, braucht Platz und Grafikleistung (etwa wie 4K).\n• Gebogen (Radius 1000R–1800R): passt zur natürlichen Blickrichtung bei breiten Monitoren. Je kleiner die Zahl, desto stärker die Krümmung.\n• Zwei oder drei Monitore: Zum Arbeiten sehr praktisch. Gleiche Auflösung und gleiche Größe vermeiden Skalierungsprobleme. Für Spiele nutzt man meist nur einen.\n• Hochformat: ein Monitor gedreht eignet sich für Code und Dokumente.\nWichtig: Ein Monitor mit Ständer, der höhenverstellbar ist oder eine VESA-Halterung (75 × 75 oder 100 × 100) unterstützt, ist langfristig ergonomischer.","Les formats en bref :\n• Ultrawide 21:9 (34″ en 3440 × 1440) : plus de place côte à côte, immersif en jeu, remplace souvent deux écrans. Les vidéos en 16:9 ont des bandes noires.\n• Super-ultrawide 32:9 (49″ en 5120 × 1440) : comme deux écrans WQHD sans bordure. Très large, demande de la place et de la puissance graphique (environ comme la 4K).\n• Incurvé (rayon 1000R–1800R) : s'adapte à l'axe de vision naturel sur les écrans larges. Plus le chiffre est petit, plus la courbure est forte.\n• Deux ou trois écrans : très pratique pour travailler. Même résolution et même taille évitent les problèmes de mise à l'échelle. Pour les jeux, on n'en utilise généralement qu'un.\n• Mode portrait : un écran pivoté convient au code et aux documents.\nImportant : un pied réglable en hauteur ou un support VESA (75 × 75 ou 100 × 100) est plus ergonomique à long terme.")],
[1,"build",M("PC zusammenbauen: die Reihenfolge Schritt für Schritt","Monter un PC : l'ordre étape par étape"),M("So gehst du am sichersten vor:\n1. Alles auslegen, auf einem Tisch mit Licht arbeiten, nichts mit Gewalt einstecken.\n2. Auf dem Mainboard (noch auf dem Karton liegend): CPU einsetzen (goldenes Dreieck beachten), RAM einstecken (bei 2 Modulen die Slots A2 und B2), M.2-SSD einsetzen, Kühler montieren, Wärmeleitpaste nicht vergessen.\n3. Netzteil ins Gehäuse einbauen, Kabel durch Öffnungen legen.\n4. Mainboard mit den Abstandsbolzen ins Gehäuse schrauben (I/O-Blende vorher einklicken).\n5. Grafikkarte in den obersten x16-Slot stecken, bis sie einrastet, an das Netzteil anschließen.\n6. Kabel anschließen: 24-Pin ATX, 8-Pin CPU (EPS), PCIe-Strom, SATA, Front-Panel (Power, Reset), USB, Audio und Lüfter.\n7. Kabel ordentlich bündeln, Luftstrom nicht blockieren.\n8. Monitor an die Grafikkarte stecken (nicht ans Mainboard), einschalten.\nDas Handbuch des Mainboards zeigt die genaue Belegung der Anschlüsse.","Voici la méthode la plus sûre :\n1. Tout poser, travailler sur une table bien éclairée, ne rien forcer.\n2. Sur la carte mère (encore posée sur son carton) : installer le CPU (attention au triangle doré), les modules RAM (avec 2 modules, slots A2 et B2), le SSD M.2, monter le ventirad, ne pas oublier la pâte thermique.\n3. Installer l'alimentation dans le boîtier, passer les câbles par les ouvertures.\n4. Visser la carte mère avec les entretoises dans le boîtier (clipser avant la plaque I/O).\n5. Enfoncer la carte graphique dans le slot x16 du haut jusqu'au clic et la brancher à l'alimentation.\n6. Brancher les câbles : ATX 24 broches, CPU 8 broches (EPS), alimentation PCIe, SATA, face avant (Power, Reset), USB, audio et ventilateurs.\n7. Ranger proprement les câbles, ne pas bloquer le flux d'air.\n8. Brancher l'écran sur la carte graphique (pas sur la carte mère) et allumer.\nLe manuel de la carte mère indique le brochage exact.")],
[2,"build",M("Der PC startet nicht oder zeigt kein Bild: Fehlersuche","Le PC ne démarre pas ou n'affiche rien : dépannage"),M("Geh in dieser Reihenfolge vor:\n• Kein Lebenszeichen: Netzteilschalter auf I, Kabel in der Steckdose, 24-Pin und 8-Pin CPU ganz eingesteckt, Frontpanel-Kabel (Power SW) richtig gesteckt.\n• Lüfter laufen, aber kein Bild: Monitor am Anschluss der Grafikkarte (nicht am Mainboard), Grafikkarte fest im Slot, PCIe-Strom angeschlossen, RAM neu stecken (fest, bis es klickt), nur ein Riegel testen.\n• Debug-LEDs am Board (CPU, DRAM, VGA, BOOT): Die LED, die dauerhaft leuchtet, zeigt die Fehlerstelle.\n• Nach BIOS-Update oder neuem RAM: CMOS-Reset (Batterie 30 Sekunden entfernen oder Jumper „CLR_CMOS“), das stellt den Speicher auf sichere Werte.\n• Bootschleife: RAM-Profil (XMP/EXPO) ausschalten, das dauert beim ersten Start mit DDR5 mehrere Minuten (Memory Training), also etwas Geduld.\nHäufige Ursachen: nicht ganz eingesteckte RAM-Module, vergessene Stromstecker, gebogene CPU-Pins (bei LGA-Sockeln).","Procède dans cet ordre :\n• Aucun signe de vie : interrupteur de l'alimentation sur I, câble branché, 24 broches et 8 broches CPU bien enfoncés, câble de la face avant (Power SW) correctement branché.\n• Les ventilateurs tournent mais pas d'image : écran branché sur la sortie de la carte graphique (pas sur la carte mère), carte bien enfoncée, alimentation PCIe branchée, réinsérer la RAM (à fond jusqu'au clic), tester avec un seul module.\n• LED de débogage sur la carte (CPU, DRAM, VGA, BOOT) : celle qui reste allumée indique l'origine du problème.\n• Après une mise à jour du BIOS ou une nouvelle RAM : réinitialisation CMOS (retirer la pile 30 secondes ou cavalier « CLR_CMOS »), ce qui remet la mémoire sur des valeurs sûres.\n• Boucle de démarrage : désactiver le profil RAM (XMP/EXPO) ; au premier démarrage avec de la DDR5, l'entraînement mémoire dure plusieurs minutes, donc un peu de patience.\nCauses fréquentes : modules RAM mal enfoncés, connecteurs d'alimentation oubliés, broches du CPU pliées (sockets LGA).")],
[2,"os",M("Wichtige BIOS-Einstellungen nach dem Einbau","Réglages BIOS importants après l'assemblage"),M("Beim ersten Start mit Entf oder F2 ins BIOS (UEFI):\n• XMP/EXPO einschalten, damit der RAM die volle Geschwindigkeit nutzt.\n• Resizable BAR (Smart Access Memory bei AMD) und „Above 4G Decoding“ einschalten, hilft vor allem bei Intel Arc und AMD, oft auch bei NVIDIA.\n• Boot-Reihenfolge: Die Systemfestplatte als Erste, zum Installieren des Betriebssystems den USB-Stick.\n• TPM 2.0 (fTPM oder PTT) und Secure Boot für Windows 11 aktivieren.\n• SVM (AMD) oder VT-x (Intel) einschalten, wenn du virtuelle Maschinen nutzt.\n• Lüfterkurven: auf „Silent“ oder eigene Kurve stellen. Die CPU-Lüfter-Kurve nicht zu flach, sonst wird die CPU zu heiß.\n• BIOS-Update, wenn der Hersteller ein stabiles gibt, vor dem Einbau von Windows.\nSpeichern und Beenden: meist F10.","Au premier démarrage, entre dans le BIOS (UEFI) avec Suppr ou F2 :\n• Activer XMP/EXPO pour que la RAM tourne à pleine vitesse.\n• Activer Resizable BAR (Smart Access Memory chez AMD) et « Above 4G Decoding » ; cela aide surtout avec Intel Arc et AMD, souvent aussi avec NVIDIA.\n• Ordre de démarrage : le disque système en premier ; pour installer le système d'exploitation, la clé USB.\n• Activer TPM 2.0 (fTPM ou PTT) et Secure Boot pour Windows 11.\n• Activer SVM (AMD) ou VT-x (Intel) si tu utilises des machines virtuelles.\n• Courbes de ventilateurs : sur « Silent » ou une courbe personnalisée. Ne pas rendre la courbe du ventilateur CPU trop plate, sinon le CPU devient trop chaud.\n• Mise à jour du BIOS si le fabricant propose une version stable, avant d'installer Windows.\nEnregistrer et quitter : en général F10.")],
[2,"os",M("Betriebssystem und Treiber: Windows, Linux oder macOS?","Système d'exploitation et pilotes : Windows, Linux ou macOS ?"),M("Für einen selbstgebauten PC kommen Windows und Linux infrage (macOS läuft auf Apple-Geräten):\n• Windows 11: beste Spiele- und Software-Unterstützung. Es verlangt TPM 2.0, Secure Boot und eine aktuelle CPU (etwa Ryzen 2000 und neuer oder Intel Core 8. Gen und neuer).\n• Linux (zum Beispiel Ubuntu, Fedora, SteamOS-ähnlich): kostenlos, stabil, mit Proton laufen viele Windows-Spiele, auch auf AMD gut. Einige Anti-Cheat-Spiele und Profi-Programme (Adobe) laufen nicht.\nTreiber-Reihenfolge nach der Installation:\n1. Chipsatz-Treiber (AMD oder Intel) und LAN/WLAN vom Mainboard-Hersteller.\n2. Grafiktreiber direkt von NVIDIA, AMD oder Intel, nicht von Drittseiten.\n3. Windows-Updates.\nTipp: Windows-Installation von einem USB-Stick (mit dem „Media Creation Tool“ von Microsoft erstellt) machen, die SSD als Systemlaufwerk wählen.","Pour un PC monté soi-même, Windows et Linux sont envisageables (macOS tourne sur les appareils Apple) :\n• Windows 11 : meilleur support des jeux et des logiciels. Il demande TPM 2.0, Secure Boot et un CPU récent (environ Ryzen 2000 et plus récent ou Intel Core 8e gén. et plus récent).\n• Linux (par exemple Ubuntu, Fedora, type SteamOS) : gratuit, stable ; avec Proton, beaucoup de jeux Windows fonctionnent, bien aussi sur AMD. Certains jeux avec anti-triche et logiciels pros (Adobe) ne fonctionnent pas.\nOrdre des pilotes après l'installation :\n1. Pilote du chipset (AMD ou Intel) et réseau/Wi-Fi du fabricant de la carte mère.\n2. Pilote graphique directement chez NVIDIA, AMD ou Intel, pas depuis des sites tiers.\n3. Mises à jour de Windows.\nConseil : faire l'installation de Windows depuis une clé USB (créée avec le « Media Creation Tool » de Microsoft) et choisir le SSD comme disque système.")],
[2,"case",M("Gehäuse und Luftstrom (Airflow): wie du den PC kühl hältst","Boîtier et flux d'air (airflow) : garder le PC au frais"),M("Gute Kühlung entsteht durch einen klaren Luftweg:\n• Vorne ansaugen, hinten und oben ausblasen. Kühle Luft strömt durch den PC, warme Luft geht raus.\n• Genug Lüfter: mindestens 2 vorn (Einlass) und 1 hinten (Auslass), bei starken Systemen oben 1–2 zusätzliche.\n• Mesh-Fronten (Gitter) lassen mehr Luft durch als geschlossene Glasfronten, die oft wärmer sind.\n• Positiver Druck (mehr Luft rein als raus) hält den Staub draußen, wenn die Einlässe mit Staubfiltern ausgestattet sind.\n• Lüftergröße: 140 mm sind bei gleicher Luftmenge leiser als 120 mm.\n• Kabel ordentlich verlegen, die Lüfter nicht blockieren, genug Abstand zur Wand.\nVor dem Kauf prüfen: maximale Grafikkartenlänge, Kühlerhöhe, Netzteilformat (ATX/SFX), Platz für Radiatoren (AIO) und das Mainboardformat.","Un bon refroidissement vient d'un trajet d'air clair :\n• Aspirer à l'avant, évacuer à l'arrière et en haut. L'air frais traverse le PC, l'air chaud sort.\n• Assez de ventilateurs : au moins 2 à l'avant (entrée) et 1 à l'arrière (sortie), 1–2 supplémentaires en haut pour les systèmes puissants.\n• Les façades mesh (grille) laissent passer plus d'air que les façades vitrées fermées, souvent plus chaudes.\n• Une pression positive (plus d'air entrant que sortant) garde la poussière dehors si les entrées ont des filtres.\n• Taille des ventilateurs : à débit égal, le 140 mm est plus silencieux que le 120 mm.\n• Ranger les câbles, ne pas bloquer les ventilateurs, laisser de la distance avec le mur.\nÀ vérifier avant l'achat : longueur maximale de carte graphique, hauteur du ventirad, format d'alimentation (ATX/SFX), place pour les radiateurs (AIO) et format de carte mère.")],
[2,"cool",M("Temperaturen und Wärmeleitpaste: was ist normal?","Températures et pâte thermique : qu'est-ce qui est normal ?"),M("Richtwerte unter Last (Spiele oder Stresstest):\n• CPU: 60–85 °C ist normal. Viele CPUs dürfen bis etwa 95–100 °C (Tjmax), sie takten dann herunter (Throttling). Ryzen 7000/9000 und Intel 13./14. Gen werden gern ca. 85–95 °C heiß, das ist beabsichtigt.\n• Grafikkarte: 60–80 °C, Hotspot bis etwa 95 °C.\n• SSD: bis etwa 70 °C, Gen5-SSDs brauchen einen Kühlkörper.\nIm Leerlauf: CPU 30–50 °C, GPU 30–50 °C.\nWärmeleitpaste: Beim Kühler ist meist schon Paste aufgetragen. Wenn du neu aufträgst, genügt eine erbsengroße Menge in der Mitte, der Anpressdruck verteilt sie. Eine Erneuerung ist bei CPUs nach etwa 4–6 Jahren sinnvoll, bei Grafikkarten, wenn sie deutlich heißer als früher laufen.\nProgramme zur Überwachung: HWiNFO, HWMonitor oder die Anzeige des Treibers.","Repères en charge (jeux ou test de stress) :\n• CPU : 60–85 °C est normal. Beaucoup de CPU peuvent aller jusqu'à environ 95–100 °C (Tjmax) ; ils réduisent alors leur fréquence (throttling). Les Ryzen 7000/9000 et Intel 13e/14e gén. chauffent volontiers vers 85–95 °C, c'est voulu.\n• Carte graphique : 60–80 °C, point chaud jusqu'à environ 95 °C.\n• SSD : jusqu'à environ 70 °C ; les SSD Gen5 demandent un dissipateur.\nAu repos : CPU 30–50 °C, GPU 30–50 °C.\nPâte thermique : sur le ventirad, de la pâte est souvent déjà appliquée. Si tu en remets, une quantité de la taille d'un petit pois au centre suffit, la pression l'étale. Un renouvellement est judicieux pour un CPU après environ 4–6 ans, pour une carte graphique quand elle chauffe nettement plus qu'avant.\nProgrammes de surveillance : HWiNFO, HWMonitor ou l'affichage du pilote.")],
[2,"cool",M("Luftkühler oder Wasserkühlung (AIO)?","Ventirad à air ou refroidissement liquide (AIO) ?"),M("Beide Systeme haben ihre Stärken:\n• Luftkühler: einfach, sehr zuverlässig, keine Pumpe die ausfallen kann. Gute Modelle (z. B. Noctua NH-D15, Thermalright Peerless Assassin) kühlen auch starke CPUs. Nachteil: groß, kann den RAM oder Gehäuse blockieren.\n• AIO (All-in-One-Wasserkühlung): Radiator mit 240, 280 oder 360 mm. Vorteile bei starken CPUs (Core i9, Ryzen 9), gleichmäßige Kühlung, sieht aufgeräumt aus. Nachteile: Pumpe als Verschleißteil (Lebensdauer meist 5–7 Jahre), teurer, Pumpe kann Geräusche machen.\n• Radiator einbauen: vorne oder oben, Schläuche nach unten, die Pumpe nicht am höchsten Punkt, damit sich keine Luft sammelt.\nFür die meisten Systeme bis etwa 150 W reicht ein guter Luftkühler. Für 200 W und mehr oder kleine Gehäuse lohnt sich eine AIO.","Les deux systèmes ont leurs atouts :\n• Ventirad à air : simple, très fiable, pas de pompe pouvant tomber en panne. Les bons modèles (par ex. Noctua NH-D15, Thermalright Peerless Assassin) refroidissent aussi des CPU puissants. Inconvénient : encombrant, peut bloquer la RAM ou le boîtier.\n• AIO (watercooling tout-en-un) : radiateur de 240, 280 ou 360 mm. Avantages avec des CPU puissants (Core i9, Ryzen 9), refroidissement régulier, aspect soigné. Inconvénients : la pompe est une pièce d'usure (durée de vie souvent 5–7 ans), plus cher, la pompe peut faire du bruit.\n• Montage du radiateur : à l'avant ou en haut, tuyaux vers le bas, pompe pas au point le plus haut, pour éviter que l'air s'accumule.\nPour la plupart des systèmes jusqu'à environ 150 W, un bon ventirad à air suffit. À partir de 200 W ou dans un petit boîtier, un AIO vaut la peine.")],
[2,"power",M("Stromverbrauch und Stromkosten: was kostet ein PC im Jahr?","Consommation et coût électrique : combien coûte un PC par an ?"),M("Die Rechnung: Leistung (kW) × Betriebsstunden × Strompreis.\n• Beispiel: Ein Gaming-PC zieht beim Spielen etwa 350 W. Bei 2 Stunden pro Tag sind das 0,35 kW × 2 h × 365 = 255 kWh im Jahr. Bei 0,35 € pro kWh ergibt das etwa 90 €.\n• Leerlauf und Büro: 40–80 W, bei 8 Stunden am Tag etwa 120–230 kWh.\nSo sparst du:\n• Energiesparmodus und Monitor-Standby nutzen, den PC bei langer Pause ausschalten oder in den Ruhezustand schicken.\n• Effiziente Teile: ein Netzteil mit 80+ Gold oder besser, eine sparsame CPU.\n• Undervolting oder Power-Limit der Grafikkarte: oft 10–20 % weniger Verbrauch bei kaum weniger Leistung.\n• FPS-Limit im Spiel, wenn der Monitor ohnehin nicht mehr zeigt.\nSetze deinen eigenen Strompreis ein, er ist je nach Vertrag verschieden.","Le calcul : puissance (kW) × heures de fonctionnement × prix de l'électricité.\n• Exemple : un PC de jeu consomme environ 350 W en jouant. À 2 heures par jour, cela fait 0,35 kW × 2 h × 365 = 255 kWh par an. À 0,35 € le kWh, environ 90 €.\n• Au repos et en bureautique : 40–80 W, à 8 heures par jour environ 120–230 kWh.\nPour économiser :\n• Utiliser le mode économie d'énergie et la veille de l'écran, éteindre le PC ou le mettre en veille prolongée lors d'une longue pause.\n• Pièces efficaces : alimentation 80+ Gold ou mieux, CPU économe.\n• Undervolting ou limite de puissance de la carte graphique : souvent 10–20 % de consommation en moins pour une performance à peine réduite.\n• Limiter les FPS dans le jeu quand l'écran n'affiche de toute façon pas plus.\nUtilise ton propre prix de l'électricité, il varie selon le contrat.")],
[3,"power",M("Übertakten und Undervolting: was bringt es und was ist riskant?","Overclocking et undervolting : à quoi ça sert et quels risques ?"),M("Beides verändert Takt und Spannung:\n• Übertakten (OC): höherer Takt für mehr Leistung. Moderne CPUs und GPUs holen vieles schon selbst heraus (Boost), der Gewinn ist oft klein (5 %), der Verbrauch und die Hitze steigen deutlich.\n• Undervolting: weniger Spannung bei gleichem Takt. Ergebnis: weniger Wärme, leiser, oft gleiche oder bessere Leistung. Bei AMD „Curve Optimizer“ und „PBO“, bei NVIDIA/AMD GPUs per Kurve im MSI Afterburner.\n• RAM-Übertakten: XMP/EXPO ist die einfache Version, manuelle Timings kosten Zeit, bringen aber messbar etwas.\nRisiken: Instabilität, Abstürze, Garantieverlust bei einigen Herstellern, bei Intel K-CPUs höherer Verbrauch.\nStabilität testen: Prime95/OCCT/Cinebench für die CPU, FurMark/3DMark für die GPU, MemTest86 oder TestMem5 für den RAM. Ändere immer nur eine Sache und teste in Ruhe.","Les deux modifient fréquence et tension :\n• Overclocking (OC) : fréquence plus haute pour plus de performance. Les CPU et GPU modernes en tirent déjà beaucoup eux-mêmes (boost), le gain est souvent faible (5 %), la consommation et la chaleur augmentent nettement.\n• Undervolting : moins de tension à fréquence égale. Résultat : moins de chaleur, plus silencieux, souvent la même performance ou mieux. Chez AMD « Curve Optimizer » et « PBO », pour les GPU NVIDIA/AMD par la courbe dans MSI Afterburner.\n• Overclocking de la RAM : XMP/EXPO est la version simple ; les timings manuels demandent du temps mais apportent un gain mesurable.\nRisques : instabilité, plantages, perte de garantie chez certains fabricants, consommation plus élevée avec les CPU Intel K.\nTester la stabilité : Prime95/OCCT/Cinebench pour le CPU, FurMark/3DMark pour le GPU, MemTest86 ou TestMem5 pour la RAM. Ne change qu'une chose à la fois et teste tranquillement.")],
[2,"storage",M("Datensicherung: die 3-2-1-Regel und warum RAID kein Backup ist","Sauvegarde des données : la règle 3-2-1 et pourquoi le RAID n'est pas une sauvegarde"),M("Jede Festplatte oder SSD kann irgendwann ausfallen. Die 3-2-1-Regel schützt deine Daten:\n• 3 Kopien deiner Daten (das Original und zwei Sicherungen),\n• auf 2 verschiedenen Medien (zum Beispiel interne SSD und externe Festplatte),\n• 1 Kopie an einem anderen Ort (Cloud, Freund, Schließfach).\nRAID spiegelt Daten nur gegen einen Plattenausfall, schützt aber nicht gegen versehentliches Löschen, Virus, Verschlüsselungstrojaner oder Brand. Es ist kein Backup.\nPraktisch: Windows-Dateiversionsverlauf oder ein Backup-Programm (Veeam, Macrium, Duplicati) automatisch laufen lassen, das Backup-Laufwerk nicht dauerhaft am PC lassen und regelmäßig prüfen, ob sich die Daten zurückspielen lassen. Den Zustand der SSD zeigt CrystalDiskInfo (SMART).","Tout disque dur ou SSD peut tomber en panne un jour. La règle 3-2-1 protège tes données :\n• 3 copies de tes données (l'original et deux sauvegardes),\n• sur 2 supports différents (par exemple SSD interne et disque dur externe),\n• 1 copie dans un autre lieu (cloud, ami, coffre).\nLe RAID ne protège que d'une panne de disque, pas d'une suppression accidentelle, d'un virus, d'un ransomware ou d'un incendie. Ce n'est pas une sauvegarde.\nEn pratique : lancer automatiquement l'historique des fichiers de Windows ou un logiciel de sauvegarde (Veeam, Macrium, Duplicati), ne pas laisser le disque de sauvegarde branché en permanence et vérifier régulièrement que les données peuvent être restaurées. L'état du SSD est visible avec CrystalDiskInfo (SMART).")],
[3,"storage",M("SSD-Haltbarkeit, Cache, RAID und DirectStorage","Durée de vie du SSD, cache, RAID et DirectStorage"),M("Für alle, die tiefer einsteigen wollen:\n• TBW (Terabytes Written): Die garantierte Schreibmenge, zum Beispiel 600 TBW bei 1 TB. Im Alltag erreichen die meisten das nie.\n• SLC-Cache: SSDs schreiben zuerst in einen schnellen Teil. Ist er voll, wird die SSD bei großen Dateien deutlich langsamer. Billige SSDs ohne DRAM-Cache haben dort mehr Probleme.\n• RAID 0: Daten auf zwei Laufwerke aufteilen, schneller, aber doppelt so riskant. RAID 1: Spiegelung. RAID 5/6: mehrere Platten mit Ausfallschutz, eher für NAS. Für den normalen PC bringt RAID wenig.\n• DirectStorage: Spiele laden Daten direkt von der NVMe-SSD in die Grafikkarte. Hilft bei kurzen Ladezeiten, aber nur in wenigen Spielen.\n• Wärme: Gen4- und Gen5-SSDs drosseln ohne Kühlkörper. Das Mainboard hat dafür meist einen.\nFür die meisten: 1–2 TB NVMe Gen4 und bei Bedarf eine große HDD oder SATA-SSD für Daten.","Pour ceux qui veulent aller plus loin :\n• TBW (Terabytes Written) : la quantité d'écriture garantie, par exemple 600 TBW pour 1 To. Au quotidien, la plupart n'y arrivent jamais.\n• Cache SLC : les SSD écrivent d'abord dans une zone rapide. Quand elle est pleine, le SSD ralentit nettement avec de gros fichiers. Les SSD bon marché sans cache DRAM ont plus de difficultés.\n• RAID 0 : répartir les données sur deux disques, plus rapide mais deux fois plus risqué. RAID 1 : miroir. RAID 5/6 : plusieurs disques avec protection contre la panne, plutôt pour un NAS. Pour un PC classique, le RAID apporte peu.\n• DirectStorage : les jeux chargent des données directement du SSD NVMe vers la carte graphique. Aide pour les temps de chargement courts, mais seulement dans quelques jeux.\n• Chaleur : les SSD Gen4 et Gen5 brident sans dissipateur. La carte mère en a généralement un.\nPour la plupart : 1–2 To en NVMe Gen4 et, au besoin, un gros HDD ou SSD SATA pour les données.")],
[2,"net",M("Netzwerk: LAN oder WLAN, Wi-Fi 6/7 und Geschwindigkeit","Réseau : LAN ou Wi-Fi, Wi-Fi 6/7 et débit"),M("Für Spiele und große Downloads ist ein Kabel am besten:\n• LAN (Ethernet): stabil, niedriger Ping, 1 Gbit/s ist Standard, 2,5 Gbit/s auf vielen aktuellen Boards, 10 Gbit/s für NAS und Profis. Cat5e reicht bis 1 Gbit/s, Cat6/6a für mehr.\n• WLAN: bequem. Wi-Fi 5 (ac), Wi-Fi 6 (ax), Wi-Fi 6E (zusätzliches 6-GHz-Band), Wi-Fi 7 (be, sehr schnell, benötigt passenden Router). Das 5-GHz-Band ist schneller, das 2,4-GHz-Band reicht weiter.\n• Powerline: Netzwerk über die Stromleitung, wenn kein Kabel möglich ist. Qualität schwankt.\n• Bluetooth: für Kopfhörer, Maus, Tastatur. Bluetooth 5.x ist aktuell.\nTipps: Den Router in Raummitte und erhöht aufstellen, Spielkonsolen oder PC per Kabel anschließen, die Router-Firmware aktuell halten.","Pour les jeux et les gros téléchargements, un câble est idéal :\n• LAN (Ethernet) : stable, ping faible, 1 Gbit/s est standard, 2,5 Gbit/s sur de nombreuses cartes récentes, 10 Gbit/s pour NAS et pros. Le Cat5e suffit jusqu'à 1 Gbit/s, Cat6/6a pour plus.\n• Wi-Fi : pratique. Wi-Fi 5 (ac), Wi-Fi 6 (ax), Wi-Fi 6E (bande 6 GHz supplémentaire), Wi-Fi 7 (be, très rapide, nécessite un routeur compatible). La bande 5 GHz est plus rapide, la bande 2,4 GHz porte plus loin.\n• CPL (powerline) : réseau par le courant électrique quand un câble est impossible. La qualité varie.\n• Bluetooth : pour casque, souris, clavier. Le Bluetooth 5.x est actuel.\nConseils : placer le routeur au milieu de la pièce et en hauteur, brancher consoles ou PC par câble, garder le firmware du routeur à jour.")],
[2,"periph",M("USB und Thunderbolt: Typen, Geschwindigkeiten und Kabel","USB et Thunderbolt : types, vitesses et câbles"),M("Stecker und Standard sind zwei verschiedene Dinge:\n• Stecker: USB-A (flach, rechteckig), USB-C (klein, oval, beidseitig), Micro-USB (alt).\n• USB 2.0: 480 Mbit/s (Tastatur, Maus). USB 3.2 Gen 1 (früher 3.0): 5 Gbit/s. Gen 2: 10 Gbit/s. Gen 2×2: 20 Gbit/s. USB4: 40 Gbit/s. Thunderbolt 3/4: 40 Gbit/s, Thunderbolt 5: bis 80/120 Gbit/s.\n• USB-C ist nur der Stecker, die Geschwindigkeit hängt vom Port und vom Kabel ab. Ein günstiges USB-C-Kabel kann nur USB 2.0 oder nur laden.\n• Strom: USB Power Delivery lädt Laptops mit bis zu 100 W (240 W bei neueren).\n• Front-Panel-Header: Das Gehäuse benötigt am Mainboard einen passenden USB-3.0-Header (19/20-Pin) oder USB-C-Header (Typ E).\nFür externe SSDs ein Kabel und einen Port mit mindestens 10 Gbit/s verwenden.","Connecteur et norme sont deux choses différentes :\n• Connecteur : USB-A (plat, rectangulaire), USB-C (petit, ovale, réversible), Micro-USB (ancien).\n• USB 2.0 : 480 Mbit/s (clavier, souris). USB 3.2 Gen 1 (anciennement 3.0) : 5 Gbit/s. Gen 2 : 10 Gbit/s. Gen 2×2 : 20 Gbit/s. USB4 : 40 Gbit/s. Thunderbolt 3/4 : 40 Gbit/s, Thunderbolt 5 : jusqu'à 80/120 Gbit/s.\n• USB-C n'est que le connecteur ; la vitesse dépend du port et du câble. Un câble USB-C bon marché peut n'être qu'en USB 2.0 ou seulement pour charger.\n• Alimentation : USB Power Delivery charge des portables jusqu'à 100 W (240 W pour les plus récents).\n• Connecteurs de face avant : le boîtier demande sur la carte mère un header USB 3.0 (19/20 broches) ou USB-C (type E) adapté.\nPour des SSD externes, utilise un câble et un port d'au moins 10 Gbit/s.")],
[2,"periph",M("Maus, Tastatur, Headset und Webcam: worauf du achten solltest","Souris, clavier, casque et webcam : à quoi faire attention"),M("Das Zubehör prägt den Alltag mehr als viele Teile im Gehäuse:\n• Maus: Sensor mit 800–3200 DPI reicht, Gewicht und Form zählen mehr. Für Spiele 1000 Hz Abfragerate, 4000 oder 8000 Hz nur für Esport. Kabellos geht heute ohne Verzögerung (2,4-GHz-Dongle).\n• Tastatur: mechanisch (Schalter wie Linear, Taktil, Klickend) gibt gutes Feedback; Hall-Effect-Tastaturen erkennen den Druckpunkt variabel. Layout: Vollformat, TKL (ohne Nummernblock) oder 60 %.\n• Headset oder Kopfhörer mit Mikrofon: Komfort und Klang wichtiger als „7.1 Surround“. Ein eigenes Mikrofon klingt besser als das im Headset.\n• Webcam: 1080p mit gutem Autofokus, Licht von vorn ist wichtiger als 4K.\n• Gamepad: Xbox- oder PlayStation-Controller laufen am PC problemlos, Steam unterstützt viele.\nTipp: Gerne im Laden ausprobieren, besonders Maus und Tastatur sind sehr individuell.","Les accessoires marquent le quotidien plus que beaucoup de pièces du boîtier :\n• Souris : un capteur de 800–3200 DPI suffit, poids et forme comptent davantage. Pour les jeux, 1000 Hz de fréquence d'interrogation, 4000 ou 8000 Hz seulement pour l'esport. Le sans-fil fonctionne aujourd'hui sans latence (dongle 2,4 GHz).\n• Clavier : mécanique (interrupteurs linéaires, tactiles, clic) donne un bon retour ; les claviers Hall-Effect détectent le point d'actionnement de façon variable. Disposition : taille complète, TKL (sans pavé numérique) ou 60 %.\n• Casque ou écouteurs avec micro : confort et son plus importants que le « 7.1 surround ». Un micro séparé sonne mieux que celui du casque.\n• Webcam : 1080p avec bon autofocus, la lumière de face compte plus que la 4K.\n• Manette : les manettes Xbox ou PlayStation fonctionnent sans problème sur PC, Steam en prend beaucoup en charge.\nConseil : essaie-les en magasin, surtout souris et clavier sont très personnels.")],
[1,"tips",M("Fertig-PC, Selbstbau oder Laptop: was passt zu mir?","PC prêt à l'emploi, montage maison ou portable : que choisir ?"),M("Jede Variante hat Vor- und Nachteile:\n• Selbstbau: du wählst jedes Teil, bekommst meist die beste Leistung fürs Geld, lernst viel und kannst später gezielt aufrüsten. Du brauchst Zeit, ein wenig Mut und trägst die Garantie pro Teil.\n• Fertig-PC: sofort startklar, eine Garantie für alles. Oft etwas teurer oder mit schwachen Teilen an versteckten Stellen (Netzteil, Mainboard, RAM-Geschwindigkeit). Der Check hilft, so ein Angebot zu prüfen.\n• Laptop: mobil, alles in einem. Bei gleicher Leistung teurer und schwerer aufzurüsten, die Kühlung ist enger, oft kürzere Lebensdauer unter Dauerlast.\n• Mini-PC: klein und sparsam, für Büro und leichtes Gaming.\nWenn du schnell etwas brauchst, nimm einen guten Fertig-PC. Wenn du lernen willst und Geld sparen möchtest, bau selbst.","Chaque variante a ses avantages et inconvénients :\n• Montage maison : tu choisis chaque pièce, tu obtiens souvent la meilleure performance pour le prix, tu apprends beaucoup et tu pourras évoluer précisément. Il faut du temps, un peu de courage et la garantie est par pièce.\n• PC prêt à l'emploi : immédiatement opérationnel, une garantie pour l'ensemble. Souvent un peu plus cher ou avec des pièces faibles cachées (alimentation, carte mère, vitesse de la RAM). Le check aide à vérifier une telle offre.\n• Portable : mobile, tout-en-un. À performance égale, plus cher et plus difficile à faire évoluer, refroidissement plus serré, durée de vie souvent plus courte sous charge continue.\n• Mini-PC : petit et économe, pour la bureautique et le jeu léger.\nSi tu as besoin de quelque chose vite, prends un bon PC prêt à l'emploi. Si tu veux apprendre et économiser, monte-le toi-même.")],
[1,"tips",M("Wie verteile ich das Budget? Wo sparen, wo nicht?","Comment répartir le budget ? Où économiser, où ne pas économiser ?"),M("Eine gute Faustregel für einen Spiele-PC:\n• Grafikkarte: 35–45 % des Budgets. Sie entscheidet am meisten über die FPS.\n• Prozessor: 15–20 %.\n• Mainboard: 10–12 %. Nicht das teuerste, aber eine solide B-Klasse.\n• RAM: 7–10 % (32 GB DDR5).\n• SSD: 7–10 %.\n• Netzteil: 8–10 %. Hier nicht sparen: Ein schlechtes Netzteil kann andere Teile beschädigen.\n• Kühler und Gehäuse: je 5–8 %.\nSparen kannst du bei: RGB-Beleuchtung, übertriebenem Mainboard, sehr schnellem RAM, Gen5-SSD. Nicht sparen: Netzteil, Kühlung und ein ausgewogenes Verhältnis CPU/GPU (siehe Engpass-Matrix). Bei Videoschnitt oder 3D wandern mehr Budget in CPU und RAM.","Une bonne règle pour un PC de jeu :\n• Carte graphique : 35–45 % du budget. Elle décide le plus des FPS.\n• Processeur : 15–20 %.\n• Carte mère : 10–12 %. Pas la plus chère, mais une solide gamme B.\n• RAM : 7–10 % (32 Go DDR5).\n• SSD : 7–10 %.\n• Alimentation : 8–10 %. Ne pas économiser ici : une mauvaise alimentation peut endommager d'autres pièces.\n• Ventirad et boîtier : 5–8 % chacun.\nTu peux économiser sur : l'éclairage RGB, une carte mère exagérée, une RAM très rapide, un SSD Gen5. Ne pas économiser sur : l'alimentation, le refroidissement et un bon équilibre CPU/GPU (voir la matrice des goulots). Pour le montage vidéo ou la 3D, plus de budget va au CPU et à la RAM.")],
[2,"tips",M("Gebrauchte Teile kaufen: Checkliste gegen böse Überraschungen","Acheter des pièces d'occasion : liste de contrôle pour éviter les mauvaises surprises"),M("Gebrauchte Teile können viel Geld sparen, wenn du auf diese Punkte achtest:\n• Grafikkarten: Vorsicht bei Mining-Karten (sehr hoher Dauerbetrieb). Nach Rechnung und Restgarantie fragen, Lüfter und Anschlüsse ansehen, wenn möglich unter Last testen (FurMark oder ein Spiel) und die Temperatur prüfen.\n• CPU: Pins (bei Intel-Mainboards) kontrollieren, Seriennummer, nicht übertaktet oder abgeschliffen.\n• SSD: SMART-Werte und „Wear-Level“ mit CrystalDiskInfo ansehen.\n• Netzteile: eher neu kaufen. Alter und Zustand sind schwer zu beurteilen.\n• Mainboards: verbogene Pins, Kondensatoren (gewölbte sind defekt), Spuren von Flüssigkeit.\n• Zahle sicher: Käuferschutz (PayPal oder Plattform), keine Vorkasse an Unbekannte, Übergabe vor Ort mit Test.\nFaustregel: Wenn der Preis zu gut klingt, ist er es meist auch.","Les pièces d'occasion peuvent faire économiser beaucoup, si tu fais attention à ces points :\n• Cartes graphiques : méfiance avec les cartes de minage (fonctionnement continu très élevé). Demander la facture et la garantie restante, regarder les ventilateurs et connecteurs, tester si possible sous charge (FurMark ou un jeu) et vérifier la température.\n• CPU : contrôler les broches (sur cartes mères Intel), numéro de série, ni overclocké ni poncé.\n• SSD : regarder les valeurs SMART et l'usure avec CrystalDiskInfo.\n• Alimentations : plutôt neuves. L'âge et l'état sont difficiles à juger.\n• Cartes mères : broches tordues, condensateurs (bombés = défectueux), traces de liquide.\n• Paie en sécurité : protection acheteur (PayPal ou plateforme), pas de paiement d'avance à des inconnus, remise en main propre avec test.\nRègle simple : si le prix paraît trop beau, il l'est généralement.")],
[2,"tips",M("Upgrade-Planung: was zuerst austauschen?","Planifier une évolution : que remplacer en premier ?"),M("Gehe von der Frage aus: Was bremst mich?\n• Spiele ruckeln: meist die Grafikkarte. Prüfe vorher mit der Engpass-Matrix, ob die CPU zur neuen Karte passt.\n• Alles ist langsam, Programme starten lange: eine NVMe-SSD statt Festplatte, 16 auf 32 GB RAM.\n• CPU am Limit bei Streaming oder in Spielen: dann CPU, oft auch Mainboard und RAM zusammen (Plattformwechsel).\n• Neue Grafikkarte zieht mehr Strom: Netzteil prüfen (der Check zeigt es).\nVorgehen: Zuerst messen (Task-Manager: Auslastung von CPU, GPU und RAM im Spiel), dann ein Teil tauschen, dann erneut messen. Eine Plattform mit langer Zukunft (AM5) erlaubt später eine neue CPU auf dem gleichen Board. Beim Wechsel der Plattform auch RAM-Typ (DDR4/DDR5) und Kühlerhalterung beachten.","Pars de la question : qu'est-ce qui me limite ?\n• Les jeux saccadent : le plus souvent la carte graphique. Vérifie avant avec la matrice des goulots que le CPU convient à la nouvelle carte.\n• Tout est lent, les programmes démarrent lentement : un SSD NVMe à la place du disque dur, de 16 à 32 Go de RAM.\n• CPU à la limite en streaming ou en jeu : alors CPU, souvent aussi carte mère et RAM ensemble (changement de plateforme).\n• La nouvelle carte graphique consomme plus : vérifier l'alimentation (le check l'indique).\nMéthode : d'abord mesurer (Gestionnaire des tâches : utilisation du CPU, du GPU et de la RAM en jeu), puis remplacer une pièce, puis mesurer à nouveau. Une plateforme avec un long avenir (AM5) permet plus tard un nouveau CPU sur la même carte. Lors d'un changement de plateforme, penser aussi au type de RAM (DDR4/DDR5) et à la fixation du ventirad.")],
[3,"tips",M("Welche Hardware habe ich? Bestandsaufnahme am eigenen PC","Quel matériel ai-je ? Inventaire de son propre PC"),M("So findest du deine Teile heraus:\n• Windows-Boardmittel: Rechtsklick auf die Start-Schaltfläche > System zeigt CPU und RAM. Der Task-Manager (Strg+Umschalt+Esc) im Reiter „Leistung“ zeigt CPU, GPU, RAM, SSD und Netzwerk mit Auslastung.\n• DxDiag: Windows-Taste, dxdiag eingeben: Grafikkarte, Treiber, DirectX.\n• CPU-Z: CPU, Mainboard, RAM-Profil (SPD und XMP/EXPO).\n• GPU-Z: Grafikkarte mit PCIe-Slot-Version („Bus Interface“).\n• HWiNFO: sehr ausführlich mit Temperaturen und Lüftern.\n• CrystalDiskInfo: Zustand und Temperatur der SSDs.\nDiese Werte kannst du anschließend im Konfigurator eingeben, um zu prüfen, wie gut dein jetziges System passt.","Voici comment retrouver tes pièces :\n• Outils de Windows : clic droit sur le bouton Démarrer > Système montre le CPU et la RAM. Le Gestionnaire des tâches (Ctrl+Maj+Échap) dans l'onglet « Performances » montre CPU, GPU, RAM, SSD et réseau avec l'utilisation.\n• DxDiag : touche Windows, taper dxdiag : carte graphique, pilote, DirectX.\n• CPU-Z : CPU, carte mère, profil RAM (SPD et XMP/EXPO).\n• GPU-Z : carte graphique avec la version du slot PCIe (« Bus Interface »).\n• HWiNFO : très détaillé avec températures et ventilateurs.\n• CrystalDiskInfo : état et température des SSD.\nTu peux ensuite saisir ces valeurs dans le configurateur pour vérifier si ton système actuel est bien équilibré.")],
[3,"build",M("Wartung, Sicherheit und Staub: so bleibt der PC lange gesund","Entretien, sécurité et poussière : garder le PC en bonne santé"),M("Regelmäßige Pflege verlängert die Lebensdauer:\n• Staub: alle 6–12 Monate Gehäuse und Filter reinigen. Mit Druckluft (Lüfter festhalten, damit sie nicht überdrehen) oder einem weichen Pinsel, PC dabei ausschalten und vom Strom trennen.\n• ESD-Schutz: vor dem Anfassen von Bauteilen ein geerdetes Metallteil (Heizkörper, Gehäuse) berühren. Teile am Rand anfassen.\n• Updates: Windows, Grafiktreiber und BIOS (selten und nur bei Bedarf) aktuell halten.\n• Temperaturen und SSD-Zustand gelegentlich prüfen.\n• Netzteilkabel und 12V-2x6-Stecker: bis zum Anschlag einstecken, nicht knicken, nach dem Einbau kontrollieren.\n• Antivirus: Windows Defender reicht für die meisten. Vorsicht bei Downloads aus unbekannten Quellen und beim Aktivieren von Makros.\n• Überspannungsschutz oder USV: schützt bei Gewitter und Stromausfällen.","Un entretien régulier prolonge la durée de vie :\n• Poussière : tous les 6–12 mois, nettoyer le boîtier et les filtres. Avec de l'air comprimé (retenir les ventilateurs pour qu'ils ne s'emballent pas) ou un pinceau doux, PC éteint et débranché.\n• Protection ESD : avant de toucher des composants, toucher une pièce métallique reliée à la terre (radiateur, boîtier). Manipuler les pièces par les bords.\n• Mises à jour : garder Windows, pilotes graphiques et BIOS (rarement et seulement si nécessaire) à jour.\n• Vérifier de temps en temps les températures et l'état des SSD.\n• Câbles d'alimentation et connecteur 12V-2x6 : enfoncer jusqu'en butée, ne pas plier, contrôler après le montage.\n• Antivirus : Windows Defender suffit pour la plupart. Prudence avec les téléchargements de sources inconnues et l'activation de macros.\n• Parasurtenseur ou onduleur : protège en cas d'orage et de coupures de courant.")],
[2,"gpu",M("FPS, 1 % Lows und Benchmarks lesen","FPS, 1 % lows et lecture des benchmarks"),M("So verstehst du Leistungsangaben:\n• FPS (Bilder pro Sekunde): 30 FPS sind spielbar, 60 FPS flüssig, 120 FPS und mehr sehr flüssig.\n• Durchschnitts-FPS sind nur ein Teil. „1 % Lows“ (die schlechtesten 1 % der Bilder) zeigen Ruckler. Zwei Systeme mit gleichen Durchschnitts-FPS können sich sehr unterschiedlich anfühlen.\n• Frametime: der Abstand zwischen zwei Bildern in Millisekunden (60 FPS = 16,7 ms). Gleichmäßige Frametime fühlt sich besser an.\n• Einstellungen: Ultra-Details kosten oft viel Leistung für kaum sichtbaren Gewinn. „Hoch“ ist meist der Sweet Spot.\n• Benchmarks vergleichen: gleiche Spiele, gleiche Auflösung, gleiche Einstellungen. Unabhängige Tests (Computerbase, Gamers Nexus, Hardware Unboxed, Igor’s Lab) sind verlässlicher als Herstellerfolien.\nDie Leistungszahlen im PC-Check sind relative Faustwerte. Sie ersetzen keine Benchmarks deiner Spiele.","Comment comprendre les indications de performance :\n• FPS (images par seconde) : 30 FPS sont jouables, 60 FPS fluides, 120 FPS et plus très fluides.\n• Les FPS moyens ne sont qu'une partie. Les « 1 % lows » (les 1 % d'images les plus mauvaises) montrent les saccades. Deux systèmes avec les mêmes FPS moyens peuvent donner des sensations très différentes.\n• Frametime : le temps entre deux images en millisecondes (60 FPS = 16,7 ms). Un frametime régulier est plus agréable.\n• Réglages : les détails Ultra coûtent souvent beaucoup de performance pour un gain peu visible. « Élevé » est généralement le bon compromis.\n• Comparer des benchmarks : mêmes jeux, même résolution, mêmes réglages. Des tests indépendants (Computerbase, Gamers Nexus, Hardware Unboxed, Igor's Lab) sont plus fiables que les diapositives des fabricants.\nLes valeurs de performance du PC-Check sont des repères relatifs. Elles ne remplacent pas les benchmarks de tes jeux.")],
[3,"gpu",M("DLSS, FSR, Frame Generation und Raytracing erklärt","DLSS, FSR, génération d'images et ray tracing expliqués"),M("Moderne Spiele nutzen Tricks, um mehr FPS zu liefern:\n• Upscaling (DLSS von NVIDIA, FSR von AMD, XeSS von Intel): Das Spiel rendert in niedrigerer Auflösung und das Bild wird intelligent hochskaliert. Qualitätsmodus verliert wenig Schärfe und gewinnt viele FPS, besonders in 4K.\n• Frame Generation: Zusätzliche Bilder werden berechnet (DLSS Frame Generation, FSR Frame Generation). Sie erhöht die angezeigten FPS, erhöht aber die Eingabeverzögerung leicht und braucht schon etwa 60 FPS als Basis.\n• Raytracing: realistischere Lichtberechnung für Schatten, Spiegelungen und Beleuchtung. Kostet viel Leistung, NVIDIA RTX hat hier traditionell einen Vorsprung, AMD und Intel holen auf.\n• Multi-Frame-Generation (bei RTX 50): mehrere Zwischenbilder, hilft bei hohen Hz, ist aber kein Ersatz für echte Leistung.\nFür niedrige Latenz in Esport-Spielen werden diese Techniken oft ausgeschaltet.","Les jeux modernes utilisent des astuces pour fournir plus de FPS :\n• Upscaling (DLSS de NVIDIA, FSR d'AMD, XeSS d'Intel) : le jeu est rendu à une résolution plus basse et l'image est agrandie intelligemment. Le mode Qualité perd peu de netteté et gagne beaucoup de FPS, surtout en 4K.\n• Génération d'images (Frame Generation) : des images supplémentaires sont calculées (DLSS Frame Generation, FSR Frame Generation). Elle augmente les FPS affichés mais ajoute un peu de latence et demande déjà environ 60 FPS de base.\n• Ray tracing : calcul plus réaliste de la lumière pour ombres, reflets et éclairage. Coûte beaucoup de performance ; NVIDIA RTX a traditionnellement de l'avance, AMD et Intel rattrapent.\n• Multi-Frame-Generation (sur RTX 50) : plusieurs images intermédiaires, utile pour les hauts Hz mais pas un remplacement de la vraie performance.\nPour une faible latence en jeux esport, ces techniques sont souvent désactivées.")],
[3,"gpu",M("KI und Workstation: worauf es bei Grafikkarte, RAM und CPU ankommt","IA et station de travail : ce qui compte pour la carte graphique, la RAM et le CPU"),M("Für lokale KI (Sprach- und Bildmodelle), Rendering und Videoschnitt gelten andere Regeln als für Spiele:\n• VRAM ist entscheidend: Ein Sprachmodell mit 8 Milliarden Parametern braucht in 4-Bit etwa 5–6 GB, eines mit 70 Milliarden etwa 40 GB. Mehr VRAM erlaubt größere Modelle.\n• NVIDIA mit CUDA wird von fast allen KI-Programmen unterstützt. AMD (ROCm) und Intel holen auf.\n• Systemspeicher: 64 GB oder mehr, wenn Modelle teilweise im RAM laufen.\n• CPU: viele Kerne helfen bei Rendering und Kompilieren (Ryzen 9, Core Ultra 9, Threadripper).\n• NVMe-SSD: schnelle Dateien für Modelle und Projekte, 2 TB oder mehr.\n• Netzteil und Kühlung: Dauerlast ist anspruchsvoller als Spielen.\n• NPUs: Spezialchips in manchen CPUs und Laptops, nützlich für kleine KI-Aufgaben, aber keine Grafikkarte.\nIm Konfigurator nimmt „Videoschnitt & 3D“ solche Aufgaben näherungsweise auf.","Pour l'IA locale (modèles de langage et d'image), le rendu et le montage vidéo, d'autres règles s'appliquent que pour les jeux :\n• La VRAM est décisive : un modèle de langage de 8 milliards de paramètres demande en 4 bits environ 5–6 Go, un de 70 milliards environ 40 Go. Plus de VRAM permet des modèles plus grands.\n• NVIDIA avec CUDA est pris en charge par presque tous les programmes d'IA. AMD (ROCm) et Intel rattrapent.\n• Mémoire système : 64 Go ou plus si des modèles tournent en partie dans la RAM.\n• CPU : beaucoup de cœurs aident pour le rendu et la compilation (Ryzen 9, Core Ultra 9, Threadripper).\n• SSD NVMe : fichiers rapides pour modèles et projets, 2 To ou plus.\n• Alimentation et refroidissement : la charge continue est plus exigeante que le jeu.\n• NPU : puces spécialisées dans certains CPU et portables, utiles pour de petites tâches d'IA, mais pas une carte graphique.\nDans le configurateur, « Montage vidéo & 3D » représente approximativement de telles tâches.")],
[3,"cpu",M("Kerne, Threads, Takt, Cache und IPC: wie schnell ist eine CPU wirklich?","Cœurs, threads, fréquence, cache et IPC : quelle est vraiment la vitesse d'un CPU ?"),M("Die Leistung hängt von mehreren Größen ab:\n• Kerne: unabhängige Recheneinheiten. Spiele nutzen meist 6–8, Videoschnitt und Rendern mehr.\n• Threads: Mit SMT/Hyper-Threading kann jeder Kern zwei Aufgaben gleichzeitig bearbeiten.\n• Takt (GHz): wie schnell ein Kern arbeitet. Der Boost-Takt ist der Spitzenwert unter Last.\n• IPC: Arbeit pro Takt. Eine neue Architektur schafft mit gleichem Takt mehr.\n• Cache: schneller Speicher in der CPU. Viel Cache (zum Beispiel 3D V-Cache bei X3D) beschleunigt Spiele besonders.\n• Hybrid-Architektur (Intel P- und E-Kerne): P-Kerne für starke Aufgaben, E-Kerne für Hintergrundarbeit und viele Threads.\nFür Spiele zählen Einzelkernleistung und Cache, für Videoschnitt die Kernzahl. Genau diese zwei Werte (Gaming und Multicore) findest du in der Datenbank.","La performance dépend de plusieurs grandeurs :\n• Cœurs : unités de calcul indépendantes. Les jeux en utilisent le plus souvent 6–8, le montage vidéo et le rendu davantage.\n• Threads : avec SMT/Hyper-Threading, chaque cœur peut traiter deux tâches en même temps.\n• Fréquence (GHz) : la vitesse d'un cœur. La fréquence boost est la valeur de pointe en charge.\n• IPC : travail par cycle. Une architecture récente fait plus à fréquence égale.\n• Cache : mémoire rapide dans le CPU. Beaucoup de cache (par exemple 3D V-Cache sur les X3D) accélère particulièrement les jeux.\n• Architecture hybride (cœurs P et E d'Intel) : les cœurs P pour les tâches puissantes, les cœurs E pour le travail de fond et de nombreux threads.\nPour les jeux, la performance par cœur et le cache comptent ; pour le montage vidéo, le nombre de cœurs. Ces deux valeurs (jeux et multicœur) se trouvent dans la base de données.")],
[3,"cpu",M("TDP, PPT und Leistungsgrenzen: warum eine „65-W-CPU“ 88 W zieht","TDP, PPT et limites de puissance : pourquoi un « CPU 65 W » consomme 88 W"),M("Die TDP-Angabe ist ein Wärme-Richtwert, kein Maximalverbrauch:\n• AMD: Eine „65-W-CPU“ darf per PPT (Package Power Tracking) etwa 88 W ziehen, eine „105-W-CPU“ etwa 142 W, „120 W“ etwa 162 W. Die maximale Leistung in diesem Check beruht auf diesen Werten.\n• Intel: PL1 (Dauerleistung, zum Beispiel 125 W) und PL2 (kurze Spitze, zum Beispiel 253 W). Mainboards setzen die Grenzen oft höher, als Intel vorgibt.\n• Das Kühlungs- und Netzteilverhalten richtet sich nach dem tatsächlichen Verbrauch, nicht nach der TDP.\n• Im BIOS lassen sich die Grenzen senken (Eco-Modus), was Wärme und Lärm spart, oft bei kaum weniger Leistung.\nFür die Auswahl des Kühlers zählt deshalb die Spitzenleistung der CPU, die der Check als „Spitzenleistung“ zeigt.","La valeur TDP est un repère thermique, pas une consommation maximale :\n• AMD : un « CPU 65 W » peut consommer environ 88 W selon le PPT (Package Power Tracking), un « 105 W » environ 142 W, un « 120 W » environ 162 W. La puissance maximale indiquée dans ce check repose sur ces valeurs.\n• Intel : PL1 (puissance continue, par exemple 125 W) et PL2 (pic court, par exemple 253 W). Les cartes mères placent souvent les limites plus haut que ce qu'Intel prévoit.\n• Le comportement du refroidissement et de l'alimentation dépend de la consommation réelle, pas du TDP.\n• Dans le BIOS, les limites peuvent être abaissées (mode Eco), ce qui économise chaleur et bruit, souvent pour une performance à peine moindre.\nPour choisir le ventirad, c'est donc la puissance de pointe du CPU qui compte, que le check affiche comme « Consommation de pointe ».")],
[3,"ram",M("RAM-Timings, Ranks und Latenz: was zählt wirklich?","Timings RAM, ranks et latence : ce qui compte vraiment"),M("Wenn du genauer wissen willst:\n• MT/s (zum Beispiel 6000): Datenrate. Höher ist besser, aber bei AMD AM5 gibt es einen Sweet Spot um 6000 mit niedriger Latenz.\n• CL (CAS-Latenz, zum Beispiel CL30): Verzögerung in Takten. Niedriger ist besser. Die echte Latenz in Nanosekunden ist CL × 2000 ÷ MT/s: DDR5-6000 CL30 liegt bei 10 ns, DDR5-5600 CL40 bei etwa 14,3 ns.\n• Ranks: ein Modul kann Single-Rank oder Dual-Rank sein. Dual-Rank kann etwas schneller sein, ist aber schwerer zu übertakten.\n• 1DPC/2DPC: Module pro Kanal. 4 Module belasten den Speichercontroller stärker und senken den erreichbaren Takt.\n• ECC: Fehlerkorrektur, nur bei Workstations oder Servern.\n• Fabric-Takt (AMD): läuft bei DDR5-6000 mit 2000 MHz im 1:1-Modus, das ist der Grund für den Sweet Spot.\nFür die meisten reichen die Profile der Kits (XMP/EXPO).","Pour qui veut plus de précision :\n• MT/s (par exemple 6000) : débit de données. Plus haut est mieux, mais chez AMD AM5, il y a un compromis autour de 6000 avec une faible latence.\n• CL (latence CAS, par exemple CL30) : délai en cycles. Plus bas est mieux. La vraie latence en nanosecondes est CL × 2000 ÷ MT/s : DDR5-6000 CL30 donne 10 ns, DDR5-5600 CL40 environ 14,3 ns.\n• Ranks : un module peut être single-rank ou dual-rank. Le dual-rank peut être un peu plus rapide, mais plus difficile à overclocker.\n• 1DPC/2DPC : modules par canal. 4 modules sollicitent davantage le contrôleur mémoire et réduisent la fréquence atteignable.\n• ECC : correction d'erreurs, seulement pour stations de travail ou serveurs.\n• Fréquence du fabric (AMD) : à DDR5-6000, elle est de 2000 MHz en mode 1:1, ce qui explique le compromis.\nPour la plupart, les profils des kits (XMP/EXPO) suffisent.")],
[2,"psu",M("Netzteil lesen: 80+, ATX 3.1, modular und Schutzschaltungen","Lire une alimentation : 80+, ATX 3.1, modulaire et protections"),M("Was auf dem Aufkleber und im Datenblatt wichtig ist:\n• 80+ (Bronze, Silber, Gold, Platin, Titan): Wirkungsgrad bei 20, 50 und 100 % Last. Gold ist ein gutes Ziel, Bronze reicht für sparsame Systeme.\n• ATX 3.0/3.1 und 12V-2x6: Neue Netzteile sind für Lastspitzen moderner Grafikkarten ausgelegt und haben den Stecker nativ. ATX 3.1 hat dabei verbesserte Anforderungen an kurze Überlast.\n• Modulare Kabel: Du steckst nur die Kabel an, die du brauchst. Das erleichtert Kabelmanagement und Luftstrom. Teilmodular: nur die Hauptstränge sind fest.\n• Schutzschaltungen: OCP, OVP, UVP, SCP, OTP. Gute Netzteile haben alle.\n• Garantie: 5–10 Jahre sind ein Zeichen für Vertrauen des Herstellers.\n• Lüfter: Hybrid-Betrieb (Lüfter aus bei geringer Last) macht leise.\nDie Auswahl in diesem Check bezieht sich auf bekannte Marken. Unbekannte No-Name-Netzteile sind ein Risiko für den ganzen PC.","Ce qui compte sur l'étiquette et dans la fiche technique :\n• 80+ (Bronze, Silver, Gold, Platinum, Titanium) : rendement à 20, 50 et 100 % de charge. Gold est un bon objectif, Bronze suffit pour des systèmes économes.\n• ATX 3.0/3.1 et 12V-2x6 : les alimentations récentes sont conçues pour les pics de charge des cartes graphiques modernes et ont le connecteur en natif. L'ATX 3.1 a des exigences améliorées pour les courtes surcharges.\n• Câbles modulaires : tu ne branches que les câbles nécessaires. Cela facilite la gestion des câbles et le flux d'air. Semi-modulaire : seuls les câbles principaux sont fixes.\n• Protections : OCP, OVP, UVP, SCP, OTP. Les bonnes alimentations les ont toutes.\n• Garantie : 5–10 ans est un signe de confiance du fabricant.\n• Ventilateur : le mode hybride (ventilateur éteint à faible charge) rend silencieux.\nLa sélection dans ce check porte sur des marques connues. Les alimentations inconnues sans marque sont un risque pour tout le PC.")],
[3,"board",M("Mainboard-Qualität: VRM, Phasen, Kühlkörper und was sie bedeuten","Qualité de la carte mère : VRM, phases, dissipateurs et leur signification"),M("Das VRM (Voltage Regulator Module) wandelt die 12 V des Netzteils in die Spannung der CPU:\n• Phasen: mehr Phasen verteilen die Belastung (zum Beispiel 12+2). Wichtiger als die Zahl ist die Qualität der Bauteile (Stromstufen „Power Stages“ mit 60–110 A).\n• Kühlkörper auf dem VRM: Sie verhindern Überhitzung bei Dauerlast. Bei starken CPUs (Core i9, Ryzen 9) sind sie wichtig.\n• Chipsatz-Klasse: Einsteigerboards (A620, H610) sparen oft am VRM. Das ist bei Sechskern-CPUs unkritisch, bei starken CPUs kann die CPU drosseln.\n• Weitere Qualitätsmerkmale: PCB-Lagen (6 Layer), M.2-Kühlkörper, Metallverstärkter PCIe-Slot, BIOS-Flashback, USB-Anschlüsse, Audio und LAN.\nDer Punkt „Mainboard-Eignung“ im Check vergleicht die CPU-Leistung mit der Chipsatzklasse und warnt bei grenzwertigen Kombinationen.","Le VRM (Voltage Regulator Module) convertit les 12 V de l'alimentation en tension du CPU :\n• Phases : plus de phases répartissent la charge (par exemple 12+2). Plus important que le nombre, la qualité des composants (étages de puissance « power stages » de 60–110 A).\n• Dissipateurs sur le VRM : ils évitent la surchauffe en charge continue. Pour les CPU puissants (Core i9, Ryzen 9), ils sont importants.\n• Gamme du chipset : les cartes d'entrée de gamme (A620, H610) économisent souvent sur le VRM. C'est sans importance avec des CPU six cœurs, mais un CPU puissant peut brider.\n• Autres critères de qualité : couches du PCB (6 layers), dissipateurs M.2, slot PCIe renforcé de métal, BIOS Flashback, connectique USB, audio et réseau.\nLe point « Compatibilité carte mère » du check compare la puissance du CPU à la gamme du chipset et avertit en cas de combinaisons limites.")],
[1,"tips",M("Wie nutze ich den PC-Check am besten? Ein Überblick über alle Reiter","Comment utiliser au mieux le PC-Check ? Aperçu de tous les onglets"),M("Der PC-Check ist in sechs Reiter gegliedert, die du der Reihe nach nutzen kannst:\n• 01 Konfigurator: Verwendung und Auflösung wählen, optional eine Ziel-Stärke festlegen (die App wählt die Teile) und dann deine Teile prüfen. Rechts siehst du Wertung, Handheld-Vergleich und Hinweise.\n• 02 Engpass-Matrix: Zeigt CPU gegen Grafikkarte, damit du erkennst, ob ein Paar zusammenpasst. Ein Klick übernimmt es in den Konfigurator.\n• 03 Monitor: Pixeldichte, FPS, Kabel und Panel-Typ prüfen.\n• 04 Teile-Datenbank: Alle Bauteile mit Suche, Sortierung und Leistungswerten.\n• 05 Sockel-Guide: Welche CPU passt auf welches Mainboard.\n• 06 Wissen: Erklärungen vom Einsteiger bis zum Profi, mit Suche und Filter.\nTipp: Der Link-Knopf kopiert deine Konfiguration als Link, den du speichern oder teilen kannst.","Le PC-Check est organisé en six onglets que tu peux utiliser dans l'ordre :\n• 01 Configurateur : choisir l'usage et la résolution, fixer éventuellement une puissance visée (l'appli choisit les pièces), puis vérifier tes pièces. À droite, tu vois la note, la comparaison avec les portables et les remarques.\n• 02 Matrice des goulots : montre CPU contre carte graphique pour voir si une paire va bien ensemble. Un clic la reprend dans le configurateur.\n• 03 Écran : vérifier densité de pixels, FPS, câbles et type de dalle.\n• 04 Base de composants : tous les composants avec recherche, tri et valeurs de performance.\n• 05 Guide des sockets : quel CPU va sur quelle carte mère.\n• 06 Savoir : explications du débutant au pro, avec recherche et filtres.\nConseil : le bouton lien copie ta configuration sous forme de lien à enregistrer ou partager.")],
[1,"case",M("Das richtige Gehäuse wählen: Format, Platz und Luft","Bien choisir son boîtier : format, place et air"),M("Das Gehäuse muss zu allem passen, was hineinkommt:\n• Mainboard-Format: Mini-ITX (klein), Micro-ATX (mittel), ATX (Standard), E-ATX (groß). Ein kleineres Board passt in ein größeres Gehäuse, umgekehrt nicht.\n• Grafikkartenlänge: Starke Karten sind oft 30–35 cm lang. Das Gehäuse nennt die maximale Länge. Die Angabe im Check ist ein Richtwert nach Leistungsklasse, die genaue Länge deines Modells steht beim Hersteller.\n• Kühlerhöhe: Luftkühler sind 15–17 cm hoch. Ist das Gehäuse zu schmal, schließt das Seitenteil nicht.\n• Radiator: Eine AIO mit 240, 280 oder 360 mm braucht einen passenden Platz vorn oder oben.\n• Netzteil: Manche kleinen Gehäuse nehmen nur das kleinere SFX-Format.\n• Luftstrom: Gitter (Mesh) in der Front und mehrere Lüfter halten starke Teile kühl und leise. Geschlossene Glasfronten werden wärmer.\nIm Konfigurator prüft der Check Format, Grafikkarte, Kühler, Netzteil und Belüftung automatisch.","Le boîtier doit convenir à tout ce qu'on y met :\n• Format de carte mère : Mini-ITX (petit), Micro-ATX (moyen), ATX (standard), E-ATX (grand). Une carte plus petite entre dans un boîtier plus grand, pas l'inverse.\n• Longueur de la carte graphique : les cartes puissantes font souvent 30–35 cm. Le boîtier indique la longueur maximale. L'indication du check est un repère par gamme de puissance ; la longueur exacte de ton modèle est chez le fabricant.\n• Hauteur du ventirad : les ventirads à air font 15–17 cm. Si le boîtier est trop étroit, le panneau latéral ne ferme pas.\n• Radiateur : un AIO de 240, 280 ou 360 mm demande la place adaptée à l'avant ou en haut.\n• Alimentation : certains petits boîtiers n'acceptent que le format SFX, plus petit.\n• Flux d'air : une façade grillagée (mesh) et plusieurs ventilateurs gardent les pièces puissantes fraîches et silencieuses. Les façades vitrées fermées chauffent davantage.\nDans le configurateur, le check vérifie automatiquement format, carte graphique, ventirad, alimentation et ventilation.")],
[3,"case",M("Kleine Gehäuse (Mini-ITX): Vorteile und Fallen","Petits boîtiers (Mini-ITX) : avantages et pièges"),M("Kleine PCs sind beliebt, aber anspruchsvoller:\n• Platz: Grafikkarte, Kühler und Netzteil haben wenige Millimeter Luft. Vorher alles nachmessen.\n• Netzteil: Meist SFX oder SFX-L mit weniger Leistung und höherem Preis.\n• Kühlung: Starke CPUs und GPUs werden heiß. Oft hilft ein flacher Kühler oder eine AIO mit 240 mm, dazu eine Grafikkarte mit niedriger Leistung (Undervolting).\n• Mainboard: Mini-ITX-Boards haben nur einen PCIe-Slot, meist 1–2 M.2-Slots und weniger Anschlüsse, sind aber oft teurer.\n• Lautstärke: Kleine Lüfter drehen höher. Größere 120-mm-Lüfter sind leiser.\n• Aufrüsten: Später etwas auszutauschen ist schwieriger.\nWer Platz hat, fährt mit einem Micro-ATX- oder ATX-Gehäuse einfacher und leiser.","Les petits PC sont populaires mais plus exigeants :\n• Place : carte graphique, ventirad et alimentation n'ont que quelques millimètres de marge. Tout mesurer avant.\n• Alimentation : souvent SFX ou SFX-L, moins puissante et plus chère.\n• Refroidissement : les CPU et GPU puissants chauffent. Souvent un ventirad bas ou un AIO de 240 mm aide, avec une carte graphique à puissance réduite (undervolting).\n• Carte mère : les cartes Mini-ITX n'ont qu'un slot PCIe, généralement 1–2 slots M.2 et moins de connecteurs, mais sont souvent plus chères.\n• Bruit : les petits ventilateurs tournent plus vite. Les ventilateurs de 120 mm plus grands sont plus silencieux.\n• Évolution : remplacer une pièce plus tard est plus difficile.\nQui a de la place s'en sort plus facilement et plus silencieusement avec un boîtier Micro-ATX ou ATX.")],

Check montre de quel facteur ton système de bureau est plus puissant. Les portables tournent à environ 15–30 W et ont donc nettement moins de puissance qu'un PC de bureau.")]

function monNeed(pix){
  var A=[[2073600,18],[3686400,30],[8294400,55]],i,a,b,sl;
  if(pix<=A[0][0])return A[0][1]*Math.pow(pix/A[0][0],0.89);
  for(i=0;i<2;i++){a=A[i];b=A[i+1];if(pix<=b[0]){sl=Math.log(b[1]/a[1])/Math.log(b[0]/a[0]);return a[1]*Math.pow(pix/a[0],sl)}}
  return 55*Math.pow(pix/8294400,0.79);
}

  if(oled)add("info","Gegen Einbrennen helfen: Taskleiste automatisch ausblenden, dunkles Design, Bildschirmschoner und Pixel-Auffrischung des Monitors nicht abbrechen. Achte beim Kauf auf eine Garantie, die Einbrennen einschließt.","Contre la rémanence : masquer automatiquement la barre des tâches, thème sombre, écran de veille et ne pas interrompre le rafraîchissement des pixels. À l'achat, vérifie une garantie qui couvre la rémanence.");

function applyPreset(i){
  var p=PRESETS[i],v=p.v;
  S.cpu=find(CPUS,v[0]);S.board=find(BOARDS,v[1]);S.gpu=find(GPUS,v[2]);S.ram=find(RAMS,v[3]);S.ssd=find(SSDS,v[4]);S.psu=find(PSUS,v[5]);S.cool=find(COOLERS,v[6]);S.case=find(CASES,v[7]);S.use=p.u;S.res=p.r;
  render();
}
function renderAll(){buildStatic();tgInit();selectsInit();render();renderDB();renderSock();renderFaq();renderMon();renderTools();$$(".lang").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.l===LANG?"true":"false")});document.documentElement.setAttribute("lang",LANG)}
function init(){
  var HASHOK=dec(location.hash);
  renderAll();tlInit();
  ["cpu","board","gpu","ram","ssd","psu","cool","case","use","res"].forEach(function(k){$("#s_"+k).addEventListener("change",function(ev){S[k]=+ev.target.value;render()})});
  $("#t_base").addEventListener("change",function(ev){TG.base=+ev.target.value});
  $("#t_f").addEventListener("change",function(ev){TG.f=+ev.target.value});
  $("#t_cb").addEventListener("change",function(ev){TG.cb=ev.target.value});
  $("#t_gb").addEventListener("change",function(ev){TG.gb=ev.target.value});
  $("#t_new").addEventListener("change",function(ev){TG.nw=ev.target.checked});
  $("#t_go").addEventListener("click",pickTarget);
  $("#m_view").addEventListener("change",function(ev){MXV=+ev.target.value;renderMatrix()});
  $("#opc-presets").addEventListener("click",function(ev){var b=ev.target.closest("[data-p]");if(b)applyPreset(+b.dataset.p)});
  $$(".opc-tab").forEach(function(b,i){b.addEventListener("click",function(){showTab(i)})});
  $$(".lang").forEach(function(b){b.addEventListener("click",function(){LANG=b.dataset.l;try{localStorage.setItem("opc-lang",LANG)}catch(e){}var snap=Object.assign({},S);renderAll();S=snap;render()})});
  $("#opc-dbtabs").addEventListener("click",function(ev){var b=ev.target.closest("[data-d]");if(b){DB.tab=+b.dataset.d;DB.brand="";DB.sortK=null;renderDB()}});
  $("#opc-q").addEventListener("input",function(ev){DB.q=ev.target.value;renderDB()});
  $("#opc-brand").addEventListener("change",function(ev){DB.brand=ev.target.value;renderDB()});
  $("#opc-table").addEventListener("click",function(ev){var b=ev.target.closest("[data-s]");if(b){var k=+b.dataset.s;if(DB.sortK===k)DB.sortD*=-1;else{DB.sortK=k;DB.sortD=1}renderDB()}});
  $("#opc-auto").addEventListener("click",function(){suggest()});
  $("#opc-share").addEventListener("click",function(){var T=t(),u=location.href,m=$("#opc-copymsg");
    function ok(){m.textContent=T.copied}function fail(){m.textContent=T.copyfail+" "+u}
    try{navigator.clipboard.writeText(u).then(ok,fail)}catch(e){fail()}});
  $("#m_use").addEventListener("change",function(ev){S.use=+ev.target.value;renderMatrix();render()});
  $("#m_res").addEventListener("change",function(ev){S.res=+ev.target.value;renderMatrix();render()});
  $("#opc-matrix").addEventListener("click",function(ev){var b=ev.target.closest(".mc");if(b){S.cpu=+b.dataset.c;S.gpu=+b.dataset.g;suggest();showTab(0);window.scrollTo(0,0)}});
  if(!HASHOK)applyPreset(1);else render();showTab(0);
}
init();
})();
</script>
</body>
</html>
