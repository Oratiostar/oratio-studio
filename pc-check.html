<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PC-Check – Oratio Tech Studio</title>
<meta name="description" content="PC-Check: Prüfe in Prozent, ob CPU, Grafikkarte, Mainboard, RAM, SSD, Netzteil und Kühler zusammenpassen. Mit Engpass-Matrix, Teile-Datenbank und Ratgeber.">
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="werkzeuge/wz.css">
<link rel="stylesheet" href="werkzeuge/tools.css">
<style>
/* ===== PC-Check "Prüfstand": dunkler Hardware-Look mit RGB-Akzent ===== */
.opc{
 --bg:#f6f3ff;--card:#ffffff;--card2:#ffffff;--soft:#f0ecfd;--fg:#1f1b3d;--muted:#5f5b80;--line:#ddd6f4;--input:#ffffff;
 --acc:#6a45ff;--accrgb:106,69,255;--onacc:#fff;--acc2:#c6f432;--accfg:#14210a;
 --cy:#0a86d0;--pk:#e02a7c;--or:#f08a1c;
 --ok:#10a35c;--warn:#d98600;--bad:#e0304d;
 --okbg:rgba(16,163,92,.12);--warn-bg:rgba(240,150,0,.14);--badbg:rgba(224,48,77,.12);--track:#e5dff8;--shadow:0 8px 24px -12px rgba(80,50,160,.35);
 --hd:#ebe6fb;--txt2:#3d3961;--pop:#ffffff;--popsh:0 18px 40px rgba(60,40,120,.25);--edge:#d9d0f5;
 --mtxt:#14122b;--mok:#4fd69a;--mwarn:#ffcb4d;--mbad:#ff7b90;--mring:#1f1b3d;
 --rgb:linear-gradient(120deg,#6a45ff 0%,#e02a7c 55%,#ff9a2e 100%);
 position:relative;color:var(--fg);border-radius:28px;border:1px solid var(--edge);
 padding:clamp(16px,3vw,34px);
 background:radial-gradient(800px 380px at 95% -10%,rgba(255,120,190,.20),transparent 62%),radial-gradient(700px 360px at -5% 0%,rgba(90,190,255,.22),transparent 60%),radial-gradient(600px 300px at 50% 115%,rgba(255,190,90,.16),transparent 60%),var(--bg);
 font-variant-numeric:tabular-nums;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .opc{
 --bg:#0d0f1a;--card:#161a2b;--card2:#1c2136;--soft:#1c2136;--fg:#eef1f8;--muted:#a3adc2;--line:#2c3550;--input:#10131f;
 --acc:#a07bff;--accrgb:160,123,255;--cy:#4cc9ff;--pk:#ff5fa8;--or:#ff9f43;--ok:#38d98f;--warn:#ffb629;--bad:#ff5a73;
 --okbg:rgba(56,217,143,.14);--warn-bg:rgba(255,182,41,.14);--badbg:rgba(255,90,115,.15);--track:#2a3350;--shadow:none;
 --hd:#1d2338;--txt2:#c6cddc;--pop:#1a2033;--popsh:0 18px 40px rgba(0,0,0,.55);--edge:#2a3350;
 --mtxt:#06100b;--mok:#2fae77;--mwarn:#c99a1f;--mbad:#c64a63;--mring:#fff;
 --rgb:linear-gradient(120deg,#7c5cff 0%,#ff5fa8 55%,#ff9f43 100%);
 background:radial-gradient(800px 380px at 95% -10%,rgba(160,123,255,.18),transparent 62%),radial-gradient(700px 360px at -5% 0%,rgba(76,201,255,.10),transparent 60%),var(--bg)}}
:root[data-theme="dark"] .opc{
 --bg:#0d0f1a;--card:#161a2b;--card2:#1c2136;--soft:#1c2136;--fg:#eef1f8;--muted:#a3adc2;--line:#2c3550;--input:#10131f;
 --acc:#a07bff;--accrgb:160,123,255;--cy:#4cc9ff;--pk:#ff5fa8;--or:#ff9f43;--ok:#38d98f;--warn:#ffb629;--bad:#ff5a73;
 --okbg:rgba(56,217,143,.14);--warn-bg:rgba(255,182,41,.14);--badbg:rgba(255,90,115,.15);--track:#2a3350;--shadow:none;
 --hd:#1d2338;--txt2:#c6cddc;--pop:#1a2033;--popsh:0 18px 40px rgba(0,0,0,.55);--edge:#2a3350;
 --mtxt:#06100b;--mok:#2fae77;--mwarn:#c99a1f;--mbad:#c64a63;--mring:#fff;
 --rgb:linear-gradient(120deg,#7c5cff 0%,#ff5fa8 55%,#ff9f43 100%);
 background:radial-gradient(800px 380px at 95% -10%,rgba(160,123,255,.18),transparent 62%),radial-gradient(700px 360px at -5% 0%,rgba(76,201,255,.10),transparent 60%),var(--bg)}
.opc *{box-sizing:border-box}
.opc h1{margin:0;font-size:clamp(32px,5.4vw,52px);line-height:1.04;letter-spacing:-.035em;font-weight:800;background:var(--rgb);-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content;max-width:100%}
.opc .eyebrow{margin:0 0 8px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--cy);font-weight:700}
.opc .sub{color:var(--muted);margin:10px 0 22px;max-width:70ch;font-size:16px;line-height:1.55}
.opc h2{margin:0 0 14px;font-size:19px;letter-spacing:-.015em;font-weight:800;color:var(--fg)}
.opc h2.step{display:flex;align-items:center;gap:10px}
.opc h2.step::before{content:attr(data-n);flex:none;width:28px;height:28px;border-radius:9px;background:var(--rgb);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800}
.opc h3{font-weight:800}
.opc p{margin-top:0}
.opc a{color:var(--cy)}
.opc button:focus-visible,.opc select:focus-visible,.opc input:focus-visible,.opc summary:focus-visible,.opc .selbtn:focus-visible{outline:3px solid var(--cy);outline-offset:2px}

/* Navigation */
.ptabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:0 0 24px}
.opc-tab{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:3px;padding:12px 14px;border-radius:16px;background:var(--card);border:2px solid var(--line);min-width:0;transition:transform .12s,border-color .12s}
.opc-tab b{font-size:15px;font-weight:800;letter-spacing:-.01em;color:var(--fg)}
.opc-tab small{font-size:12px;color:var(--muted);line-height:1.3}
.opc-tab i{font-style:normal;font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--cy)}
@media (hover:hover){.opc-tab:hover{border-color:rgba(var(--accrgb),.7);transform:translateY(-1px)}}
.opc-tab[aria-selected="true"]{border:2px solid transparent;background:linear-gradient(var(--card2),var(--card2)) padding-box,var(--rgb) border-box}
.opc-tab:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
@media (max-width:1000px){.ptabs{display:flex;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}.opc-tab{flex:0 0 auto;min-width:150px}}

/* Grundelemente */
.pgrid{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:980px){.pgrid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.panel+.panel{margin-top:16px}
.flds{display:grid;gap:14px}
.fld{display:grid;gap:6px;min-width:0}
.fld span{font:700 11.5px inherit;font-family:inherit;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.opc select,.opc input[type=search],.opc input[type=text]{width:100%;font:15px inherit;font-family:inherit;color:var(--fg);background:var(--input);border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.opc input[type=search]:focus{outline:none;border-color:var(--acc)}
.opc .selbtn{background:var(--input);border:2px solid var(--line);color:var(--fg);border-radius:12px;font-weight:600;font-size:14.5px}
@media (hover:hover){.opc .selbtn:hover{border-color:var(--acc)}}
.opc .selbtn::after{border-color:var(--cy)}
.opc .sel .pop{background:var(--pop);border:2px solid var(--acc);box-shadow:var(--popsh)}
.opc .sel .opt{color:var(--fg);font-weight:500}
.opc .sel .opt.cur{background:var(--acc);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.two{grid-template-columns:1fr}}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.pbtn{font:700 14px inherit;font-family:inherit;border:2px solid var(--line);background:var(--card2);color:var(--fg);border-radius:13px;padding:11px 16px;cursor:pointer}
.pbtn.go{background:var(--rgb);border-color:transparent;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25)}
@media (hover:hover){.pbtn:hover{border-color:var(--acc)}.pbtn.go:hover{filter:brightness(1.1);border-color:transparent}}
.cmsg{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.legend{font-size:13.5px;color:var(--muted);margin:0;line-height:1.5}
.chk{display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer;color:var(--fg)}
.chk input{width:20px;height:20px;accent-color:var(--acc);flex:none}
.tip{margin:14px 0 0;color:var(--muted);max-width:75ch;line-height:1.55}

/* Schnellstart */
.presets{margin:0 0 20px}
.presets h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:600 13.5px inherit;font-family:inherit;color:var(--fg);background:var(--card);border:2px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
@media (hover:hover){.chip:hover{border-color:var(--acc);background:var(--card2)}}

/* Ergebnis */
.pres{display:grid;gap:20px}
.score{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.ring{--rc:var(--ok);width:152px;height:152px;border-radius:50%;background:conic-gradient(var(--rc) calc(var(--p)*1%),var(--track) 0);display:grid;place-items:center;flex:none;position:relative;filter:drop-shadow(0 0 14px color-mix(in srgb,var(--rc) 45%,transparent))}
.ring.v-warn{--rc:var(--warn)}.ring.v-bad{--rc:var(--bad)}
.ring::before{content:"";position:absolute;inset:13px;border-radius:50%;background:var(--card)}
.ring b{position:relative;display:flex;align-items:baseline;font-weight:800;font-size:44px;letter-spacing:-.04em;line-height:1}
.ring b i{font-style:normal;font-size:18px;font-weight:700;margin-left:2px;color:var(--muted);letter-spacing:0}
.verdict{font-size:26px;font-weight:800;margin:0;letter-spacing:-.02em}
.verdict.v-ok{color:var(--ok)}.verdict.v-warn{color:var(--warn)}.verdict.v-bad{color:var(--bad)}
.vh{display:grid;gap:8px;min-width:0;flex:1 1 240px}
.hhchip{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hhchip .chl{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.hhchip .hch{background:rgba(var(--accrgb),.14);border:1px solid rgba(var(--accrgb),.55);border-radius:999px;padding:4px 12px;font-size:13.5px}
.hhchip .hch b{font-size:15px;font-weight:800}
.hhchip .hch.lo{background:var(--warn-bg);border-color:var(--warn)}
.pstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.st{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:4px}
.st span{font-size:12px;color:var(--muted)}
.st b{font-size:20px;font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere}
.chks{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}
.pchk{padding:14px 16px;border-radius:16px;background:var(--soft);border:1px solid var(--line);border-top:4px solid var(--ok);display:grid;gap:9px;align-content:start}
.pchk.v-warn{border-top-color:var(--warn)}.pchk.v-bad{border-top-color:var(--bad)}
.pch{display:flex;justify-content:space-between;gap:10px;align-items:center}
.cn{font-weight:700;font-size:15px}
.cp{font-weight:800;font-size:13px;padding:3px 10px;border-radius:99px;letter-spacing:0;white-space:nowrap}
.pchk.v-ok .cp{color:var(--ok);background:var(--okbg)}.pchk.v-warn .cp{color:var(--warn);background:var(--warn-bg)}.pchk.v-bad .cp{color:var(--bad);background:var(--badbg)}
.pbar{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .35s ease}
.pchk.v-warn .pbar i{background:var(--warn)}.pchk.v-bad .pbar i{background:var(--bad)}
.cm{margin:0;font-size:14px;color:var(--muted);line-height:1.5}
.hints{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.hints li{padding:11px 14px;border-radius:12px;font-size:14px;line-height:1.5;background:var(--soft);border:1px solid var(--line);border-left:5px solid var(--cy)}
.hints li.v-warn{background:var(--warn-bg);border-color:rgba(255,182,41,.35);border-left-color:var(--warn)}
.hints li.v-bad{background:var(--badbg);border-left-color:var(--bad)}

/* Handheld-Vergleich */
.hhg{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;margin:10px 0 6px}
.hhc{background:var(--soft);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;gap:10px;position:relative;overflow:hidden}
.hhc::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--rgb)}
.hht{display:grid;gap:2px}.hht small{color:var(--muted);font-size:12.5px;line-height:1.4}
.hha{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.hha span{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.hha strong{font-size:36px;font-weight:800;letter-spacing:-.04em;background:var(--rgb);-webkit-background-clip:text;background-clip:text;color:transparent}
.hr{display:grid;grid-template-columns:108px 1fr 56px;gap:10px;align-items:center;font-size:13px}
.hr b{font-weight:700;text-align:right}
.hr .pbar{position:relative;overflow:visible}.hr .pbar i{background:var(--cy)}
.hr .pbar u{position:absolute;top:-4px;width:2px;height:16px;background:var(--fg);opacity:.5;text-decoration:none}
@media (max-width:480px){.hr{grid-template-columns:92px 1fr 50px}}

/* Ziel-Stärke */
.tgp{border-top:3px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,var(--rgb) border-box;border-top-left-radius:22px}
.tgp .legend{margin:0 0 14px}
.tgmsg{margin:14px 0 0;font-size:14px;line-height:1.55;padding:11px 14px;border-radius:12px;background:var(--soft);border:1px solid var(--line)}
.tgmsg:empty{display:none}
.tgmsg.v-ok{border-left:5px solid var(--ok)}.tgmsg.v-warn{border-left:5px solid var(--warn)}.tgmsg.v-bad{border-left:5px solid var(--bad)}

/* Tabellen / Datenbank */
.dbbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.segs{display:flex;gap:6px;flex-wrap:wrap}
.psg{font:700 13.5px inherit;font-family:inherit;border:2px solid var(--line);background:var(--card);color:var(--muted);border-radius:11px;padding:8px 13px;cursor:pointer}
.psg.sel{background:var(--rgb);color:#fff;border-color:transparent}
@media (hover:hover){.psg:not(.sel):hover{border-color:var(--acc);color:var(--fg)}}
.dbbar input[type=search]{flex:1 1 180px;max-width:320px}
.dbbar .sel{width:auto;min-width:130px}
.count{font-size:13px;color:var(--muted);margin-left:auto}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.opc table{border-collapse:collapse;width:100%;font-size:14px}
.opc th,.opc td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.opc td.nm{font-weight:700;white-space:normal;min-width:220px}
.opc th{background:var(--hd);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
@media (hover:hover){.opc tbody tr:hover td{background:rgba(var(--accrgb),.07)}}
.sorter{all:unset;cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit}
.sorter:focus-visible{outline:3px solid var(--cy)}
.opc tbody tr:last-child td{border-bottom:0}
.bcw{display:flex;align-items:center;gap:10px;min-width:140px}
.bcw b{font-weight:700;font-size:13px;min-width:3ch;text-align:right}
.mini{flex:1;height:8px;background:var(--track);border-radius:99px;overflow:hidden;min-width:60px}
.mini i{display:block;height:100%;background:var(--rgb);border-radius:99px}
#opc-socktbl td{white-space:normal;min-width:110px}

/* Engpass-Matrix */
.mxbar{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}
.mxbar .fld{min-width:200px;flex:1 1 200px;max-width:300px}
.mxax{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.mxax span{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--fg)}
.mxax span:first-child{border-color:var(--cy)}.mxax span:last-child{border-color:var(--pk)}
.tw.mxw{max-height:min(78vh,760px);overflow:auto;padding:0;position:relative;isolation:isolate}
.mx{border-collapse:separate!important;border-spacing:0;width:auto!important;background:var(--card)}
.opc .mx th,.opc .mx td{padding:0;border:0;text-transform:none;letter-spacing:0;background:transparent}
.opc .mx thead th{position:sticky;top:0;z-index:20;background:var(--hd)!important}
.opc .mx th.cor{left:0;z-index:30;min-width:96px;max-width:96px;font-size:11.5px;font-weight:800;line-height:1.3;text-align:center;vertical-align:middle;color:var(--fg);background:var(--hd)!important}
.opc .mx th.cor span{display:block;color:var(--pk)}.opc .mx th.cor em{display:block;color:var(--cy);font-style:normal}
.opc .mx th[scope=row]{text-align:right;padding:0 10px!important;font-size:12.5px;white-space:nowrap;color:var(--fg);position:sticky;left:0;z-index:10;background:var(--hd)!important;border-radius:8px}
.opc .mx thead th.v{height:120px;vertical-align:bottom;font-size:12px;color:var(--fg);border-radius:8px}
.mx th.v span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;display:inline-block;padding-bottom:8px}
.opc .mx th.hl{background:color-mix(in srgb,var(--acc) 30%,var(--card))!important;color:var(--fg);font-weight:800}
.mc{width:38px;height:30px;border:0;border-radius:8px;cursor:pointer;display:block;padding:0;font:700 12.5px/1 inherit;font-family:inherit;color:var(--mtxt)}
.mc.v-ok{background:var(--mok)}
.mc.v-warn{background:var(--mwarn)}
.mc.v-bad{background:var(--mbad)}
.opc .mc.cur{box-shadow:inset 0 0 0 3px var(--mring),inset 0 0 0 5px #fff6}
@media (hover:hover){.mc:hover{opacity:.78}}

/* Wissen */
.wbar{display:grid;gap:12px;margin-bottom:16px}
.wbar .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.wbar input[type=search]{flex:1 1 240px;max-width:420px}
.wtop{display:flex;gap:6px;flex-wrap:wrap}
.wtop .psg{font-size:12.5px;padding:6px 11px}
.opc .fqh{margin:26px 0 12px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--cy);display:flex;align-items:center;gap:12px}
.opc .fqh::after{content:"";flex:1;height:1px;background:var(--line)}
.opc .fqh:first-child{margin-top:0}
.opc details{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:0 18px;margin-bottom:10px}
.opc details[open]{border-color:rgba(var(--accrgb),.55);background:linear-gradient(180deg,rgba(var(--accrgb),.07),transparent 120px),var(--card)}
.opc summary{cursor:pointer;font-weight:700;font-size:16px;padding:16px 0;list-style:none;display:flex;gap:12px;align-items:center}
.opc summary::-webkit-details-marker{display:none}
.opc summary::after{content:"+";margin-left:auto;font-size:24px;color:var(--cy);line-height:1;flex:none}
.opc details[open] summary::after{content:"−"}
.opc summary .tt{min-width:0;flex:1 1 auto}
.lv{flex:none;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:99px;border:1px solid}
.lv1{color:var(--ok);background:var(--okbg);border-color:rgba(56,217,143,.5)}
.lv2{color:var(--cy);background:rgba(76,201,255,.12);border-color:rgba(76,201,255,.5)}
.lv3{color:var(--pk);background:rgba(255,95,168,.12);border-color:rgba(255,95,168,.5)}
.fqb{padding:0 0 8px}
.fqb p{margin:0 0 12px;max-width:78ch;color:var(--txt2);line-height:1.65}
.fqb p.fn{margin:0 0 7px 4px;color:var(--fg)}
.fqb ul{margin:0 0 14px;padding-left:22px;max-width:78ch;color:var(--txt2);line-height:1.65}
.fqb li{margin-bottom:6px}
.fqb li::marker{color:var(--acc)}
.fqb .tg{display:inline-block;font-size:11.5px;color:var(--muted);margin-top:4px}
.wnone{color:var(--muted);padding:20px;text-align:center}

/* Monitor */
.mon{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:980px){.mon{grid-template-columns:minmax(0,1fr)}}
.mres{display:grid;gap:16px}

.cab span{font-weight:800;font-size:13px;padding:2px 10px;border-radius:99px}
.cab .y span{background:var(--okbg)}.cab .n span{background:var(--badbg)}.cab .d span{background:var(--warn-bg)}
.pnl{display:grid;gap:7px}
.pnl .r{display:grid;grid-template-columns:130px 1fr;gap:10px;align-items:center;font-size:13.5px}

.seg5{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.seg5 i{height:9px;border-radius:4px;background:var(--track)}
.seg5 i.on{background:var(--rgb)}
.seg5.neg i.on{background:linear-gradient(90deg,var(--warn),var(--bad))}
.pnlh{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.pnlh b{font-size:22px;letter-spacing:-.02em}

.disc{margin:26px 0 0;padding:14px 16px;border:1px dashed var(--line);border-radius:14px;font-size:13px;color:var(--muted);line-height:1.55}

.opc .wbar .psg{width:auto;flex:0 0 auto}

#opc-mxl,#mon-tip,#opc-socktip{margin-top:14px}
#mon-table table{min-width:760px}

/* Stärke-Balken in Matrix-Köpfen */
.opc .mx .sb{display:block;height:4px;border-radius:3px;background:var(--track);margin-top:5px;position:relative;overflow:hidden}
.opc .mx .sb::after{content:"";position:absolute;inset:0;width:var(--w);background:var(--rgb);border-radius:3px}
.opc .mx th[scope=row] .sb{margin-top:3px;min-width:60px}
.opc .mx thead th.v{width:38px}
.opc .mx thead th.v .sb{width:100%;margin:6px 0 0}
.mxscale{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin:0 0 10px;flex-wrap:wrap}
.mxscale i{display:inline-block;width:120px;max-width:30vw;height:6px;border-radius:3px;background:var(--rgb)}
.mxkey{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--txt2);margin:0 0 12px}
.mxkey span::before{content:"";display:inline-block;width:14px;height:14px;border-radius:5px;margin-right:6px;vertical-align:-2px;background:var(--c)}
.mxbar .fld:nth-child(3){display:none}

/* Matrix: keine Lücken, durch die Felder beim Scrollen hinter den Köpfen sichtbar werden */
.opc .mx td{padding:1.5px 2px;background:var(--card)}
.opc .mx thead th{border-bottom:6px solid var(--card);background-clip:padding-box;background-color:var(--hd)}
.opc .mx thead th.v{border-left:2px solid var(--card);border-right:2px solid var(--card);box-sizing:border-box}
.opc .mx th[scope=row]{border:0;border-right:8px solid var(--card);border-top:1.5px solid var(--card);border-bottom:1.5px solid var(--card);border-radius:0}
.opc .mx th.cor{border:0;border-right:8px solid var(--card);border-bottom:6px solid var(--card);border-radius:0}
.tw.mxw{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.opc .mx th[scope=row],.opc .mx th.cor,.opc .mx thead th{transform:translateZ(0)}

/* Balken: Spalten senkrecht, Zeilen waagerecht, jeweils am Rand zur Matrix */
.opc .mx thead th.v{position:sticky}
.opc .mx .sb.vb{position:absolute;right:5px;left:auto;top:8px;bottom:8px;width:4px;height:auto;margin:0;background:var(--track)}
.opc .mx .sb.vb::after{inset:auto 0 0 0;width:auto;height:var(--w);background:linear-gradient(0deg,#ff9a2e,#e02a7c,#6a45ff)}
.opc .mx thead th.v span{padding-bottom:6px;padding-right:12px}
.opc .mx th[scope=row]{position:sticky}
.opc .mx th[scope=row] .sb{position:absolute;left:8px;right:8px;bottom:2px;margin:0;height:3px}
.hhmore{margin-top:14px}
.hhmore summary{font-size:15px}
.hhmore .hhg{padding:4px 0 14px}

.opc .mx thead th.v .sb.vb{position:absolute;right:5px;left:auto;top:8px;bottom:8px;width:4px;height:auto;margin:0}
.opc .mx thead th.v .sb.vb::after{inset:auto 0 0 0;width:auto;height:var(--w)}

/* Rechner & Tools */
.tlh{margin:0 0 4px;font-size:20px;letter-spacing:-.02em}
.mcard .three{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.mcard .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.mcard.ok{border-color:var(--mok)}.mcard.warn{border-color:var(--mwarn)}.mcard.bad{border-color:var(--mbad)}
.opc .pnl .r b.tb{font-size:17px}
.lbar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.lbar i{display:block;height:100%;border-radius:99px;background:var(--acc)}
.lbar i.ok{background:var(--mok)}.lbar i.warn{background:var(--mwarn)}.lbar i.bad{background:var(--mbad)}
.fpsc{display:inline-block;min-width:68px;text-align:center;padding:5px 10px;border-radius:9px;font-weight:700;color:var(--mtxt)}
.fpsc.v-ok{background:var(--mok)}.fpsc.v-warn{background:var(--mwarn)}.fpsc.v-bad{background:var(--mbad)}
.ckl{list-style:none;margin:6px 0 14px;padding:0;display:grid;gap:8px;counter-reset:ck}
.ckl li{counter-increment:ck;background:var(--card);border:1px solid var(--line);border-radius:12px}
.ckl label{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:11px 14px;cursor:pointer;line-height:1.5;font-size:14.5px}
.ckl label span::before{content:counter(ck) ". ";font-weight:800;color:var(--acc)}
.ckl input{width:20px;height:20px;margin-top:2px;accent-color:var(--acc)}
.ckl input:checked+span{opacity:.55;text-decoration:line-through}
.tltxt{width:100%;box-sizing:border-box;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:inherit;resize:vertical;margin-bottom:10px}
@media (max-width:560px){.mcard .tw th,.mcard .tw td{padding-left:8px;padding-right:8px}.fpsc{min-width:0;padding:4px 7px;font-size:13px}.mcard .tw td.nm{font-size:13px}}

var FAQ=[
[1,"pcie",M("Was ist PCIe und wofür braucht man es überhaupt?","Qu'est-ce que le PCIe et à quoi sert-il ?"),M("PCIe (PCI Express) ist die Datenautobahn im PC. Alles, was schnell mit dem Prozessor reden muss, hängt daran:\n• die Grafikkarte (der größte Nutzer)\n• NVMe-SSDs im M.2-Steckplatz\n• Erweiterungskarten wie WLAN-/Netzwerkkarten, Soundkarten, Capture-Karten für Streaming oder SATA-Zusatzcontroller\n• der Chipsatz auf dem Mainboard, der wiederum USB, SATA und LAN verteilt\nOhne PCIe gäbe es keinen schnellen Weg zwischen CPU und diesen Teilen. Wichtig zu wissen: Es kommt nicht nur auf die Version an (3.0, 4.0, 5.0), sondern auch auf die Zahl der Lanes, also wie viele „Fahrspuren“ ein Gerät bekommt.","Le PCIe (PCI Express) est l'autoroute de données du PC. Tout ce qui doit communiquer vite avec le processeur y est relié :\n• la carte graphique (le plus gros utilisateur)\n• les SSD NVMe dans le slot M.2\n• les cartes d'extension : Wi-Fi/réseau, cartes son, cartes de capture pour le streaming, contrôleurs SATA supplémentaires\n• le chipset de la carte mère, qui distribue à son tour l'USB, le SATA et le réseau\nSans PCIe, il n'y aurait pas de voie rapide entre le CPU et ces composants. À retenir : ce n'est pas seulement la version (3.0, 4.0, 5.0) qui compte, mais aussi le nombre de lanes, c'est-à-dire de « voies » attribuées à un appareil.")],
[1,"pcie",M("Was sind Lanes (Spuren) und was bedeuten x1, x4, x8, x16?","Que sont les lanes (voies) et que signifient x1, x4, x8, x16 ?"),M("Eine Lane ist eine Fahrspur aus zwei Leitungspaaren (eine Richtung senden, eine empfangen). Ein Gerät kann mehrere Lanes bündeln:\n• x1 = 1 Lane (kleine Karten: WLAN, Soundkarte, USB-Zusatzkarte)\n• x4 = 4 Lanes (NVMe-SSDs, schnelle Netzwerkkarten, Capture-Karten)\n• x8 = 8 Lanes (kleinere Grafikkarten wie RTX 4060/5060, RX 7600, Server-Karten)\n• x16 = 16 Lanes (normale Grafikkarten)\nDie Geschwindigkeit ist Lanes mal Geschwindigkeit pro Lane. Ein Vergleich: Stell dir eine Autobahn vor. Die PCIe-Version ist das Tempolimit, die Lane-Zahl ist die Anzahl der Spuren. Eine Karte mit x8 auf Version 4.0 ist so schnell wie x16 auf Version 3.0.","Une lane est une voie composée de deux paires de fils (une pour émettre, une pour recevoir). Un appareil peut regrouper plusieurs lanes :\n• x1 = 1 lane (petites cartes : Wi-Fi, carte son, carte USB supplémentaire)\n• x4 = 4 lanes (SSD NVMe, cartes réseau rapides, cartes de capture)\n• x8 = 8 lanes (cartes graphiques plus petites comme RTX 4060/5060, RX 7600, cartes serveur)\n• x16 = 16 lanes (cartes graphiques classiques)\nLa vitesse = nombre de lanes × vitesse par lane. Image : une autoroute. La version PCIe est la limite de vitesse, le nombre de lanes est le nombre de voies. Une carte en x8 sur PCIe 4.0 est aussi rapide qu'en x16 sur PCIe 3.0.")],
[2,"pcie",M("Wie schnell ist PCIe 3.0, 4.0, 5.0 und 6.0 wirklich?","Quelle est la vitesse réelle du PCIe 3.0, 4.0, 5.0 et 6.0 ?"),M("Pro Lane und Richtung grob gerechnet:\n• PCIe 3.0: etwa 1 GB/s pro Lane, also x4 ≈ 4 GB/s und x16 ≈ 16 GB/s\n• PCIe 4.0: etwa 2 GB/s pro Lane, also x4 ≈ 8 GB/s und x16 ≈ 32 GB/s\n• PCIe 5.0: etwa 4 GB/s pro Lane, also x4 ≈ 16 GB/s und x16 ≈ 64 GB/s\n• PCIe 6.0: etwa 8 GB/s pro Lane, bisher nur Server und Rechenzentren\nJede Version verdoppelt die Geschwindigkeit der vorherigen. Alle Versionen sind abwärtskompatibel: Eine 5.0-Karte läuft im 3.0-Slot, nur eben mit der Geschwindigkeit der kleineren Version. Eine aktuelle Grafikkarte schöpft selbst 5.0 x16 in Spielen nicht aus; die Praxisunterschiede zwischen 4.0 und 5.0 sind bei Grafikkarten klein.","Calcul approximatif par lane et par sens :\n• PCIe 3.0 : environ 1 Go/s par lane, donc x4 ≈ 4 Go/s et x16 ≈ 16 Go/s\n• PCIe 4.0 : environ 2 Go/s par lane, donc x4 ≈ 8 Go/s et x16 ≈ 32 Go/s\n• PCIe 5.0 : environ 4 Go/s par lane, donc x4 ≈ 16 Go/s et x16 ≈ 64 Go/s\n• PCIe 6.0 : environ 8 Go/s par lane, pour l'instant uniquement serveurs et centres de données\nChaque version double la vitesse de la précédente. Toutes les versions sont rétrocompatibles : une carte 5.0 fonctionne dans un slot 3.0, mais à la vitesse de la version inférieure. Une carte graphique actuelle n'exploite même pas le 5.0 x16 dans les jeux ; en pratique, la différence entre 4.0 et 5.0 est faible pour les cartes graphiques.")],
[2,"pcie",M("Welche Steckplatz-Typen gibt es auf dem Mainboard?","Quels types de slots y a-t-il sur la carte mère ?"),M("Auf einem Mainboard findest du meist diese Steckplätze:\n• PCIe-x16-Slot: lang, für die Grafikkarte. Der oberste ist meist direkt mit der CPU verbunden.\n• PCIe-x4-/x1-Slots: kürzer, für Zusatzkarten. Eine kleine Karte passt auch in einen längeren Slot.\n• M.2-Slots (Key M): für NVMe-SSDs, meist 2280 (22 mm breit, 80 mm lang). Manche M.2-Slots sind nur PCIe 3.0 oder teilen sich Lanes mit SATA-Ports.\n• SATA-Anschlüsse: für 2,5\"-SSDs und Festplatten, kein PCIe, aber vom Chipsatz abhängig.\nAchtung: Ein Slot kann mechanisch x16 sein, aber elektrisch nur x4 oder x8 angebunden. Das steht im Handbuch („x16 Slot (läuft mit x4)“). Die unteren langen Slots sind sehr oft nur x4.","Sur une carte mère, on trouve généralement :\n• Slot PCIe x16 : long, pour la carte graphique. Le premier est souvent relié directement au CPU.\n• Slots PCIe x4 / x1 : plus courts, pour les cartes d'extension. Une petite carte tient aussi dans un slot plus long.\n• Slots M.2 (clé M) : pour les SSD NVMe, en général 2280 (22 mm de large, 80 mm de long). Certains slots M.2 ne sont qu'en PCIe 3.0 ou partagent leurs lanes avec des ports SATA.\n• Ports SATA : pour les SSD 2,5\" et disques durs ; ce n'est pas du PCIe, mais cela dépend du chipset.\nAttention : un slot peut être mécaniquement x16 mais électriquement raccordé en x4 ou x8 seulement. C'est indiqué dans le manuel (« slot x16 (fonctionne en x4) »). Les slots longs du bas sont très souvent en x4.")],
[3,"pcie",M("Woher kommen die Lanes? CPU-Lanes und Chipsatz-Lanes","D'où viennent les lanes ? Lanes du CPU et du chipset"),M("Lanes sind begrenzt und kommen aus zwei Quellen:\n• CPU-Lanes: direkt am Prozessor, am schnellsten. Ein Ryzen 7000/9000 liefert etwa 24 nutzbare PCIe-5.0-Lanes: 16 für die Grafikkarte, 4 + 4 für zwei M.2-SSDs (und 4 weitere zum Chipsatz). Intel Core 12.–14. Gen liefert 16 Lanes für die Grafikkarte (5.0) plus 4 für eine M.2-SSD (4.0); Core Ultra 200S etwas mehr.\n• Chipsatz-Lanes: der Chipsatz (X870, B650, Z790 …) hängt über einen gemeinsamen Link an der CPU und verteilt weitere Lanes an zusätzliche M.2-Slots, x1-/x4-Slots, SATA, USB und LAN. Alle Geräte am Chipsatz teilen sich diesen einen Link.\nDeshalb sind Edel-Chipsätze (X870E, Z890) besser ausgestattet als Einsteiger-Chipsätze (A620, H610): mehr Lanes, mehr M.2-Slots, höhere PCIe-Version. Die Spalte „GPU-Slot“ und „NVMe“ in der Teile-Datenbank zeigt die Version pro Chipsatz.","Les lanes sont limitées et viennent de deux sources :\n• Lanes du CPU : directement sur le processeur, les plus rapides. Un Ryzen 7000/9000 fournit environ 24 lanes PCIe 5.0 utilisables : 16 pour la carte graphique, 4 + 4 pour deux SSD M.2 (et 4 autres vers le chipset). Les Intel Core 12e–14e gén. offrent 16 lanes pour la carte graphique (5.0) plus 4 pour un SSD M.2 (4.0) ; les Core Ultra 200S un peu plus.\n• Lanes du chipset : le chipset (X870, B650, Z790 …) est relié au CPU par un lien commun et distribue d'autres lanes vers des slots M.2 supplémentaires, slots x1/x4, SATA, USB et réseau. Tous les appareils du chipset se partagent ce lien unique.\nC'est pourquoi les chipsets haut de gamme (X870E, Z890) sont mieux équipés que les chipsets d'entrée de gamme (A620, H610) : plus de lanes, plus de slots M.2, version PCIe plus élevée. Les colonnes « Slot GPU » et « NVMe » de la base de composants indiquent la version par chipset.")],
[3,"pcie",M("Was passiert, wenn sich Geräte Lanes teilen?","Que se passe-t-il quand des appareils se partagent des lanes ?"),M("Das ist ein häufiger Stolperstein bei günstigen Boards:\n• Ein zweiter M.2-Slot kann SATA-Ports abschalten (z. B. „M2_2 teilt sich mit SATA 5/6“). Dann funktionieren die SATA-Laufwerke an diesen Ports nicht mehr.\n• Wenn du einen zweiten Grafik-Slot oder Adapter nutzt, kann der erste Slot von x16 auf x8 zurückfallen.\n• Ein Slot im Chipsatz-Bereich teilt sich die Bandbreite mit USB, SATA und LAN. Für eine SSD oder Capture-Karte ist das meist okay, für mehrere schnelle Geräte gleichzeitig kann es eng werden.\nIm Handbuch des Mainboards gibt es dafür eine Tabelle („Lane Sharing“). Schau dort nach, bevor du alle Slots füllst. Der Check weist nur auf die Zahl der M.2-Slots hin, nicht auf jedes Sharing.","C'est un piège fréquent sur les cartes abordables :\n• Un second slot M.2 peut désactiver des ports SATA (par ex. « M2_2 partage avec SATA 5/6 »). Les disques SATA branchés sur ces ports ne fonctionnent alors plus.\n• Si tu utilises un second slot graphique ou un adaptateur, le premier slot peut passer de x16 à x8.\n• Un slot côté chipset partage sa bande passante avec l'USB, le SATA et le réseau. Pour un SSD ou une carte de capture, c'est en général suffisant ; pour plusieurs appareils rapides en même temps, cela peut devenir juste.\nLe manuel de la carte mère contient un tableau pour cela (« lane sharing »). Consulte-le avant de remplir tous les slots. Le check n'indique que le nombre de slots M.2, pas chaque partage.")],
[2,"pcie",M("Grafikkarte mit nur x8 oder x4: ist das schlimm?","Carte graphique en x8 ou x4 : est-ce grave ?"),M("Es kommt auf Karte und Slot an:\n• x16-Karten (RTX 4070 und größer, RX 7800 XT …): kaum Verlust, auch in einem PCIe-3.0-Slot (meist unter 5 %).\n• x8-Karten (RTX 4060, RTX 5060, RX 7600, RX 9060 XT, Arc B580): in einem 4.0- oder 5.0-Slot völlig in Ordnung. In einem 3.0-Slot (z. B. B450, A520, 10./11. Gen Intel) kann es je nach Spiel einige bis etwa 10–20 % kosten, besonders wenn der Grafikspeicher knapp wird.\n• x4-Karten (RX 6500 XT, RX 6400, Arc A310/A380 mit x8): in 3.0-Slots teils deutlich langsamer (in manchen Spielen 20–30 %).\nMerksregel: Eine x8-/x4-Karte gehört auf ein Board mit PCIe 4.0 oder besser. Bei einer x16-Karte ist die Slot-Version egal. Der Check zeigt dir das im Punkt „PCIe-Anbindung“ mit einem Prozentwert.","Cela dépend de la carte et du slot :\n• Cartes x16 (RTX 4070 et au-dessus, RX 7800 XT …) : très peu de perte, même dans un slot PCIe 3.0 (en général moins de 5 %).\n• Cartes x8 (RTX 4060, RTX 5060, RX 7600, RX 9060 XT, Arc B580) : parfaitement bien dans un slot 4.0 ou 5.0. Dans un slot 3.0 (par ex. B450, A520, Intel 10e/11e gén.), cela peut coûter quelques % à environ 10–20 % selon le jeu, surtout quand la mémoire graphique devient juste.\n• Cartes x4 (RX 6500 XT, RX 6400) : parfois nettement plus lentes dans un slot 3.0 (20–30 % dans certains jeux).\nRègle simple : une carte x8/x4 doit aller sur une carte mère PCIe 4.0 ou mieux. Pour une carte x16, la version du slot importe peu. Le check l'indique au point « Liaison PCIe » avec un pourcentage.")],
[2,"storage",M("NVMe-SSDs und PCIe: was ist M.2, was Gen3/Gen4/Gen5?","SSD NVMe et PCIe : qu'est-ce que le M.2, la Gen3/Gen4/Gen5 ?"),M("M.2 ist nur die Bauform (ein kleiner Riegel auf dem Board). Entscheidend ist, wie die SSD angeschlossen ist:\n• M.2 NVMe nutzt PCIe x4: Gen3 ≈ 3,5 GB/s, Gen4 ≈ 7 GB/s, Gen5 ≈ 10–14 GB/s.\n• M.2 SATA sieht gleich aus, ist aber nur so schnell wie eine normale SATA-SSD (≈ 0,55 GB/s). Achte beim Kauf auf „NVMe“.\n• Gen5-SSDs werden sehr heiß und brauchen einen Kühlkörper; im Alltag und in Spielen merkst du gegenüber Gen4 fast nichts. Ladezeiten hängen eher von der CPU und vom Spiel ab.\n• Eine Gen4-SSD im Gen3-Slot läuft mit etwa 3,5 GB/s, eine Gen5-SSD im Gen4-Slot mit etwa 7 GB/s: kein Problem, nur nicht ausgereizt.\nFür die meisten Menschen ist eine gute Gen4-SSD mit 1–2 TB die beste Wahl. Der Check bewertet nur, ob das Board die SSD ausreizen kann.","Le M.2 n'est que le format (une petite barrette sur la carte). Ce qui compte, c'est le mode de raccordement :\n• Le M.2 NVMe utilise du PCIe x4 : Gen3 ≈ 3,5 Go/s, Gen4 ≈ 7 Go/s, Gen5 ≈ 10–14 Go/s.\n• Le M.2 SATA a la même apparence, mais n'est aussi rapide qu'un SSD SATA normal (≈ 0,55 Go/s). À l'achat, vérifie la mention « NVMe ».\n• Les SSD Gen5 chauffent beaucoup et demandent un dissipateur ; au quotidien et dans les jeux, tu ne vois presque pas de différence avec la Gen4. Les temps de chargement dépendent plutôt du CPU et du jeu.\n• Un SSD Gen4 dans un slot Gen3 tourne à environ 3,5 Go/s, un SSD Gen5 dans un slot Gen4 à environ 7 Go/s : aucun souci, simplement pas exploité à fond.\nPour la plupart des gens, un bon SSD Gen4 de 1–2 To est le meilleur choix. Le check évalue seulement si la carte mère exploite le SSD.")],
[1,"pcie",M("Muss ich PCIe 5.0 haben oder reicht 4.0?","Faut-il du PCIe 5.0 ou le 4.0 suffit-il ?"),M("Für die meisten reicht 4.0 völlig:\n• Grafikkarte: Selbst eine RTX 5090 verliert in 4.0 x16 nur wenige Prozent. Ein 5.0-Slot lohnt sich also nicht extra für die Grafikkarte.\n• SSD: Gen5-SSDs sind im Alltag kaum spürbar schneller. Sinnvoll sind sie bei sehr großen Dateien (Videoschnitt mit 8K-Material, Datenbanken).\n• Zukunft: Neue Boards (X870, B850, Z890) haben 5.0 meist ohnehin. Wenn du ein Board mit 5.0 für die Grafikkarte günstig bekommst, ist das gut, mehr nicht.\nGeld lieber in eine stärkere Grafikkarte oder mehr RAM stecken. Ausnahme: Kauf einer x8-Karte, dann auf mindestens 4.0 achten (siehe oben).","Pour la plupart des gens, le 4.0 suffit largement :\n• Carte graphique : même une RTX 5090 ne perd que quelques % en 4.0 x16. Un slot 5.0 ne vaut donc pas un surcoût pour la carte graphique.\n• SSD : les SSD Gen5 sont à peine plus rapides au quotidien. Ils ont un intérêt pour de très gros fichiers (montage vidéo en 8K, bases de données).\n• Avenir : les cartes récentes (X870, B850, Z890) ont de toute façon généralement le 5.0. Si tu en obtiens une avec 5.0 pour la carte graphique à bon prix, c'est bien, sans plus.\nMets plutôt l'argent dans une carte graphique plus puissante ou plus de RAM. Exception : si tu achètes une carte x8, vise au moins le 4.0 (voir plus haut).")],
[2,"pcie",M("Welche Erweiterungskarten brauchen PCIe und welche Lanes?","Quelles cartes d'extension demandent du PCIe et combien de lanes ?"),M("Typische Karten und ihr Bedarf:\n• WLAN-/Bluetooth-Karte: x1\n• Soundkarte: x1\n• 2,5-/10-Gbit-Netzwerkkarte: x1 bis x4 (10 Gbit braucht meist x4)\n• Capture-Karte (Streaming, Konsole aufnehmen): x1 bis x4\n• SATA-/USB-Zusatzkarte: x1 bis x4\n• Thunderbolt-Karte: x4\n• M.2-Adapterkarte (für weitere SSDs): x4, für 2–4 SSDs x8 oder x16 mit Bifurcation\n• zweite Grafikkarte (z. B. für KI): x8 bis x16\nRegel: Eine x1-Karte funktioniert in jedem Slot. Eine x4-Karte läuft in einem x4- oder größeren Slot, in einem x1-Slot nur, wenn dieser offen ist, dann aber langsamer. Prüfe vor dem Kauf, welche Slots dein Board hat und ob sie elektrisch ausreichend angebunden sind.","Cartes courantes et leurs besoins :\n• Carte Wi-Fi/Bluetooth : x1\n• Carte son : x1\n• Carte réseau 2,5/10 Gbit : x1 à x4 (le 10 Gbit demande en général du x4)\n• Carte de capture (streaming, enregistrer une console) : x1 à x4\n• Carte SATA/USB supplémentaire : x1 à x4\n• Carte Thunderbolt : x4\n• Carte adaptateur M.2 (pour d'autres SSD) : x4 ; pour 2–4 SSD, x8 ou x16 avec bifurcation\n• seconde carte graphique (par ex. pour l'IA) : x8 à x16\nRègle : une carte x1 fonctionne dans n'importe quel slot. Une carte x4 fonctionne dans un slot x4 ou plus grand ; dans un slot x1, seulement s'il est ouvert, mais plus lentement. Avant l'achat, vérifie les slots de ta carte mère et s'ils sont électriquement raccordés assez largement.")],
[3,"pcie",M("Was bedeutet Bifurcation und Riser?","Que signifient bifurcation et riser ?"),M("Bifurcation bedeutet, dass ein x16-Slot im BIOS in mehrere kleinere Slots aufgeteilt wird, zum Beispiel x8+x8 oder x4+x4+x4+x4. Das braucht man für M.2-Adapterkarten mit mehreren SSDs oder für zwei Grafikkarten. Nicht jedes Board kann das; im BIOS suchst du nach „PCIe Bifurcation“ oder „PCIEX16 Slot Configuration“.\nEin Riser-Kabel verlängert den Slot, damit eine Grafikkarte senkrecht oder an anderer Stelle im Gehäuse sitzen kann. Gute Riser (PCIe 4.0 oder 5.0 geeignet) kosten etwas mehr; ein billiges Kabel kann zu Bildfehlern oder einem Rückfall auf eine niedrigere Version führen.","La bifurcation consiste à diviser un slot x16 en plusieurs slots plus petits dans le BIOS, par exemple x8+x8 ou x4+x4+x4+x4. On en a besoin pour des cartes adaptateurs M.2 avec plusieurs SSD ou pour deux cartes graphiques. Toutes les cartes mères ne le permettent pas ; cherche dans le BIOS « PCIe Bifurcation » ou « PCIEX16 Slot Configuration ».\nUn câble riser prolonge le slot pour qu'une carte graphique soit installée à la verticale ou ailleurs dans le boîtier. Les bons risers (adaptés au PCIe 4.0 ou 5.0) coûtent un peu plus ; un câble bon marché peut causer des artefacts ou un retour à une version inférieure.")],
[2,"pcie",M("Wie sehe ich, womit meine Grafikkarte wirklich läuft?","Comment voir à quelle vitesse tourne vraiment ma carte graphique ?"),M("Du kannst das auf deinem PC nachsehen:\n• Das kostenlose Programm GPU-Z: Im Hauptfenster steht bei „Bus Interface“ zum Beispiel „PCIe x16 4.0 @ x16 4.0“. Klicke daneben auf das Fragezeichen und starte den „Render Test“, weil sich die Grafikkarte im Leerlauf aus Stromspargründen auf 1.1 zurückschaltet.\n• Im BIOS findest du die Einstellung für die PCIe-Version oft unter „Advanced“ oder „Settings“ bei „PCIEX16 Slot“. Dort kannst du „Auto“, „Gen3“, „Gen4“ oder „Gen5“ einstellen. „Auto“ ist normalerweise richtig.\n• Wenn die Karte langsamer läuft als erwartet (z. B. x8 statt x16), sitzt sie oft nicht ganz im Slot, oder ein M.2-Slot teilt sich die Lanes mit dem Grafikslot. Das Handbuch zeigt es.","Tu peux le vérifier sur ton PC :\n• Le programme gratuit GPU-Z : dans la fenêtre principale, « Bus Interface » affiche par exemple « PCIe x16 4.0 @ x16 4.0 ». Clique sur le point d'interrogation à côté et lance le « Render Test », car la carte graphique repasse en 1.1 au repos pour économiser de l'énergie.\n• Dans le BIOS, le réglage de la version PCIe se trouve souvent sous « Advanced » ou « Settings » à « PCIEX16 Slot ». Tu peux y choisir « Auto », « Gen3 », « Gen4 » ou « Gen5 ». « Auto » est normalement le bon choix.\n• Si la carte tourne plus lentement que prévu (par ex. x8 au lieu de x16), elle n'est souvent pas enfoncée jusqu'au bout, ou un slot M.2 partage ses lanes avec le slot graphique. Le manuel l'indique.")],
[3,"pcie",M("Wie bewertet der PCIe-Check meine Konfiguration?","Comment le check évalue-t-il la liaison PCIe ?"),M("Der Check nimmt die kleinste der drei Versionen: Grafikkarte, Mainboard-Chipsatz und CPU. Daraus ergibt sich:\n• x16-Karte: 100 % in 4.0 oder 5.0, bei 3.0 je nach Leistung leicht darunter (bei sehr starken Karten etwa 84 %).\n• x8-Karte: 100 % in 4.0 oder höher, in 3.0 nur noch etwa 55 %, weil dort spürbare Verluste möglich sind.\n• x4-Karte: 85 % in 4.0, in 3.0 nur etwa 35 %.\nDie Werte sind Faustregeln, keine Messungen. Welche Spiele wie stark reagieren, hängt vom Spiel und vom Grafikspeicher ab. Bei 8-GB-Karten wirkt es schlimmer, weil dann öfter Daten über PCIe nachgeladen werden.","Le check retient la plus petite des trois versions : carte graphique, chipset de la carte mère et CPU. Résultat :\n• Carte x16 : 100 % en 4.0 ou 5.0 ; en 3.0, légèrement moins selon la puissance (environ 84 % pour les cartes très puissantes).\n• Carte x8 : 100 % en 4.0 ou plus ; en 3.0, seulement environ 55 %, car des pertes sensibles sont possibles.\n• Carte x4 : 85 % en 4.0 ; en 3.0, seulement environ 35 %.\nCes valeurs sont des repères, pas des mesures. L'effet dépend du jeu et de la mémoire graphique. Avec des cartes de 8 Go, c'est pire, car davantage de données sont rechargées via le PCIe.")],
[1,"board",M("Was ist ein Sockel und warum ist er so wichtig?","Qu'est-ce qu'un socket et pourquoi est-ce si important ?"),M("Der Sockel ist der Steckplatz der CPU auf dem Mainboard. CPU und Board müssen denselben Sockel haben, sonst passt der Prozessor mechanisch nicht. Aktuelle Sockel: AM5 (Ryzen 7000/8000G/9000), AM4 (Ryzen 2000 bis 5000), LGA1851 (Core Ultra 200S), LGA1700 (Core 12.–14. Gen), LGA1200 (Core 10./11. Gen). Zusätzlich bestimmt das Board, ob DDR4 oder DDR5 verbaut wird. Nach dem Sockel richtet sich auch, welche Kühler passen. Im Reiter „Sockel-Guide“ siehst du alle Sockel mit passenden Chipsätzen und Tipps.","Le socket est l'emplacement du CPU sur la carte mère. Le CPU et la carte doivent avoir le même socket, sinon le processeur ne s'adapte pas mécaniquement. Sockets actuels : AM5 (Ryzen 7000/8000G/9000), AM4 (Ryzen 2000 à 5000), LGA1851 (Core Ultra 200S), LGA1700 (Core 12e–14e gén.), LGA1200 (Core 10e/11e gén.). La carte détermine aussi si de la DDR4 ou de la DDR5 est utilisée. Le socket décide aussi des ventirads compatibles. Dans l'onglet « Guide des sockets », tu vois tous les sockets avec chipsets compatibles et conseils.")],
[1,"board",M("Was bedeuten die Buchstaben beim Chipsatz (X, B, A, Z, H)?","Que signifient les lettres du chipset (X, B, A, Z, H) ?"),M("Der Chipsatz bestimmt, wie viele Anschlüsse und Funktionen das Board hat. Faustregel:\n• AMD: X = Oberklasse (viele Lanes, Übertakten, mehr M.2 und USB), B = Mittelklasse (bestes Preis-Leistungs-Verhältnis), A = Einsteiger (wenig Ausstattung).\n• Intel: Z = Oberklasse mit Übertakten, B = Mittelklasse, H = Einsteiger. K-CPUs (Übertakten) brauchen ein Z-Board, um die Möglichkeit zu nutzen.\n• Ein „E“ wie bei X870E oder B650E heißt: PCIe 5.0 auch für die Grafikkarte.\nDie Klasse entscheidet auch über die Spannungsversorgung (VRM). Starke CPUs mit hohem Verbrauch auf einem Einsteiger-Board können überhitzen. Der Punkt „Mainboard-Eignung“ im Check prüft genau das.","Le chipset détermine le nombre de connecteurs et de fonctions de la carte. Règle simple :\n• AMD : X = haut de gamme (beaucoup de lanes, overclocking, plus de M.2 et d'USB), B = milieu de gamme (meilleur rapport qualité/prix), A = entrée de gamme (peu d'équipement).\n• Intel : Z = haut de gamme avec overclocking, B = milieu de gamme, H = entrée de gamme. Les CPU K (overclocking) demandent une carte Z pour en profiter.\n• Un « E » comme dans X870E ou B650E signifie : PCIe 5.0 aussi pour la carte graphique.\nLa gamme décide aussi de l'alimentation (VRM). Des CPU puissants et gourmands sur une carte d'entrée de gamme peuvent surchauffer. Le point « Compatibilité carte mère » du check vérifie exactement cela.")],
[1,"board",M("ATX, mATX oder ITX: welches Format brauche ich?","ATX, mATX ou ITX : quel format ?"),M("Das Format bestimmt die Größe des Boards und die Zahl der Slots:\n• ATX (30,5 × 24,4 cm): Standard, meist 3–5 M.2-Slots und mehrere PCIe-Slots. Passt in Midi-Tower.\n• Micro-ATX (mATX, 24,4 × 24,4 cm): kompakter, meist 1–2 PCIe-Slots, oft günstiger. Passt in kleinere Gehäuse und in ATX-Gehäuse.\n• Mini-ITX (17 × 17 cm): sehr klein, nur ein PCIe-Slot (für die Grafikkarte) und meist 1–2 M.2. Für kleine Gaming-PCs; der Kühler und das Netzteil müssen auch klein genug sein.\n• E-ATX: noch größer, für Enthusiasten-Boards mit extremer Ausstattung.\nWenn du nur eine Grafikkarte und eine SSD hast, reicht mATX völlig. Prüfe vorher, dass dein Gehäuse das Format unterstützt.","Le format détermine la taille de la carte et le nombre de slots :\n• ATX (30,5 × 24,4 cm) : standard, en général 3–5 slots M.2 et plusieurs slots PCIe. Tient dans une tour moyenne.\n• Micro-ATX (mATX, 24,4 × 24,4 cm) : plus compact, en général 1–2 slots PCIe, souvent moins cher. Tient dans de petits boîtiers et dans les boîtiers ATX.\n• Mini-ITX (17 × 17 cm) : très petit, un seul slot PCIe (pour la carte graphique) et en général 1–2 M.2. Pour les petits PC de jeu ; le ventirad et l'alimentation doivent aussi être assez petits.\n• E-ATX : encore plus grand, pour des cartes enthousiastes très équipées.\nSi tu n'as qu'une carte graphique et un SSD, le mATX suffit largement. Vérifie avant que ton boîtier prend en charge le format.")],
[2,"os",M("Was ist ein BIOS-Update und brauche ich es?","Qu'est-ce qu'une mise à jour du BIOS et en ai-je besoin ?"),M("Das BIOS (UEFI) ist die Firmware des Mainboards. Manche Boards erkennen neue CPUs erst nach einem Update, zum Beispiel:\n• Ryzen 9000 auf älteren B650-/X670-Boards\n• Ryzen 5000 auf B450-/A520-Boards\n• Intel 13./14. Gen auf Z690-/B660-/H610-Boards\nViele neue Boards haben „BIOS Flashback“: Du kopierst die BIOS-Datei auf einen USB-Stick (FAT32) und drückst am Board eine kleine Taste, ganz ohne eingebaute CPU. Das Update findest du auf der Webseite des Herstellers beim Board-Modell unter „Support“ oder „Download“. Bei Intel 13./14. Gen ist ein BIOS mit aktuellem Mikrocode (0x12B oder neuer) wichtig, sonst drohen Stabilitätsprobleme. Der Check zeigt dir einen Hinweis, wenn das nötig sein kann.","Le BIOS (UEFI) est le firmware de la carte mère. Certaines cartes ne reconnaissent de nouveaux CPU qu'après une mise à jour, par exemple :\n• Ryzen 9000 sur d'anciennes cartes B650/X670\n• Ryzen 5000 sur cartes B450/A520\n• Intel 13e/14e gén. sur cartes Z690/B660/H610\nBeaucoup de cartes récentes ont le « BIOS Flashback » : tu copies le fichier BIOS sur une clé USB (FAT32) et appuies sur un petit bouton de la carte, sans CPU installé. La mise à jour se trouve sur le site du fabricant, à la page du modèle de carte, sous « Support » ou « Téléchargements ». Pour les Intel 13e/14e gén., un BIOS avec un microcode récent (0x12B ou plus) est important, sinon des instabilités sont possibles. Le check affiche une remarque quand c'est probablement nécessaire.")],
[1,"ram",M("DDR4 oder DDR5?","DDR4 ou DDR5 ?"),M("Das hängt vom Mainboard ab, nicht vom Wunsch: AM4 und LGA1200 nutzen nur DDR4, AM5 und LGA1851 nur DDR5. Bei LGA1700 gibt es beide Boardvarianten, Modelle mit „D4“ oder „DDR4“ im Namen haben DDR4-Slots. Beides ist nicht tauschbar: Die Kerbe im Modul sitzt an anderer Stelle. Für neue Systeme lohnt DDR5 (bei AMD ist 6000 MT/s mit CL30 der Sweet Spot). Wenn du schon DDR4 besitzt, kannst du auf AM4 oder LGA1700-D4 weiterhin sinnvoll aufrüsten.","Cela dépend de la carte mère, pas de l'envie : l'AM4 et le LGA1200 n'utilisent que de la DDR4, l'AM5 et le LGA1851 que de la DDR5. Le LGA1700 existe dans les deux variantes ; les modèles avec « D4 » ou « DDR4 » dans le nom ont des slots DDR4. Les deux ne sont pas interchangeables : l'encoche du module est à un autre endroit. Pour un nouveau système, la DDR5 vaut la peine (chez AMD, 6000 MT/s en CL30 est le bon compromis). Si tu as déjà de la DDR4, tu peux encore évoluer intelligemment sur AM4 ou LGA1700-D4.")],
[1,"ram",M("Wie viel RAM brauche ich, und was ist Dual-Channel?","De combien de RAM ai-je besoin, et qu'est-ce que le dual-channel ?"),M("Richtwerte:\n• 16 GB: Büro, Internet, einfaches Gaming\n• 32 GB: aktuelle Spiele, Streaming nebenbei, die Empfehlung für die meisten\n• 64 GB: Videoschnitt, 3D, virtuelle Maschinen, viele Programme gleichzeitig\n• 96–128 GB und mehr: große Projekte, KI, Profi-Arbeit\nDual-Channel heißt: zwei Module gleichzeitig nutzen. Das verdoppelt die Speicherbandbreite und macht Spiele schneller. Darum lieber 2 × 16 GB als 1 × 32 GB. Vier Module (4 × 16 GB) bremsen den Takt, vor allem bei DDR5; zwei große Module sind besser als vier kleine.","Repères :\n• 16 Go : bureautique, internet, jeu simple\n• 32 Go : jeux actuels, streaming en parallèle, la recommandation pour la plupart\n• 64 Go : montage vidéo, 3D, machines virtuelles, beaucoup de programmes à la fois\n• 96–128 Go et plus : gros projets, IA, travail professionnel\nDual-channel signifie : utiliser deux modules en même temps. Cela double la bande passante mémoire et accélère les jeux. Mieux vaut donc 2 × 16 Go qu'1 × 32 Go. Quatre modules (4 × 16 Go) font baisser la fréquence, surtout en DDR5 ; deux gros modules valent mieux que quatre petits.")],
[2,"ram",M("XMP oder EXPO, und was heißt das?","XMP ou EXPO, que veut dire cela ?"),M("Das sind Speicherprofile, die du im BIOS einschaltest, damit der RAM mit der aufgedruckten Geschwindigkeit läuft. Ohne Profil läuft er viel langsamer (DDR5 oft nur mit 4800 MT/s). EXPO ist die AMD-Variante, XMP die von Intel. Kits mit beiden Profilen laufen überall. Ein falsches Profil klappt oft trotzdem, du musst die Werte dann aber manchmal von Hand eintragen. So schaltest du es ein: BIOS öffnen (beim Start Entf oder F2 drücken), „AI Tweaker“/„OC“/„Memory“ suchen und „XMP“ oder „EXPO“ auf „Profil 1“ stellen, speichern und neu starten.","Ce sont des profils mémoire que tu actives dans le BIOS pour que la RAM tourne à la vitesse indiquée. Sans profil, elle est bien plus lente (la DDR5 souvent seulement à 4800 MT/s). EXPO est la variante AMD, XMP celle d'Intel. Les kits avec les deux profils fonctionnent partout. Un mauvais profil marche souvent quand même, mais il faut parfois entrer les valeurs à la main. Pour l'activer : ouvrir le BIOS (appuyer sur Suppr ou F2 au démarrage), chercher « AI Tweaker »/« OC »/« Memory », régler « XMP » ou « EXPO » sur « Profil 1 », enregistrer et redémarrer.")],
[1,"storage",M("SSD-Typen: NVMe, SATA oder Festplatte?","Types de SSD : NVMe, SATA ou disque dur ?"),M("Die Typen im Vergleich:\n• NVMe (M.2, PCIe): 3.500 bis 14.000 MB/s, ideal für Windows, Spiele und Projekte.\n• SATA-SSD: etwa 550 MB/s, für zusätzliche Daten oder ältere PCs; starten Windows aber spürbar langsamer als NVMe.\n• HDD (Festplatte): etwa 100–250 MB/s, nur für Archive und Backups; als Systemlaufwerk macht sie den PC zäh.\nTipps: Für das System eine NVMe mit mindestens 1 TB nehmen. Billige SSDs ohne eigenen Cache (DRAM-less) werden bei großen Dateien deutlich langsamer. Eine zweite Platte für Daten (SATA-SSD oder HDD) ist günstig und sinnvoll.","Comparaison :\n• NVMe (M.2, PCIe) : 3 500 à 14 000 Mo/s, idéal pour Windows, les jeux et les projets.\n• SSD SATA : environ 550 Mo/s, pour des données supplémentaires ou de vieux PC ; Windows démarre sensiblement plus lentement qu'avec un NVMe.\n• HDD (disque dur) : environ 100–250 Mo/s, uniquement pour archives et sauvegardes ; comme disque système, il rend le PC lent.\nConseils : pour le système, prends un NVMe d'au moins 1 To. Les SSD bon marché sans cache DRAM (DRAM-less) ralentissent nettement avec de gros fichiers. Un second disque pour les données (SSD SATA ou HDD) est économique et utile.")],
[1,"cpu",M("Was bedeuten K, F, X3D, X, G und die anderen Buchstaben bei CPUs?","Que signifient K, F, X3D, X, G et les autres lettres des CPU ?"),M("Hinter dem Namen stehen Kürzel:\n• Intel K: freigeschaltet zum Übertakten (braucht Z-Board, kein Kühler im Karton). KF: wie K, aber ohne eingebaute Grafik.\n• Intel F: keine integrierte Grafik, also immer eine Grafikkarte nötig. Ohne F ist ein Bild über die Mainboard-Anschlüsse möglich.\n• Intel T: sparsam, wenig Verbrauch; Intel „Core Ultra“ ist die neueste Generation (Sockel LGA1851).\n• AMD X: höherer Takt und Verbrauch; X3D: zusätzlicher 3D-Cache, die besten Spiele-CPUs.\n• AMD G: mit starker integrierter Grafik (APU), gut für PCs ohne Grafikkarte; GT/G-Modelle haben oft weniger PCIe-Lanes.\n• AMD F (z. B. 7500F, 8400F): ohne integrierte Grafik.\nIn der Datenbank stehen die Modelle ohne diese Zeichen für die Variante mit „(F)“, wenn beides existiert.","Les suffixes après le nom signifient :\n• Intel K : débloqué pour l'overclocking (demande une carte Z, pas de ventirad dans la boîte). KF : comme K, mais sans graphique intégré.\n• Intel F : pas de graphique intégré, donc une carte graphique est toujours nécessaire. Sans F, une image est possible via les ports de la carte mère.\n• Intel T : économe, faible consommation ; « Core Ultra » est la génération la plus récente (socket LGA1851).\n• AMD X : fréquence et consommation plus élevées ; X3D : cache 3D supplémentaire, les meilleurs CPU pour le jeu.\n• AMD G : avec un graphique intégré puissant (APU), bien pour les PC sans carte graphique ; les modèles G/GT ont souvent moins de lanes PCIe.\n• AMD F (par ex. 7500F, 8400F) : sans graphique intégré.\nDans la base, les modèles sans ces signes correspondent à la variante « (F) » quand les deux existent.")],
[2,"cpu",M("Was ist ein Bottleneck (Flaschenhals)?","Qu'est-ce qu'un goulot d'étranglement (bottleneck) ?"),M("Wenn eine schwache CPU die Grafikkarte ausbremst, bleibt Leistung ungenutzt. Je höher die Auflösung, desto weniger fällt das auf, weil dann die Grafikkarte der Engpass ist. Der Balken „CPU ↔ GPU Balance“ rechnet das aus der Leistungszahl beider Teile und deiner Auflösung. Das gilt auch umgekehrt: Eine sehr starke CPU mit einer schwachen Grafikkarte ist verschenktes Geld. Das ist eine Faustregel, kein Messwert: Spiele verhalten sich unterschiedlich. In der Engpass-Matrix siehst du das für viele Paare auf einen Blick.","Quand un CPU trop faible freine la carte graphique, de la puissance reste inutilisée. Plus la résolution est élevée, moins cela se voit, car c'est alors la carte graphique qui limite. La barre « Équilibre CPU ↔ GPU » le calcule à partir de la puissance des deux composants et de ta résolution. L'inverse vaut aussi : un CPU très puissant avec une carte graphique faible, c'est de l'argent gaspillé. C'est une règle empirique, pas une mesure : les jeux réagissent différemment. Dans la matrice des goulots, tu vois cela pour de nombreuses paires d'un coup d'œil.")],
[2,"cpu",M("Was bringen X3D-Prozessoren?","Qu'apportent les processeurs X3D ?"),M("AMDs X3D-CPUs haben zusätzlichen Cache direkt auf dem Chip und sind in Spielen oft die schnellsten. Für Videoschnitt oder 3D-Rendern zählen eher viele Kerne, dort sind Ryzen 9 ohne X3D oder Core Ultra 9 stark. Deshalb ändert der Check die Bewertung, wenn du „Videoschnitt & 3D“ wählst. Beispiel: Ein Ryzen 7 9800X3D ist die Spiele-CPU Nr. 1, aber ein Ryzen 9 9950X ist beim Rendern deutlich schneller.","Les CPU X3D d'AMD ont du cache supplémentaire directement sur la puce et sont souvent les plus rapides en jeu. Pour le montage vidéo ou le rendu 3D, ce sont plutôt de nombreux cœurs qui comptent ; les Ryzen 9 sans X3D ou Core Ultra 9 y sont forts. C'est pourquoi le check change l'évaluation quand tu choisis « Montage vidéo & 3D ». Exemple : un Ryzen 7 9800X3D est le CPU de jeu n° 1, mais un Ryzen 9 9950X est nettement plus rapide en rendu.")],
[2,"gpu",M("Wie viel Grafikspeicher (VRAM) brauche ich?","De combien de mémoire graphique (VRAM) ai-je besoin ?"),M("Richtwerte für aktuelle Spiele bei hohen Details:\n• 1080p: 8 GB reichen meist, 12 GB sind ruhiger.\n• 1440p: 12 GB sind ein guter Wert, 16 GB sicherer.\n• 4K: mindestens 16 GB.\n• Videoschnitt, 3D und KI: Mehr ist besser (16–24 GB).\nWenn der Grafikspeicher knapp wird, ruckeln Spiele oder Texturen werden unscharf, obwohl die Grafikkarte sonst stark wäre. Das ist ein häufiger Grund, warum eine 8-GB-Karte schneller altert als eine 16-GB-Karte. Bei Karten mit nur x8-Lanes und 8 GB (RTX 5060 Ti 8 GB, RX 9060 XT 8 GB) wirkt es besonders stark in einem PCIe-3.0-Slot.","Repères pour les jeux actuels en détails élevés :\n• 1080p : 8 Go suffisent le plus souvent, 12 Go sont plus sereins.\n• 1440p : 12 Go est une bonne valeur, 16 Go plus sûr.\n• 4K : au moins 16 Go.\n• Montage vidéo, 3D et IA : plus c'est mieux (16–24 Go).\nQuand la mémoire graphique devient juste, les jeux saccadent ou les textures deviennent floues, même si la carte est par ailleurs puissante. C'est une raison fréquente pour laquelle une carte de 8 Go vieillit plus vite qu'une carte de 16 Go. Pour les cartes à seulement x8 lanes et 8 Go (RTX 5060 Ti 8 Go, RX 9060 XT 8 Go), l'effet est particulièrement marqué dans un slot PCIe 3.0.")],
[1,"gpu",M("NVIDIA, AMD oder Intel Arc?","NVIDIA, AMD ou Intel Arc ?"),M("NVIDIA ist stark bei Raytracing, DLSS (Bildverbesserung) und in Videoprogrammen (CUDA, NVENC). AMD bietet oft mehr VRAM fürs Geld und gute Rasterleistung. Intel Arc ist günstig und wird mit jedem Treiber besser, braucht aber „Resizable BAR“ im BIOS und eine aktuelle Plattform. Wer Adobe Premiere oder DaVinci Resolve nutzt, fährt mit NVIDIA meistens am sichersten. Wer vor allem spielt und Wert auf Preis legt, findet bei AMD oft das beste Verhältnis.","NVIDIA est fort en ray tracing, en DLSS (amélioration de l'image) et dans les logiciels vidéo (CUDA, NVENC). AMD offre souvent plus de VRAM pour le prix et de bonnes performances en rastérisation. Intel Arc est abordable et s'améliore à chaque pilote, mais demande le « Resizable BAR » dans le BIOS et une plateforme récente. Pour Adobe Premiere ou DaVinci Resolve, NVIDIA est généralement le choix le plus sûr. Pour jouer surtout et regarder le prix, AMD offre souvent le meilleur rapport.")],
[3,"gpu",M("Was bedeuten die Handheld-Vergleiche (Steam Deck, Legion Go 2)?","Que signifient les comparaisons avec les consoles portables (Steam Deck, Legion Go 2) ?"),M("Die Handhelds sind Referenzgeräte, damit du ein Gefühl für die Stärke deiner Konfiguration bekommst. Steam Deck OLED hat 4 Zen-2-Kerne und eine kleine RDNA-2-Grafik, Lenovo Legion Go 2 einen Ryzen Z2 Extreme (8 Zen-5-Kerne, RDNA 3.5). Beide laufen mit nur 15–30 W. „×3,8“ bedeutet: Dein PC ist in der gewählten Verwendung ungefähr 3,8-mal so stark wie das Steam Deck. Bei „Gaming“ zählt die Grafikkarte stärker als die CPU, bei „Videoschnitt“ zählen Mehrkernleistung und Grafik gleich, bei „Büro“ nur die CPU. Mit „Ziel-Stärke“ stellst du den gewünschten Faktor ein und die App wählt die Teile aus. Die Werte der Handhelds sind Faustwerte, keine Messungen.","Les consoles portables servent de référence pour donner une idée de la puissance de ta configuration. Le Steam Deck OLED a 4 cœurs Zen 2 et un petit graphique RDNA 2, le Lenovo Legion Go 2 un Ryzen Z2 Extreme (8 cœurs Zen 5, RDNA 3.5). Les deux fonctionnent à seulement 15–30 W. « ×3,8 » signifie : ton PC est, pour l'usage choisi, environ 3,8 fois plus puissant que le Steam Deck. En « Jeux », la carte graphique compte plus que le CPU ; en « Montage vidéo », multicœur et graphique comptent à parts égales ; en « Bureautique », seul le CPU compte. Avec « Puissance visée », tu règles le facteur voulu et l'appli choisit les composants. Les valeurs des consoles sont des repères, pas des mesures.")],
[1,"psu",M("Wie viel Watt braucht mein Netzteil?","De combien de watts mon alimentation a-t-elle besoin ?"),M("Addiere die Spitzenleistung von CPU und Grafikkarte, plus etwa 100 W für Mainboard, RAM, SSD und Lüfter, und nimm davon 20 % mehr. Beispiel: 162 W + 360 W + 100 W = 622 W, mal 1,2 = rund 750 W. Wichtiger als die Wattzahl ist ein Markenmodell mit 80+ Gold und genug 8-pin-Anschlüssen. Für RTX 5090 und 4090 sind 1000 W die Untergrenze. Ein zu starkes Netzteil schadet nicht, ein zu schwaches führt zu Abstürzen unter Last. ATX-3.x-Netzteile haben den 12V-2x6-Stecker (früher 12VHPWR) für aktuelle NVIDIA-Karten direkt; sonst brauchst du den Adapter.","Additionne la puissance de pointe du CPU et de la carte graphique, plus environ 100 W pour carte mère, RAM, SSD et ventilateurs, puis ajoute 20 %. Exemple : 162 W + 360 W + 100 W = 622 W, × 1,2 = environ 750 W. Plus important que les watts : un modèle de marque 80+ Gold avec assez de connecteurs 8 broches. Pour les RTX 5090 et 4090, 1000 W est un minimum. Une alimentation trop puissante ne nuit pas, une alimentation trop faible provoque des plantages en charge. Les alimentations ATX 3.x ont directement le connecteur 12V-2x6 (anciennement 12VHPWR) pour les cartes NVIDIA actuelles ; sinon, il faut l'adaptateur.")],
[2,"cool",M("Welcher CPU-Kühler passt?","Quel ventirad CPU convient ?"),M("Drei Dinge zählen:\n• Sockel: Der Kühler braucht die Halterung für deinen Sockel (AM4, AM5, LGA1700, LGA1851, LGA1200). Die meisten Kühler passen auf mehrere; der Check prüft das.\n• Leistung: Die Zahl in Watt ist die Kühlleistung. Sie muss zur CPU passen (starke CPUs wie ein Core i9 oder Ryzen 9 brauchen 240–360-mm-AIO oder große Doppelturm-Luftkühler).\n• Höhe/Platz: Luftkühler haben eine Höhe (z. B. 155 mm) und müssen ins Gehäuse und über den RAM passen. Das prüft der Check nicht, miss selbst.\nBoxed-Kühler (der kleine Kühler im Karton) reicht nur für kleine CPUs bis etwa 65 W. K-CPUs von Intel werden ohne Kühler geliefert.","Trois choses comptent :\n• Socket : le ventirad doit avoir la fixation de ton socket (AM4, AM5, LGA1700, LGA1851, LGA1200). La plupart conviennent à plusieurs ; le check le vérifie.\n• Puissance : le chiffre en watts est la capacité de refroidissement. Elle doit correspondre au CPU (les CPU puissants comme un Core i9 ou Ryzen 9 demandent un AIO 240–360 mm ou un gros ventirad double tour).\n• Hauteur/place : les ventirads à air ont une hauteur (par ex. 155 mm) et doivent tenir dans le boîtier et au-dessus de la RAM. Le check ne le vérifie pas, mesure toi-même.\nLe ventirad boxed (le petit dans la boîte) ne suffit que pour de petits CPU jusqu'à environ 65 W. Les CPU Intel K sont livrés sans ventirad.")],
[2,"case",M("Passt die Grafikkarte ins Gehäuse?","La carte graphique tient-elle dans le boîtier ?"),M("Das prüft der Check nicht, weil die Länge je nach Hersteller und Modell verschieden ist. Miss die maximale Kartenlänge deines Gehäuses und vergleiche sie mit den Angaben des Herstellers zur konkreten Karte. Große Karten brauchen oft drei Slots Platz, und das Netzteil-Kabel (12V-2x6) darf nicht stark geknickt werden: Lass etwa 3–4 cm Platz vor dem Stecker, bevor das Kabel knickt. Prüfe auch die Höhe des CPU-Kühlers und die Länge des Netzteils.","Le check ne le vérifie pas, car la longueur varie selon le fabricant et le modèle. Mesure la longueur maximale de carte de ton boîtier et compare-la aux indications du fabricant pour la carte concernée. Les grosses cartes demandent souvent trois emplacements, et le câble de l'alimentation (12V-2x6) ne doit pas être fortement plié : laisse environ 3–4 cm devant le connecteur avant que le câble ne coude. Vérifie aussi la hauteur du ventirad CPU et la longueur de l'alimentation.")],
[1,"build",M("Wie kombiniere ich Teile am sichersten?","Comment associer les composants en toute sécurité ?"),M("In dieser Reihenfolge:\n1. Verwendung und Auflösung festlegen.\n2. Grafikkarte wählen, sie bestimmt am meisten.\n3. Passende CPU dazu, sodass die Balance im grünen Bereich ist.\n4. Mainboard mit dem richtigen Sockel und RAM-Typ; bei x8-Karten mindestens PCIe 4.0.\n5. RAM, SSD, dann Netzteil und Kühler nach der berechneten Leistung.\n6. Zum Schluss Gehäuse (Länge, Höhe, Format) und BIOS-Hinweise prüfen.\nKlicke in der Liste auf die Beispiele, um zu sehen, wie grüne Kombinationen aussehen. Oder nutze „Ziel-Stärke“, wenn du nur ein Ziel kennst: Die App stellt dann alles zusammen. Danach kannst du jedes Teil frei ändern.","Dans cet ordre :\n1. Définir l'usage et la résolution.\n2. Choisir la carte graphique, c'est elle qui compte le plus.\n3. Un CPU adapté, pour que l'équilibre soit dans le vert.\n4. Une carte mère avec le bon socket et le bon type de RAM ; pour les cartes x8, au moins PCIe 4.0.\n5. RAM, SSD, puis alimentation et ventirad selon la puissance calculée.\n6. Pour finir, vérifier le boîtier (longueur, hauteur, format) et les remarques BIOS.\nClique sur les exemples dans la liste pour voir à quoi ressemblent des combinaisons vertes. Ou utilise « Puissance visée » si tu ne connais qu'un objectif : l'appli assemble tout. Ensuite, tu peux modifier chaque composant librement.")],
[1,"monitor",M("Welche Monitor-Typen gibt es? IPS, VA, TN, OLED, Mini-LED","Quels types d'écran existe-t-il ? IPS, VA, TN, OLED, Mini-LED"),M("Der Typ des Panels (der Bildschirm-Technik) bestimmt Bildqualität und Preis:\n• IPS: gute Farben, sehr stabile Blickwinkel, der beste Allrounder. Schwarz wirkt eher grau.\n• VA: tiefes Schwarz und hoher Kontrast, günstig. Dunkle Szenen können Schlieren zeigen, Blickwinkel schwächer.\n• TN: sehr schnell und günstig, aber schwache Farben und schlechte Blickwinkel. Heute fast nur noch bei Esport-Monitoren.\n• OLED / QD-OLED: jedes Pixel leuchtet selbst, Schwarz ist wirklich schwarz, extrem schnelle Reaktion, super HDR. Dafür Einbrenn-Risiko und höherer Preis.\n• Mini-LED: ein LCD mit sehr vielen Dimmzonen, sehr hell und gutes HDR, kein Einbrennen, aber leichte Lichthöfe (Halos).\nIm Reiter „Monitor“ siehst du alle Typen im Vergleich und kannst deine Kombination durchrechnen.","Le type de dalle (la technologie de l'écran) détermine la qualité d'image et le prix :\n• IPS : bonnes couleurs, angles de vue très stables, le meilleur polyvalent. Le noir paraît plutôt gris.\n• VA : noir profond et contraste élevé, abordable. Les scènes sombres peuvent montrer des traînées, angles de vue plus faibles.\n• TN : très rapide et bon marché, mais couleurs faibles et mauvais angles de vue. Aujourd'hui presque seulement sur les écrans esport.\n• OLED / QD-OLED : chaque pixel s'éclaire lui-même, le noir est vraiment noir, réponse extrêmement rapide, super HDR. En contrepartie, risque de rémanence et prix plus élevé.\n• Mini-LED : un LCD avec de très nombreuses zones de rétroéclairage, très lumineux et bon HDR, pas de rémanence, mais de légers halos.\nDans l'onglet « Écran », tu vois tous les types comparés et tu peux calculer ta combinaison.")],
[1,"monitor",M("OLED oder nicht OLED? Was du vor dem Kauf wissen musst","OLED ou non OLED ? Ce qu'il faut savoir avant d'acheter"),M("Die Entscheidung hängt davon ab, wie du den Monitor nutzt:\n• OLED ist ideal für Spiele, Filme und HDR in nicht zu hellen Räumen. Der Kontrast ist unschlagbar, die Reaktion fast verzögerungsfrei.\n• Einbrennen: Elemente, die stundenlang an derselben Stelle stehen (Taskleiste, Menüs, Logos), können Spuren hinterlassen. Moderne OLEDs haben Schutzfunktionen, das Risiko ist bei gemischter Nutzung klein, bei reinem Büro-Dauerbetrieb höher.\n• Helligkeit: Bei sehr großen hellen Flächen (weiße Webseite im Vollbild) dimmt OLED, in hellen Räumen kann das stören.\n• Text: Wegen der Pixelanordnung (WRGB oder Dreieck) kann Text je nach Modell leicht gefranst wirken.\n• Preis: höher als IPS bei gleicher Größe, aber sinkend.\nFür Büro, Programmieren und Tabellen den ganzen Tag ist ein guter IPS oder Mini-LED oft die ruhigere Wahl. Für Spiele und Filme ist OLED die Referenz.","La décision dépend de ton usage :\n• L'OLED est idéal pour les jeux, les films et le HDR dans des pièces pas trop lumineuses. Le contraste est imbattable, la réponse quasi instantanée.\n• Rémanence : des éléments restant des heures au même endroit (barre des tâches, menus, logos) peuvent laisser des traces. Les OLED modernes ont des protections ; le risque est faible en usage mixte, plus élevé en bureautique continue.\n• Luminosité : sur de très grandes zones claires (page web blanche en plein écran), l'OLED réduit la luminosité, ce qui peut gêner dans une pièce claire.\n• Texte : à cause de l'agencement des sous-pixels (WRGB ou triangle), le texte peut paraître légèrement frangé selon le modèle.\n• Prix : plus élevé qu'un IPS de même taille, mais en baisse.\nPour la bureautique, la programmation et les tableurs toute la journée, un bon IPS ou Mini-LED est souvent plus serein. Pour les jeux et les films, l'OLED est la référence.")],
[1,"monitor",M("Auflösung und Größe: Full HD, WQHD, 4K und die richtige Kombination","Résolution et taille : Full HD, WQHD, 4K et la bonne combinaison"),M("Die Pixelzahl allein sagt wenig, wichtig ist die Pixeldichte (PPI = Pixel pro Zoll):\n• Full HD (1920 × 1080): gut bis etwa 24 Zoll (92 PPI bei 24″). Auf 27″ wird es grob (82 PPI).\n• WQHD (2560 × 1440): der Sweet Spot für 27 Zoll (109 PPI) und gut für Gaming, weil die Grafikkarte noch gut mitkommt.\n• 4K (3840 × 2160): ideal für 27–32 Zoll (163 bzw. 138 PPI), sehr scharf für Text und Video, aber fordert die Grafikkarte stark.\n• Ultrawide (3440 × 1440 auf 34 Zoll): breit und immersiv, etwa so scharf wie WQHD auf 27 Zoll.\nRichtwerte zum Sitzabstand: Bei 60–80 cm sind 27 Zoll mit WQHD und 32 Zoll mit 4K angenehm. Zu große Monitore in zu kurzem Abstand zwingen dich, den Kopf zu drehen. Probiere die Rechnung im Reiter „Monitor“ aus.","Le nombre de pixels ne dit pas tout ; ce qui compte, c'est la densité de pixels (PPI = pixels par pouce) :\n• Full HD (1920 × 1080) : bien jusqu'à environ 24 pouces (92 PPI en 24″). En 27″, c'est grossier (82 PPI).\n• WQHD (2560 × 1440) : le bon compromis pour 27 pouces (109 PPI) et pour le jeu, car la carte graphique suit encore bien.\n• 4K (3840 × 2160) : idéal pour 27–32 pouces (163 ou 138 PPI), très net pour le texte et la vidéo, mais très exigeant pour la carte graphique.\n• Ultrawide (3440 × 1440 en 34 pouces) : large et immersif, à peu près aussi net que du WQHD en 27 pouces.\nRepères de distance : à 60–80 cm, 27 pouces en WQHD et 32 pouces en 4K sont agréables. Un écran trop grand à courte distance oblige à tourner la tête. Essaie le calcul dans l'onglet « Écran ».")],
[1,"monitor",M("Hertz (Hz): Was bedeutet die Bildwiederholrate?","Hertz (Hz) : que signifie la fréquence de rafraîchissement ?"),M("Hz gibt an, wie oft pro Sekunde das Bild neu aufgebaut wird. 60 Hz sind Standard für Büro und Video. Höhere Werte machen Bewegungen flüssiger:\n• 75–100 Hz: spürbar flüssiger als 60 Hz, auch fürs Büro angenehm.\n• 144–165 Hz: der beliebte Gaming-Bereich. Der Unterschied zu 60 Hz ist beim Spielen und beim Mausbewegen sofort sichtbar.\n• 240 Hz und mehr: nur in sehr schnellen Spielen (Esport) wirklich nützlich. Du brauchst auch genauso viele FPS.\nWichtig: Der Monitor zeigt nur so viele Bilder, wie die Grafikkarte liefert. Ein 240-Hz-Monitor mit 80 FPS läuft nicht schneller als ein 144-Hz-Monitor mit 80 FPS. Die Rechnung „FPS gegen Hz“ siehst du im Reiter „Monitor“. Windows stellt die Hz oft nicht automatisch richtig ein: Einstellungen > System > Anzeige > Erweiterte Anzeige > Aktualisierungsrate.","Les Hz indiquent combien de fois par seconde l'image est rafraîchie. 60 Hz est le standard pour la bureautique et la vidéo. Des valeurs plus élevées rendent les mouvements plus fluides :\n• 75–100 Hz : nettement plus fluide que 60 Hz, agréable aussi en bureautique.\n• 144–165 Hz : la plage de jeu populaire. La différence avec 60 Hz se voit tout de suite en jouant et en bougeant la souris.\n• 240 Hz et plus : vraiment utile seulement dans des jeux très rapides (esport). Il faut aussi autant de FPS.\nImportant : l'écran n'affiche que le nombre d'images fourni par la carte graphique. Un écran 240 Hz à 80 FPS n'est pas plus rapide qu'un écran 144 Hz à 80 FPS. Le calcul « FPS contre Hz » est dans l'onglet « Écran ». Windows ne règle pas toujours bien les Hz automatiquement : Paramètres > Système > Affichage > Affichage avancé > Fréquence d'actualisation.")],
[2,"monitor",M("G-Sync, FreeSync, VRR und V-Sync: was verhindert Bildreißen?","G-Sync, FreeSync, VRR et V-Sync : qu'est-ce qui évite le déchirement d'image ?"),M("Wenn die Grafikkarte mehr oder weniger FPS liefert, als der Monitor Hz hat, entsteht „Tearing“ (waagerechte Risse im Bild):\n• V-Sync koppelt die Bildausgabe an die Hz. Es verhindert Risse, kann aber Eingabeverzögerung und Ruckeln bringen.\n• VRR (Variable Refresh Rate, auch Adaptive Sync) lässt den Monitor mit den FPS der Grafikkarte mitgehen. Ergebnis: flüssig ohne Risse und fast ohne Verzögerung.\n• FreeSync (AMD) und G-Sync (NVIDIA) sind die Markennamen davon. Fast alle aktuellen Monitore funktionieren mit beiden Karten („G-Sync kompatibel“).\n• Echtes G-Sync-Modul: etwas besser bei sehr niedrigen FPS, aber teurer.\nTipp: VRR einschalten (im Monitor-Menü und im Treiber), V-Sync im Treiber auf „an“ lassen und im Spiel die FPS knapp unter die Hz begrenzen, zum Beispiel 141 FPS bei 144 Hz.","Quand la carte graphique fournit plus ou moins de FPS que l'écran n'a de Hz, il y a du « tearing » (déchirures horizontales dans l'image) :\n• V-Sync lie l'affichage aux Hz. Il évite les déchirures mais peut ajouter de la latence et des saccades.\n• VRR (Variable Refresh Rate, aussi Adaptive Sync) laisse l'écran suivre les FPS de la carte graphique. Résultat : fluide sans déchirures et presque sans latence.\n• FreeSync (AMD) et G-Sync (NVIDIA) sont les noms de marque. Presque tous les écrans actuels fonctionnent avec les deux marques (« G-Sync compatible »).\n• Vrai module G-Sync : un peu meilleur à très bas FPS, mais plus cher.\nConseil : activer le VRR (dans le menu de l'écran et dans le pilote), laisser V-Sync sur « activé » dans le pilote et limiter les FPS juste sous les Hz dans le jeu, par exemple 141 FPS à 144 Hz.")],
[2,"monitor",M("Reaktionszeit, Input Lag und Overdrive","Temps de réponse, input lag et overdrive"),M("Drei Begriffe, die oft verwechselt werden:\n• Reaktionszeit (GtG, Grau-zu-Grau): wie schnell ein Pixel die Farbe wechselt. 1 ms (GtG) ist bei OLED real, bei IPS/VA sind 4–8 ms realistisch, die Werbezahl „1 ms“ gilt nur unter Idealbedingungen.\n• Input Lag: die Verzögerung zwischen Eingabe und Anzeige. Für Spiele wichtiger als GtG, gute Monitore liegen bei wenigen Millisekunden. Im Menü den „Game Mode“ aktivieren.\n• Overdrive: Der Monitor treibt die Pixel stärker an, um schneller zu sein. Zu starker Overdrive erzeugt Schatten und Ringe („Inverse Ghosting“). Die mittlere Stufe ist meist die beste.\nBei schnellen Spielen sind Hz, Overdrive und geringe Latenz zusammen wichtiger als eine einzelne Zahl.","Trois notions souvent confondues :\n• Temps de réponse (GtG, gris à gris) : la vitesse à laquelle un pixel change de couleur. 1 ms (GtG) est réel avec l'OLED ; avec IPS/VA, 4–8 ms est réaliste ; le « 1 ms » publicitaire n'est valable que dans des conditions idéales.\n• Input lag : le délai entre l'action et l'affichage. Plus important que le GtG pour le jeu ; les bons écrans sont à quelques millisecondes. Activer le « Game Mode » dans le menu.\n• Overdrive : l'écran pousse plus fort les pixels pour être plus rapide. Un overdrive trop élevé crée des ombres et des halos (« inverse ghosting »). Le niveau moyen est généralement le meilleur.\nPour les jeux rapides, Hz, overdrive et faible latence ensemble comptent plus qu'un chiffre isolé.")],
