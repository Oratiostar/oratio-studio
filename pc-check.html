.pchk.v-warn .pbar i{background:var(--warn)}.pchk.v-bad .pbar i{background:var(--bad)}
.cm{margin:0;font-size:14px;color:var(--muted)}
.hints{margin:0;padding:0;list-style:none;display:grid;gap:8px}

.hints li.v-warn{background:var(--warn-bg);border-left-color:var(--warn)}
.dbbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.segs{display:flex;gap:4px;flex-wrap:wrap}

.count{font:13px ui-monospace,Consolas,monospace;color:var(--muted);margin-left:auto}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.opc table{border-collapse:collapse;width:100%;font-size:14px}

.opc th{background:var(--soft);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.sorter{all:unset;cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit}
.sorter:focus-visible{outline:3px solid var(--acc)}
.opc tbody tr:last-child td{border-bottom:0}
.opc td{font-variant-numeric:tabular-nums}
.bcw{display:flex;align-items:center;gap:8px;min-width:130px}

.tip{margin:14px 0 0;color:var(--muted);max-width:75ch}
.opc details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 16px;margin-bottom:10px}
.opc summary{cursor:pointer;font-weight:800;font-size:16px;padding:14px 0;list-style:none}
.opc summary::-webkit-details-marker{display:none}

.mx{border-collapse:separate!important;border-spacing:3px;width:auto!important}

.opc .mx th.cor{left:0;z-index:7;min-width:92px;max-width:92px;font-size:11.5px;font-weight:800;line-height:1.25;text-align:center;vertical-align:middle;color:var(--acc);box-shadow:inset 0 -3px 0 var(--acc),inset -3px 0 0 var(--acc)}
.opc .mx th[scope=row]{text-align:right;padding-right:8px!important;padding-left:8px!important;font-size:12.5px;white-space:nowrap;color:var(--fg);position:sticky;left:0;z-index:4;background:var(--card)!important;box-shadow:inset -3px 0 0 var(--line)}

.mc.v-bad{background:var(--badbg);box-shadow:inset 0 0 0 2px var(--bad)}

.mc.cur{outline:3px solid var(--fg);outline-offset:1px;position:relative;z-index:1}

.hhg{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:10px 0 6px}

var FAQ=[
["h",M("PCIe und Lanes verstehen","Comprendre le PCIe et les lanes")],
[M("Was ist PCIe und wofür braucht man es überhaupt?","Qu'est-ce que le PCIe et à quoi sert-il ?"),
M("PCIe (PCI Express) ist die Datenautobahn im PC. Alles, was schnell mit dem Prozessor reden muss, hängt daran:\n• die Grafikkarte (der größte Nutzer)\n• NVMe-SSDs im M.2-Steckplatz\n• Erweiterungskarten wie WLAN-/Netzwerkkarten, Soundkarten, Capture-Karten für Streaming oder SATA-Zusatzcontroller\n• der Chipsatz auf dem Mainboard, der wiederum USB, SATA und LAN verteilt\nOhne PCIe gäbe es keinen schnellen Weg zwischen CPU und diesen Teilen. Wichtig zu wissen: Es kommt nicht nur auf die Version an (3.0, 4.0, 5.0), sondern auch auf die Zahl der Lanes, also wie viele „Fahrspuren“ ein Gerät bekommt.","Le PCIe (PCI Express) est l'autoroute de données du PC. Tout ce qui doit communiquer vite avec le processeur y est relié :\n• la carte graphique (le plus gros utilisateur)\n• les SSD NVMe dans le slot M.2\n• les cartes d'extension : Wi-Fi/réseau, cartes son, cartes de capture pour le streaming, contrôleurs SATA supplémentaires\n• le chipset de la carte mère, qui distribue à son tour l'USB, le SATA et le réseau\nSans PCIe, il n'y aurait pas de voie rapide entre le CPU et ces composants. À retenir : ce n'est pas seulement la version (3.0, 4.0, 5.0) qui compte, mais aussi le nombre de lanes, c'est-à-dire de « voies » attribuées à un appareil.")],
[M("Was sind Lanes (Spuren) und was bedeuten x1, x4, x8, x16?","Que sont les lanes (voies) et que signifient x1, x4, x8, x16 ?"),
M("Eine Lane ist eine Fahrspur aus zwei Leitungspaaren (eine Richtung senden, eine empfangen). Ein Gerät kann mehrere Lanes bündeln:\n• x1 = 1 Lane (kleine Karten: WLAN, Soundkarte, USB-Zusatzkarte)\n• x4 = 4 Lanes (NVMe-SSDs, schnelle Netzwerkkarten, Capture-Karten)\n• x8 = 8 Lanes (kleinere Grafikkarten wie RTX 4060/5060, RX 7600, Server-Karten)\n• x16 = 16 Lanes (normale Grafikkarten)\nDie Geschwindigkeit ist Lanes mal Geschwindigkeit pro Lane. Ein Vergleich: Stell dir eine Autobahn vor. Die PCIe-Version ist das Tempolimit, die Lane-Zahl ist die Anzahl der Spuren. Eine Karte mit x8 auf Version 4.0 ist so schnell wie x16 auf Version 3.0.","Une lane est une voie composée de deux paires de fils (une pour émettre, une pour recevoir). Un appareil peut regrouper plusieurs lanes :\n• x1 = 1 lane (petites cartes : Wi-Fi, carte son, carte USB supplémentaire)\n• x4 = 4 lanes (SSD NVMe, cartes réseau rapides, cartes de capture)\n• x8 = 8 lanes (cartes graphiques plus petites comme RTX 4060/5060, RX 7600, cartes serveur)\n• x16 = 16 lanes (cartes graphiques classiques)\nLa vitesse = nombre de lanes × vitesse par lane. Image : une autoroute. La version PCIe est la limite de vitesse, le nombre de lanes est le nombre de voies. Une carte en x8 sur PCIe 4.0 est aussi rapide qu'en x16 sur PCIe 3.0.")],
[M("Wie schnell ist PCIe 3.0, 4.0, 5.0 und 6.0 wirklich?","Quelle est la vitesse réelle du PCIe 3.0, 4.0, 5.0 et 6.0 ?"),
M("Pro Lane und Richtung grob gerechnet:\n• PCIe 3.0: etwa 1 GB/s pro Lane, also x4 ≈ 4 GB/s und x16 ≈ 16 GB/s\n• PCIe 4.0: etwa 2 GB/s pro Lane, also x4 ≈ 8 GB/s und x16 ≈ 32 GB/s\n• PCIe 5.0: etwa 4 GB/s pro Lane, also x4 ≈ 16 GB/s und x16 ≈ 64 GB/s\n• PCIe 6.0: etwa 8 GB/s pro Lane, bisher nur Server und Rechenzentren\nJede Version verdoppelt die Geschwindigkeit der vorherigen. Alle Versionen sind abwärtskompatibel: Eine 5.0-Karte läuft im 3.0-Slot, nur eben mit der Geschwindigkeit der kleineren Version. Eine aktuelle Grafikkarte schöpft selbst 5.0 x16 in Spielen nicht aus; die Praxisunterschiede zwischen 4.0 und 5.0 sind bei Grafikkarten klein.","Calcul approximatif par lane et par sens :\n• PCIe 3.0 : environ 1 Go/s par lane, donc x4 ≈ 4 Go/s et x16 ≈ 16 Go/s\n• PCIe 4.0 : environ 2 Go/s par lane, donc x4 ≈ 8 Go/s et x16 ≈ 32 Go/s\n• PCIe 5.0 : environ 4 Go/s par lane, donc x4 ≈ 16 Go/s et x16 ≈ 64 Go/s\n• PCIe 6.0 : environ 8 Go/s par lane, pour l'instant uniquement serveurs et centres de données\nChaque version double la vitesse de la précédente. Toutes les versions sont rétrocompatibles : une carte 5.0 fonctionne dans un slot 3.0, mais à la vitesse de la version inférieure. Une carte graphique actuelle n'exploite même pas le 5.0 x16 dans les jeux ; en pratique, la différence entre 4.0 et 5.0 est faible pour les cartes graphiques.")],
[M("Welche Steckplatz-Typen gibt es auf dem Mainboard?","Quels types de slots y a-t-il sur la carte mère ?"),
M("Auf einem Mainboard findest du meist diese Steckplätze:\n• PCIe-x16-Slot: lang, für die Grafikkarte. Der oberste ist meist direkt mit der CPU verbunden.\n• PCIe-x4-/x1-Slots: kürzer, für Zusatzkarten. Eine kleine Karte passt auch in einen längeren Slot.\n• M.2-Slots (Key M): für NVMe-SSDs, meist 2280 (22 mm breit, 80 mm lang). Manche M.2-Slots sind nur PCIe 3.0 oder teilen sich Lanes mit SATA-Ports.\n• SATA-Anschlüsse: für 2,5\"-SSDs und Festplatten, kein PCIe, aber vom Chipsatz abhängig.\nAchtung: Ein Slot kann mechanisch x16 sein, aber elektrisch nur x4 oder x8 angebunden. Das steht im Handbuch („x16 Slot (läuft mit x4)“). Die unteren langen Slots sind sehr oft nur x4.","Sur une carte mère, on trouve généralement :\n• Slot PCIe x16 : long, pour la carte graphique. Le premier est souvent relié directement au CPU.\n• Slots PCIe x4 / x1 : plus courts, pour les cartes d'extension. Une petite carte tient aussi dans un slot plus long.\n• Slots M.2 (clé M) : pour les SSD NVMe, en général 2280 (22 mm de large, 80 mm de long). Certains slots M.2 ne sont qu'en PCIe 3.0 ou partagent leurs lanes avec des ports SATA.\n• Ports SATA : pour les SSD 2,5\" et disques durs ; ce n'est pas du PCIe, mais cela dépend du chipset.\nAttention : un slot peut être mécaniquement x16 mais électriquement raccordé en x4 ou x8 seulement. C'est indiqué dans le manuel (« slot x16 (fonctionne en x4) »). Les slots longs du bas sont très souvent en x4.")],
[M("Woher kommen die Lanes? CPU-Lanes und Chipsatz-Lanes","D'où viennent les lanes ? Lanes du CPU et du chipset"),
M("Lanes sind begrenzt und kommen aus zwei Quellen:\n• CPU-Lanes: direkt am Prozessor, am schnellsten. Ein Ryzen 7000/9000 liefert etwa 24 nutzbare PCIe-5.0-Lanes: 16 für die Grafikkarte, 4 + 4 für zwei M.2-SSDs (und 4 weitere zum Chipsatz). Intel Core 12.–14. Gen liefert 16 Lanes für die Grafikkarte (5.0) plus 4 für eine M.2-SSD (4.0); Core Ultra 200S etwas mehr.\n• Chipsatz-Lanes: der Chipsatz (X870, B650, Z790 …) hängt über einen gemeinsamen Link an der CPU und verteilt weitere Lanes an zusätzliche M.2-Slots, x1-/x4-Slots, SATA, USB und LAN. Alle Geräte am Chipsatz teilen sich diesen einen Link.\nDeshalb sind Edel-Chipsätze (X870E, Z890) besser ausgestattet als Einsteiger-Chipsätze (A620, H610): mehr Lanes, mehr M.2-Slots, höhere PCIe-Version. Die Spalte „GPU-Slot“ und „NVMe“ in der Teile-Datenbank zeigt die Version pro Chipsatz.","Les lanes sont limitées et viennent de deux sources :\n• Lanes du CPU : directement sur le processeur, les plus rapides. Un Ryzen 7000/9000 fournit environ 24 lanes PCIe 5.0 utilisables : 16 pour la carte graphique, 4 + 4 pour deux SSD M.2 (et 4 autres vers le chipset). Les Intel Core 12e–14e gén. offrent 16 lanes pour la carte graphique (5.0) plus 4 pour un SSD M.2 (4.0) ; les Core Ultra 200S un peu plus.\n• Lanes du chipset : le chipset (X870, B650, Z790 …) est relié au CPU par un lien commun et distribue d'autres lanes vers des slots M.2 supplémentaires, slots x1/x4, SATA, USB et réseau. Tous les appareils du chipset se partagent ce lien unique.\nC'est pourquoi les chipsets haut de gamme (X870E, Z890) sont mieux équipés que les chipsets d'entrée de gamme (A620, H610) : plus de lanes, plus de slots M.2, version PCIe plus élevée. Les colonnes « Slot GPU » et « NVMe » de la base de composants indiquent la version par chipset.")],
[M("Was passiert, wenn sich Geräte Lanes teilen?","Que se passe-t-il quand des appareils se partagent des lanes ?"),
M("Das ist ein häufiger Stolperstein bei günstigen Boards:\n• Ein zweiter M.2-Slot kann SATA-Ports abschalten (z. B. „M2_2 teilt sich mit SATA 5/6“). Dann funktionieren die SATA-Laufwerke an diesen Ports nicht mehr.\n• Wenn du einen zweiten Grafik-Slot oder Adapter nutzt, kann der erste Slot von x16 auf x8 zurückfallen.\n• Ein Slot im Chipsatz-Bereich teilt sich die Bandbreite mit USB, SATA und LAN. Für eine SSD oder Capture-Karte ist das meist okay, für mehrere schnelle Geräte gleichzeitig kann es eng werden.\nIm Handbuch des Mainboards gibt es dafür eine Tabelle („Lane Sharing“). Schau dort nach, bevor du alle Slots füllst. Der Check weist nur auf die Zahl der M.2-Slots hin, nicht auf jedes Sharing.","C'est un piège fréquent sur les cartes abordables :\n• Un second slot M.2 peut désactiver des ports SATA (par ex. « M2_2 partage avec SATA 5/6 »). Les disques SATA branchés sur ces ports ne fonctionnent alors plus.\n• Si tu utilises un second slot graphique ou un adaptateur, le premier slot peut passer de x16 à x8.\n• Un slot côté chipset partage sa bande passante avec l'USB, le SATA et le réseau. Pour un SSD ou une carte de capture, c'est en général suffisant ; pour plusieurs appareils rapides en même temps, cela peut devenir juste.\nLe manuel de la carte mère contient un tableau pour cela (« lane sharing »). Consulte-le avant de remplir tous les slots. Le check n'indique que le nombre de slots M.2, pas chaque partage.")],
[M("Grafikkarte mit nur x8 oder x4: ist das schlimm?","Carte graphique en x8 ou x4 : est-ce grave ?"),
M("Es kommt auf Karte und Slot an:\n• x16-Karten (RTX 4070 und größer, RX 7800 XT …): kaum Verlust, auch in einem PCIe-3.0-Slot (meist unter 5 %).\n• x8-Karten (RTX 4060, RTX 5060, RX 7600, RX 9060 XT, Arc B580): in einem 4.0- oder 5.0-Slot völlig in Ordnung. In einem 3.0-Slot (z. B. B450, A520, 10./11. Gen Intel) kann es je nach Spiel einige bis etwa 10–20 % kosten, besonders wenn der Grafikspeicher knapp wird.\n• x4-Karten (RX 6500 XT, RX 6400, Arc A310/A380 mit x8): in 3.0-Slots teils deutlich langsamer (in manchen Spielen 20–30 %).\nMerksregel: Eine x8-/x4-Karte gehört auf ein Board mit PCIe 4.0 oder besser. Bei einer x16-Karte ist die Slot-Version egal. Der Check zeigt dir das im Punkt „PCIe-Anbindung“ mit einem Prozentwert.","Cela dépend de la carte et du slot :\n• Cartes x16 (RTX 4070 et au-dessus, RX 7800 XT …) : très peu de perte, même dans un slot PCIe 3.0 (en général moins de 5 %).\n• Cartes x8 (RTX 4060, RTX 5060, RX 7600, RX 9060 XT, Arc B580) : parfaitement bien dans un slot 4.0 ou 5.0. Dans un slot 3.0 (par ex. B450, A520, Intel 10e/11e gén.), cela peut coûter quelques % à environ 10–20 % selon le jeu, surtout quand la mémoire graphique devient juste.\n• Cartes x4 (RX 6500 XT, RX 6400) : parfois nettement plus lentes dans un slot 3.0 (20–30 % dans certains jeux).\nRègle simple : une carte x8/x4 doit aller sur une carte mère PCIe 4.0 ou mieux. Pour une carte x16, la version du slot importe peu. Le check l'indique au point « Liaison PCIe » avec un pourcentage.")],
[M("NVMe-SSDs und PCIe: was ist M.2, was Gen3/Gen4/Gen5?","SSD NVMe et PCIe : qu'est-ce que le M.2, la Gen3/Gen4/Gen5 ?"),
M("M.2 ist nur die Bauform (ein kleiner Riegel auf dem Board). Entscheidend ist, wie die SSD angeschlossen ist:\n• M.2 NVMe nutzt PCIe x4: Gen3 ≈ 3,5 GB/s, Gen4 ≈ 7 GB/s, Gen5 ≈ 10–14 GB/s.\n• M.2 SATA sieht gleich aus, ist aber nur so schnell wie eine normale SATA-SSD (≈ 0,55 GB/s). Achte beim Kauf auf „NVMe“.\n• Gen5-SSDs werden sehr heiß und brauchen einen Kühlkörper; im Alltag und in Spielen merkst du gegenüber Gen4 fast nichts. Ladezeiten hängen eher von der CPU und vom Spiel ab.\n• Eine Gen4-SSD im Gen3-Slot läuft mit etwa 3,5 GB/s, eine Gen5-SSD im Gen4-Slot mit etwa 7 GB/s: kein Problem, nur nicht ausgereizt.\nFür die meisten Menschen ist eine gute Gen4-SSD mit 1–2 TB die beste Wahl. Der Check bewertet nur, ob das Board die SSD ausreizen kann.","Le M.2 n'est que le format (une petite barrette sur la carte). Ce qui compte, c'est le mode de raccordement :\n• Le M.2 NVMe utilise du PCIe x4 : Gen3 ≈ 3,5 Go/s, Gen4 ≈ 7 Go/s, Gen5 ≈ 10–14 Go/s.\n• Le M.2 SATA a la même apparence, mais n'est aussi rapide qu'un SSD SATA normal (≈ 0,55 Go/s). À l'achat, vérifie la mention « NVMe ».\n• Les SSD Gen5 chauffent beaucoup et demandent un dissipateur ; au quotidien et dans les jeux, tu ne vois presque pas de différence avec la Gen4. Les temps de chargement dépendent plutôt du CPU et du jeu.\n• Un SSD Gen4 dans un slot Gen3 tourne à environ 3,5 Go/s, un SSD Gen5 dans un slot Gen4 à environ 7 Go/s : aucun souci, simplement pas exploité à fond.\nPour la plupart des gens, un bon SSD Gen4 de 1–2 To est le meilleur choix. Le check évalue seulement si la carte mère exploite le SSD.")],
[M("Muss ich PCIe 5.0 haben oder reicht 4.0?","Faut-il du PCIe 5.0 ou le 4.0 suffit-il ?"),
M("Für die meisten reicht 4.0 völlig:\n• Grafikkarte: Selbst eine RTX 5090 verliert in 4.0 x16 nur wenige Prozent. Ein 5.0-Slot lohnt sich also nicht extra für die Grafikkarte.\n• SSD: Gen5-SSDs sind im Alltag kaum spürbar schneller. Sinnvoll sind sie bei sehr großen Dateien (Videoschnitt mit 8K-Material, Datenbanken).\n• Zukunft: Neue Boards (X870, B850, Z890) haben 5.0 meist ohnehin. Wenn du ein Board mit 5.0 für die Grafikkarte günstig bekommst, ist das gut, mehr nicht.\nGeld lieber in eine stärkere Grafikkarte oder mehr RAM stecken. Ausnahme: Kauf einer x8-Karte, dann auf mindestens 4.0 achten (siehe oben).","Pour la plupart des gens, le 4.0 suffit largement :\n• Carte graphique : même une RTX 5090 ne perd que quelques % en 4.0 x16. Un slot 5.0 ne vaut donc pas un surcoût pour la carte graphique.\n• SSD : les SSD Gen5 sont à peine plus rapides au quotidien. Ils ont un intérêt pour de très gros fichiers (montage vidéo en 8K, bases de données).\n• Avenir : les cartes récentes (X870, B850, Z890) ont de toute façon généralement le 5.0. Si tu en obtiens une avec 5.0 pour la carte graphique à bon prix, c'est bien, sans plus.\nMets plutôt l'argent dans une carte graphique plus puissante ou plus de RAM. Exception : si tu achètes une carte x8, vise au moins le 4.0 (voir plus haut).")],
[M("Welche Erweiterungskarten brauchen PCIe und welche Lanes?","Quelles cartes d'extension demandent du PCIe et combien de lanes ?"),
M("Typische Karten und ihr Bedarf:\n• WLAN-/Bluetooth-Karte: x1\n• Soundkarte: x1\n• 2,5-/10-Gbit-Netzwerkkarte: x1 bis x4 (10 Gbit braucht meist x4)\n• Capture-Karte (Streaming, Konsole aufnehmen): x1 bis x4\n• SATA-/USB-Zusatzkarte: x1 bis x4\n• Thunderbolt-Karte: x4\n• M.2-Adapterkarte (für weitere SSDs): x4, für 2–4 SSDs x8 oder x16 mit Bifurcation\n• zweite Grafikkarte (z. B. für KI): x8 bis x16\nRegel: Eine x1-Karte funktioniert in jedem Slot. Eine x4-Karte läuft in einem x4- oder größeren Slot, in einem x1-Slot nur, wenn dieser offen ist, dann aber langsamer. Prüfe vor dem Kauf, welche Slots dein Board hat und ob sie elektrisch ausreichend angebunden sind.","Cartes courantes et leurs besoins :\n• Carte Wi-Fi/Bluetooth : x1\n• Carte son : x1\n• Carte réseau 2,5/10 Gbit : x1 à x4 (le 10 Gbit demande en général du x4)\n• Carte de capture (streaming, enregistrer une console) : x1 à x4\n• Carte SATA/USB supplémentaire : x1 à x4\n• Carte Thunderbolt : x4\n• Carte adaptateur M.2 (pour d'autres SSD) : x4 ; pour 2–4 SSD, x8 ou x16 avec bifurcation\n• seconde carte graphique (par ex. pour l'IA) : x8 à x16\nRègle : une carte x1 fonctionne dans n'importe quel slot. Une carte x4 fonctionne dans un slot x4 ou plus grand ; dans un slot x1, seulement s'il est ouvert, mais plus lentement. Avant l'achat, vérifie les slots de ta carte mère et s'ils sont électriquement raccordés assez largement.")],
[M("Was bedeutet Bifurcation und Riser?","Que signifient bifurcation et riser ?"),
M("Bifurcation bedeutet, dass ein x16-Slot im BIOS in mehrere kleinere Slots aufgeteilt wird, zum Beispiel x8+x8 oder x4+x4+x4+x4. Das braucht man für M.2-Adapterkarten mit mehreren SSDs oder für zwei Grafikkarten. Nicht jedes Board kann das; im BIOS suchst du nach „PCIe Bifurcation“ oder „PCIEX16 Slot Configuration“.\nEin Riser-Kabel verlängert den Slot, damit eine Grafikkarte senkrecht oder an anderer Stelle im Gehäuse sitzen kann. Gute Riser (PCIe 4.0 oder 5.0 geeignet) kosten etwas mehr; ein billiges Kabel kann zu Bildfehlern oder einem Rückfall auf eine niedrigere Version führen.","La bifurcation consiste à diviser un slot x16 en plusieurs slots plus petits dans le BIOS, par exemple x8+x8 ou x4+x4+x4+x4. On en a besoin pour des cartes adaptateurs M.2 avec plusieurs SSD ou pour deux cartes graphiques. Toutes les cartes mères ne le permettent pas ; cherche dans le BIOS « PCIe Bifurcation » ou « PCIEX16 Slot Configuration ».\nUn câble riser prolonge le slot pour qu'une carte graphique soit installée à la verticale ou ailleurs dans le boîtier. Les bons risers (adaptés au PCIe 4.0 ou 5.0) coûtent un peu plus ; un câble bon marché peut causer des artefacts ou un retour à une version inférieure.")],
[M("Wie sehe ich, womit meine Grafikkarte wirklich läuft?","Comment voir à quelle vitesse tourne vraiment ma carte graphique ?"),
M("Du kannst das auf deinem PC nachsehen:\n• Das kostenlose Programm GPU-Z: Im Hauptfenster steht bei „Bus Interface“ zum Beispiel „PCIe x16 4.0 @ x16 4.0“. Klicke daneben auf das Fragezeichen und starte den „Render Test“, weil sich die Grafikkarte im Leerlauf aus Stromspargründen auf 1.1 zurückschaltet.\n• Im BIOS findest du die Einstellung für die PCIe-Version oft unter „Advanced“ oder „Settings“ bei „PCIEX16 Slot“. Dort kannst du „Auto“, „Gen3“, „Gen4“ oder „Gen5“ einstellen. „Auto“ ist normalerweise richtig.\n• Wenn die Karte langsamer läuft als erwartet (z. B. x8 statt x16), sitzt sie oft nicht ganz im Slot, oder ein M.2-Slot teilt sich die Lanes mit dem Grafikslot. Das Handbuch zeigt es.","Tu peux le vérifier sur ton PC :\n• Le programme gratuit GPU-Z : dans la fenêtre principale, « Bus Interface » affiche par exemple « PCIe x16 4.0 @ x16 4.0 ». Clique sur le point d'interrogation à côté et lance le « Render Test », car la carte graphique repasse en 1.1 au repos pour économiser de l'énergie.\n• Dans le BIOS, le réglage de la version PCIe se trouve souvent sous « Advanced » ou « Settings » à « PCIEX16 Slot ». Tu peux y choisir « Auto », « Gen3 », « Gen4 » ou « Gen5 ». « Auto » est normalement le bon choix.\n• Si la carte tourne plus lentement que prévu (par ex. x8 au lieu de x16), elle n'est souvent pas enfoncée jusqu'au bout, ou un slot M.2 partage ses lanes avec le slot graphique. Le manuel l'indique.")],
[M("Wie bewertet der PCIe-Check meine Konfiguration?","Comment le check évalue-t-il la liaison PCIe ?"),
M("Der Check nimmt die kleinste der drei Versionen: Grafikkarte, Mainboard-Chipsatz und CPU. Daraus ergibt sich:\n• x16-Karte: 100 % in 4.0 oder 5.0, bei 3.0 je nach Leistung leicht darunter (bei sehr starken Karten etwa 84 %).\n• x8-Karte: 100 % in 4.0 oder höher, in 3.0 nur noch etwa 55 %, weil dort spürbare Verluste möglich sind.\n• x4-Karte: 85 % in 4.0, in 3.0 nur etwa 35 %.\nDie Werte sind Faustregeln, keine Messungen. Welche Spiele wie stark reagieren, hängt vom Spiel und vom Grafikspeicher ab. Bei 8-GB-Karten wirkt es schlimmer, weil dann öfter Daten über PCIe nachgeladen werden.","Le check retient la plus petite des trois versions : carte graphique, chipset de la carte mère et CPU. Résultat :\n• Carte x16 : 100 % en 4.0 ou 5.0 ; en 3.0, légèrement moins selon la puissance (environ 84 % pour les cartes très puissantes).\n• Carte x8 : 100 % en 4.0 ou plus ; en 3.0, seulement environ 55 %, car des pertes sensibles sont possibles.\n• Carte x4 : 85 % en 4.0 ; en 3.0, seulement environ 35 %.\nCes valeurs sont des repères, pas des mesures. L'effet dépend du jeu et de la mémoire graphique. Avec des cartes de 8 Go, c'est pire, car davantage de données sont rechargées via le PCIe.")],
["h",M("Mainboard, Chipsatz und Sockel","Carte mère, chipset et socket")],
[M("Was ist ein Sockel und warum ist er so wichtig?","Qu'est-ce qu'un socket et pourquoi est-ce si important ?"),
M("Der Sockel ist der Steckplatz der CPU auf dem Mainboard. CPU und Board müssen denselben Sockel haben, sonst passt der Prozessor mechanisch nicht. Aktuelle Sockel: AM5 (Ryzen 7000/8000G/9000), AM4 (Ryzen 2000 bis 5000), LGA1851 (Core Ultra 200S), LGA1700 (Core 12.–14. Gen), LGA1200 (Core 10./11. Gen). Zusätzlich bestimmt das Board, ob DDR4 oder DDR5 verbaut wird. Nach dem Sockel richtet sich auch, welche Kühler passen. Im Reiter „Sockel-Guide“ siehst du alle Sockel mit passenden Chipsätzen und Tipps.","Le socket est l'emplacement du CPU sur la carte mère. Le CPU et la carte doivent avoir le même socket, sinon le processeur ne s'adapte pas mécaniquement. Sockets actuels : AM5 (Ryzen 7000/8000G/9000), AM4 (Ryzen 2000 à 5000), LGA1851 (Core Ultra 200S), LGA1700 (Core 12e–14e gén.), LGA1200 (Core 10e/11e gén.). La carte détermine aussi si de la DDR4 ou de la DDR5 est utilisée. Le socket décide aussi des ventirads compatibles. Dans l'onglet « Guide des sockets », tu vois tous les sockets avec chipsets compatibles et conseils.")],
[M("Was bedeuten die Buchstaben beim Chipsatz (X, B, A, Z, H)?","Que signifient les lettres du chipset (X, B, A, Z, H) ?"),
M("Der Chipsatz bestimmt, wie viele Anschlüsse und Funktionen das Board hat. Faustregel:\n• AMD: X = Oberklasse (viele Lanes, Übertakten, mehr M.2 und USB), B = Mittelklasse (bestes Preis-Leistungs-Verhältnis), A = Einsteiger (wenig Ausstattung).\n• Intel: Z = Oberklasse mit Übertakten, B = Mittelklasse, H = Einsteiger. K-CPUs (Übertakten) brauchen ein Z-Board, um die Möglichkeit zu nutzen.\n• Ein „E“ wie bei X870E oder B650E heißt: PCIe 5.0 auch für die Grafikkarte.\nDie Klasse entscheidet auch über die Spannungsversorgung (VRM). Starke CPUs mit hohem Verbrauch auf einem Einsteiger-Board können überhitzen. Der Punkt „Mainboard-Eignung“ im Check prüft genau das.","Le chipset détermine le nombre de connecteurs et de fonctions de la carte. Règle simple :\n• AMD : X = haut de gamme (beaucoup de lanes, overclocking, plus de M.2 et d'USB), B = milieu de gamme (meilleur rapport qualité/prix), A = entrée de gamme (peu d'équipement).\n• Intel : Z = haut de gamme avec overclocking, B = milieu de gamme, H = entrée de gamme. Les CPU K (overclocking) demandent une carte Z pour en profiter.\n• Un « E » comme dans X870E ou B650E signifie : PCIe 5.0 aussi pour la carte graphique.\nLa gamme décide aussi de l'alimentation (VRM). Des CPU puissants et gourmands sur une carte d'entrée de gamme peuvent surchauffer. Le point « Compatibilité carte mère » du check vérifie exactement cela.")],
[M("ATX, mATX oder ITX: welches Format brauche ich?","ATX, mATX ou ITX : quel format ?"),
M("Das Format bestimmt die Größe des Boards und die Zahl der Slots:\n• ATX (30,5 × 24,4 cm): Standard, meist 3–5 M.2-Slots und mehrere PCIe-Slots. Passt in Midi-Tower.\n• Micro-ATX (mATX, 24,4 × 24,4 cm): kompakter, meist 1–2 PCIe-Slots, oft günstiger. Passt in kleinere Gehäuse und in ATX-Gehäuse.\n• Mini-ITX (17 × 17 cm): sehr klein, nur ein PCIe-Slot (für die Grafikkarte) und meist 1–2 M.2. Für kleine Gaming-PCs; der Kühler und das Netzteil müssen auch klein genug sein.\n• E-ATX: noch größer, für Enthusiasten-Boards mit extremer Ausstattung.\nWenn du nur eine Grafikkarte und eine SSD hast, reicht mATX völlig. Prüfe vorher, dass dein Gehäuse das Format unterstützt.","Le format détermine la taille de la carte et le nombre de slots :\n• ATX (30,5 × 24,4 cm) : standard, en général 3–5 slots M.2 et plusieurs slots PCIe. Tient dans une tour moyenne.\n• Micro-ATX (mATX, 24,4 × 24,4 cm) : plus compact, en général 1–2 slots PCIe, souvent moins cher. Tient dans de petits boîtiers et dans les boîtiers ATX.\n• Mini-ITX (17 × 17 cm) : très petit, un seul slot PCIe (pour la carte graphique) et en général 1–2 M.2. Pour les petits PC de jeu ; le ventirad et l'alimentation doivent aussi être assez petits.\n• E-ATX : encore plus grand, pour des cartes enthousiastes très équipées.\nSi tu n'as qu'une carte graphique et un SSD, le mATX suffit largement. Vérifie avant que ton boîtier prend en charge le format.")],
[M("Was ist ein BIOS-Update und brauche ich es?","Qu'est-ce qu'une mise à jour du BIOS et en ai-je besoin ?"),
M("Das BIOS (UEFI) ist die Firmware des Mainboards. Manche Boards erkennen neue CPUs erst nach einem Update, zum Beispiel:\n• Ryzen 9000 auf älteren B650-/X670-Boards\n• Ryzen 5000 auf B450-/A520-Boards\n• Intel 13./14. Gen auf Z690-/B660-/H610-Boards\nViele neue Boards haben „BIOS Flashback“: Du kopierst die BIOS-Datei auf einen USB-Stick (FAT32) und drückst am Board eine kleine Taste, ganz ohne eingebaute CPU. Das Update findest du auf der Webseite des Herstellers beim Board-Modell unter „Support“ oder „Download“. Bei Intel 13./14. Gen ist ein BIOS mit aktuellem Mikrocode (0x12B oder neuer) wichtig, sonst drohen Stabilitätsprobleme. Der Check zeigt dir einen Hinweis, wenn das nötig sein kann.","Le BIOS (UEFI) est le firmware de la carte mère. Certaines cartes ne reconnaissent de nouveaux CPU qu'après une mise à jour, par exemple :\n• Ryzen 9000 sur d'anciennes cartes B650/X670\n• Ryzen 5000 sur cartes B450/A520\n• Intel 13e/14e gén. sur cartes Z690/B660/H610\nBeaucoup de cartes récentes ont le « BIOS Flashback » : tu copies le fichier BIOS sur une clé USB (FAT32) et appuies sur un petit bouton de la carte, sans CPU installé. La mise à jour se trouve sur le site du fabricant, à la page du modèle de carte, sous « Support » ou « Téléchargements ». Pour les Intel 13e/14e gén., un BIOS avec un microcode récent (0x12B ou plus) est important, sinon des instabilités sont possibles. Le check affiche une remarque quand c'est probablement nécessaire.")],
["h",M("Arbeitsspeicher und SSD","Mémoire vive et SSD")],
[M("DDR4 oder DDR5?","DDR4 ou DDR5 ?"),
M("Das hängt vom Mainboard ab, nicht vom Wunsch: AM4 und LGA1200 nutzen nur DDR4, AM5 und LGA1851 nur DDR5. Bei LGA1700 gibt es beide Boardvarianten, Modelle mit „D4“ oder „DDR4“ im Namen haben DDR4-Slots. Beides ist nicht tauschbar: Die Kerbe im Modul sitzt an anderer Stelle. Für neue Systeme lohnt DDR5 (bei AMD ist 6000 MT/s mit CL30 der Sweet Spot). Wenn du schon DDR4 besitzt, kannst du auf AM4 oder LGA1700-D4 weiterhin sinnvoll aufrüsten.","Cela dépend de la carte mère, pas de l'envie : l'AM4 et le LGA1200 n'utilisent que de la DDR4, l'AM5 et le LGA1851 que de la DDR5. Le LGA1700 existe dans les deux variantes ; les modèles avec « D4 » ou « DDR4 » dans le nom ont des slots DDR4. Les deux ne sont pas interchangeables : l'encoche du module est à un autre endroit. Pour un nouveau système, la DDR5 vaut la peine (chez AMD, 6000 MT/s en CL30 est le bon compromis). Si tu as déjà de la DDR4, tu peux encore évoluer intelligemment sur AM4 ou LGA1700-D4.")],
[M("Wie viel RAM brauche ich, und was ist Dual-Channel?","De combien de RAM ai-je besoin, et qu'est-ce que le dual-channel ?"),
M("Richtwerte:\n• 16 GB: Büro, Internet, einfaches Gaming\n• 32 GB: aktuelle Spiele, Streaming nebenbei, die Empfehlung für die meisten\n• 64 GB: Videoschnitt, 3D, virtuelle Maschinen, viele Programme gleichzeitig\n• 96–128 GB und mehr: große Projekte, KI, Profi-Arbeit\nDual-Channel heißt: zwei Module gleichzeitig nutzen. Das verdoppelt die Speicherbandbreite und macht Spiele schneller. Darum lieber 2 × 16 GB als 1 × 32 GB. Vier Module (4 × 16 GB) bremsen den Takt, vor allem bei DDR5; zwei große Module sind besser als vier kleine.","Repères :\n• 16 Go : bureautique, internet, jeu simple\n• 32 Go : jeux actuels, streaming en parallèle, la recommandation pour la plupart\n• 64 Go : montage vidéo, 3D, machines virtuelles, beaucoup de programmes à la fois\n• 96–128 Go et plus : gros projets, IA, travail professionnel\nDual-channel signifie : utiliser deux modules en même temps. Cela double la bande passante mémoire et accélère les jeux. Mieux vaut donc 2 × 16 Go qu'1 × 32 Go. Quatre modules (4 × 16 Go) font baisser la fréquence, surtout en DDR5 ; deux gros modules valent mieux que quatre petits.")],
[M("XMP oder EXPO, und was heißt das?","XMP ou EXPO, que veut dire cela ?"),
M("Das sind Speicherprofile, die du im BIOS einschaltest, damit der RAM mit der aufgedruckten Geschwindigkeit läuft. Ohne Profil läuft er viel langsamer (DDR5 oft nur mit 4800 MT/s). EXPO ist die AMD-Variante, XMP die von Intel. Kits mit beiden Profilen laufen überall. Ein falsches Profil klappt oft trotzdem, du musst die Werte dann aber manchmal von Hand eintragen. So schaltest du es ein: BIOS öffnen (beim Start Entf oder F2 drücken), „AI Tweaker“/„OC“/„Memory“ suchen und „XMP“ oder „EXPO“ auf „Profil 1“ stellen, speichern und neu starten.","Ce sont des profils mémoire que tu actives dans le BIOS pour que la RAM tourne à la vitesse indiquée. Sans profil, elle est bien plus lente (la DDR5 souvent seulement à 4800 MT/s). EXPO est la variante AMD, XMP celle d'Intel. Les kits avec les deux profils fonctionnent partout. Un mauvais profil marche souvent quand même, mais il faut parfois entrer les valeurs à la main. Pour l'activer : ouvrir le BIOS (appuyer sur Suppr ou F2 au démarrage), chercher « AI Tweaker »/« OC »/« Memory », régler « XMP » ou « EXPO » sur « Profil 1 », enregistrer et redémarrer.")],
[M("SSD-Typen: NVMe, SATA oder Festplatte?","Types de SSD : NVMe, SATA ou disque dur ?"),
M("Die Typen im Vergleich:\n• NVMe (M.2, PCIe): 3.500 bis 14.000 MB/s, ideal für Windows, Spiele und Projekte.\n• SATA-SSD: etwa 550 MB/s, für zusätzliche Daten oder ältere PCs; starten Windows aber spürbar langsamer als NVMe.\n• HDD (Festplatte): etwa 100–250 MB/s, nur für Archive und Backups; als Systemlaufwerk macht sie den PC zäh.\nTipps: Für das System eine NVMe mit mindestens 1 TB nehmen. Billige SSDs ohne eigenen Cache (DRAM-less) werden bei großen Dateien deutlich langsamer. Eine zweite Platte für Daten (SATA-SSD oder HDD) ist günstig und sinnvoll.","Comparaison :\n• NVMe (M.2, PCIe) : 3 500 à 14 000 Mo/s, idéal pour Windows, les jeux et les projets.\n• SSD SATA : environ 550 Mo/s, pour des données supplémentaires ou de vieux PC ; Windows démarre sensiblement plus lentement qu'avec un NVMe.\n• HDD (disque dur) : environ 100–250 Mo/s, uniquement pour archives et sauvegardes ; comme disque système, il rend le PC lent.\nConseils : pour le système, prends un NVMe d'au moins 1 To. Les SSD bon marché sans cache DRAM (DRAM-less) ralentissent nettement avec de gros fichiers. Un second disque pour les données (SSD SATA ou HDD) est économique et utile.")],
["h",M("Prozessor, Grafikkarte und Leistung","Processeur, carte graphique et performances")],
[M("Was bedeuten K, F, X3D, X, G und die anderen Buchstaben bei CPUs?","Que signifient K, F, X3D, X, G et les autres lettres des CPU ?"),
M("Hinter dem Namen stehen Kürzel:\n• Intel K: freigeschaltet zum Übertakten (braucht Z-Board, kein Kühler im Karton). KF: wie K, aber ohne eingebaute Grafik.\n• Intel F: keine integrierte Grafik, also immer eine Grafikkarte nötig. Ohne F ist ein Bild über die Mainboard-Anschlüsse möglich.\n• Intel T: sparsam, wenig Verbrauch; Intel „Core Ultra“ ist die neueste Generation (Sockel LGA1851).\n• AMD X: höherer Takt und Verbrauch; X3D: zusätzlicher 3D-Cache, die besten Spiele-CPUs.\n• AMD G: mit starker integrierter Grafik (APU), gut für PCs ohne Grafikkarte; GT/G-Modelle haben oft weniger PCIe-Lanes.\n• AMD F (z. B. 7500F, 8400F): ohne integrierte Grafik.\nIn der Datenbank stehen die Modelle ohne diese Zeichen für die Variante mit „(F)“, wenn beides existiert.","Les suffixes après le nom signifient :\n• Intel K : débloqué pour l'overclocking (demande une carte Z, pas de ventirad dans la boîte). KF : comme K, mais sans graphique intégré.\n• Intel F : pas de graphique intégré, donc une carte graphique est toujours nécessaire. Sans F, une image est possible via les ports de la carte mère.\n• Intel T : économe, faible consommation ; « Core Ultra » est la génération la plus récente (socket LGA1851).\n• AMD X : fréquence et consommation plus élevées ; X3D : cache 3D supplémentaire, les meilleurs CPU pour le jeu.\n• AMD G : avec un graphique intégré puissant (APU), bien pour les PC sans carte graphique ; les modèles G/GT ont souvent moins de lanes PCIe.\n• AMD F (par ex. 7500F, 8400F) : sans graphique intégré.\nDans la base, les modèles sans ces signes correspondent à la variante « (F) » quand les deux existent.")],
[M("Was ist ein Bottleneck (Flaschenhals)?","Qu'est-ce qu'un goulot d'étranglement (bottleneck) ?"),
M("Wenn eine schwache CPU die Grafikkarte ausbremst, bleibt Leistung ungenutzt. Je höher die Auflösung, desto weniger fällt das auf, weil dann die Grafikkarte der Engpass ist. Der Balken „CPU ↔ GPU Balance“ rechnet das aus der Leistungszahl beider Teile und deiner Auflösung. Das gilt auch umgekehrt: Eine sehr starke CPU mit einer schwachen Grafikkarte ist verschenktes Geld. Das ist eine Faustregel, kein Messwert: Spiele verhalten sich unterschiedlich. In der Engpass-Matrix siehst du das für viele Paare auf einen Blick.","Quand un CPU trop faible freine la carte graphique, de la puissance reste inutilisée. Plus la résolution est élevée, moins cela se voit, car c'est alors la carte graphique qui limite. La barre « Équilibre CPU ↔ GPU » le calcule à partir de la puissance des deux composants et de ta résolution. L'inverse vaut aussi : un CPU très puissant avec une carte graphique faible, c'est de l'argent gaspillé. C'est une règle empirique, pas une mesure : les jeux réagissent différemment. Dans la matrice des goulots, tu vois cela pour de nombreuses paires d'un coup d'œil.")],
[M("Was bringen X3D-Prozessoren?","Qu'apportent les processeurs X3D ?"),
M("AMDs X3D-CPUs haben zusätzlichen Cache direkt auf dem Chip und sind in Spielen oft die schnellsten. Für Videoschnitt oder 3D-Rendern zählen eher viele Kerne, dort sind Ryzen 9 ohne X3D oder Core Ultra 9 stark. Deshalb ändert der Check die Bewertung, wenn du „Videoschnitt & 3D“ wählst. Beispiel: Ein Ryzen 7 9800X3D ist die Spiele-CPU Nr. 1, aber ein Ryzen 9 9950X ist beim Rendern deutlich schneller.","Les CPU X3D d'AMD ont du cache supplémentaire directement sur la puce et sont souvent les plus rapides en jeu. Pour le montage vidéo ou le rendu 3D, ce sont plutôt de nombreux cœurs qui comptent ; les Ryzen 9 sans X3D ou Core Ultra 9 y sont forts. C'est pourquoi le check change l'évaluation quand tu choisis « Montage vidéo & 3D ». Exemple : un Ryzen 7 9800X3D est le CPU de jeu n° 1, mais un Ryzen 9 9950X est nettement plus rapide en rendu.")],
[M("Wie viel Grafikspeicher (VRAM) brauche ich?","De combien de mémoire graphique (VRAM) ai-je besoin ?"),
M("Richtwerte für aktuelle Spiele bei hohen Details:\n• 1080p: 8 GB reichen meist, 12 GB sind ruhiger.\n• 1440p: 12 GB sind ein guter Wert, 16 GB sicherer.\n• 4K: mindestens 16 GB.\n• Videoschnitt, 3D und KI: Mehr ist besser (16–24 GB).\nWenn der Grafikspeicher knapp wird, ruckeln Spiele oder Texturen werden unscharf, obwohl die Grafikkarte sonst stark wäre. Das ist ein häufiger Grund, warum eine 8-GB-Karte schneller altert als eine 16-GB-Karte. Bei Karten mit nur x8-Lanes und 8 GB (RTX 5060 Ti 8 GB, RX 9060 XT 8 GB) wirkt es besonders stark in einem PCIe-3.0-Slot.","Repères pour les jeux actuels en détails élevés :\n• 1080p : 8 Go suffisent le plus souvent, 12 Go sont plus sereins.\n• 1440p : 12 Go est une bonne valeur, 16 Go plus sûr.\n• 4K : au moins 16 Go.\n• Montage vidéo, 3D et IA : plus c'est mieux (16–24 Go).\nQuand la mémoire graphique devient juste, les jeux saccadent ou les textures deviennent floues, même si la carte est par ailleurs puissante. C'est une raison fréquente pour laquelle une carte de 8 Go vieillit plus vite qu'une carte de 16 Go. Pour les cartes à seulement x8 lanes et 8 Go (RTX 5060 Ti 8 Go, RX 9060 XT 8 Go), l'effet est particulièrement marqué dans un slot PCIe 3.0.")],
[M("NVIDIA, AMD oder Intel Arc?","NVIDIA, AMD ou Intel Arc ?"),
M("NVIDIA ist stark bei Raytracing, DLSS (Bildverbesserung) und in Videoprogrammen (CUDA, NVENC). AMD bietet oft mehr VRAM fürs Geld und gute Rasterleistung. Intel Arc ist günstig und wird mit jedem Treiber besser, braucht aber „Resizable BAR“ im BIOS und eine aktuelle Plattform. Wer Adobe Premiere oder DaVinci Resolve nutzt, fährt mit NVIDIA meistens am sichersten. Wer vor allem spielt und Wert auf Preis legt, findet bei AMD oft das beste Verhältnis.","NVIDIA est fort en ray tracing, en DLSS (amélioration de l'image) et dans les logiciels vidéo (CUDA, NVENC). AMD offre souvent plus de VRAM pour le prix et de bonnes performances en rastérisation. Intel Arc est abordable et s'améliore à chaque pilote, mais demande le « Resizable BAR » dans le BIOS et une plateforme récente. Pour Adobe Premiere ou DaVinci Resolve, NVIDIA est généralement le choix le plus sûr. Pour jouer surtout et regarder le prix, AMD offre souvent le meilleur rapport.")],
[M("Was bedeuten die Handheld-Vergleiche (Steam Deck, Legion Go 2)?","Que signifient les comparaisons avec les consoles portables (Steam Deck, Legion Go 2) ?"),
M("Die Handhelds sind Referenzgeräte, damit du ein Gefühl für die Stärke deiner Konfiguration bekommst. Steam Deck OLED hat 4 Zen-2-Kerne und eine kleine RDNA-2-Grafik, Lenovo Legion Go 2 einen Ryzen Z2 Extreme (8 Zen-5-Kerne, RDNA 3.5). Beide laufen mit nur 15–30 W. „×3,8“ bedeutet: Dein PC ist in der gewählten Verwendung ungefähr 3,8-mal so stark wie das Steam Deck. Bei „Gaming“ zählt die Grafikkarte stärker als die CPU, bei „Videoschnitt“ zählen Mehrkernleistung und Grafik gleich, bei „Büro“ nur die CPU. Mit „Ziel-Stärke“ stellst du den gewünschten Faktor ein und die App wählt die Teile aus. Die Werte der Handhelds sind Faustwerte, keine Messungen.","Les consoles portables servent de référence pour donner une idée de la puissance de ta configuration. Le Steam Deck OLED a 4 cœurs Zen 2 et un petit graphique RDNA 2, le Lenovo Legion Go 2 un Ryzen Z2 Extreme (8 cœurs Zen 5, RDNA 3.5). Les deux fonctionnent à seulement 15–30 W. « ×3,8 » signifie : ton PC est, pour l'usage choisi, environ 3,8 fois plus puissant que le Steam Deck. En « Jeux », la carte graphique compte plus que le CPU ; en « Montage vidéo », multicœur et graphique comptent à parts égales ; en « Bureautique », seul le CPU compte. Avec « Puissance visée », tu règles le facteur voulu et l'appli choisit les composants. Les valeurs des consoles sont des repères, pas des mesures.")],
["h",M("Netzteil, Kühlung und Zusammenbau","Alimentation, refroidissement et montage")],
[M("Wie viel Watt braucht mein Netzteil?","De combien de watts mon alimentation a-t-elle besoin ?"),
M("Addiere die Spitzenleistung von CPU und Grafikkarte, plus etwa 100 W für Mainboard, RAM, SSD und Lüfter, und nimm davon 20 % mehr. Beispiel: 162 W + 360 W + 100 W = 622 W, mal 1,2 = rund 750 W. Wichtiger als die Wattzahl ist ein Markenmodell mit 80+ Gold und genug 8-pin-Anschlüssen. Für RTX 5090 und 4090 sind 1000 W die Untergrenze. Ein zu starkes Netzteil schadet nicht, ein zu schwaches führt zu Abstürzen unter Last. ATX-3.x-Netzteile haben den 12V-2x6-Stecker (früher 12VHPWR) für aktuelle NVIDIA-Karten direkt; sonst brauchst du den Adapter.","Additionne la puissance de pointe du CPU et de la carte graphique, plus environ 100 W pour carte mère, RAM, SSD et ventilateurs, puis ajoute 20 %. Exemple : 162 W + 360 W + 100 W = 622 W, × 1,2 = environ 750 W. Plus important que les watts : un modèle de marque 80+ Gold avec assez de connecteurs 8 broches. Pour les RTX 5090 et 4090, 1000 W est un minimum. Une alimentation trop puissante ne nuit pas, une alimentation trop faible provoque des plantages en charge. Les alimentations ATX 3.x ont directement le connecteur 12V-2x6 (anciennement 12VHPWR) pour les cartes NVIDIA actuelles ; sinon, il faut l'adaptateur.")],
[M("Welcher CPU-Kühler passt?","Quel ventirad CPU convient ?"),
M("Drei Dinge zählen:\n• Sockel: Der Kühler braucht die Halterung für deinen Sockel (AM4, AM5, LGA1700, LGA1851, LGA1200). Die meisten Kühler passen auf mehrere; der Check prüft das.\n• Leistung: Die Zahl in Watt ist die Kühlleistung. Sie muss zur CPU passen (starke CPUs wie ein Core i9 oder Ryzen 9 brauchen 240–360-mm-AIO oder große Doppelturm-Luftkühler).\n• Höhe/Platz: Luftkühler haben eine Höhe (z. B. 155 mm) und müssen ins Gehäuse und über den RAM passen. Das prüft der Check nicht, miss selbst.\nBoxed-Kühler (der kleine Kühler im Karton) reicht nur für kleine CPUs bis etwa 65 W. K-CPUs von Intel werden ohne Kühler geliefert.","Trois choses comptent :\n• Socket : le ventirad doit avoir la fixation de ton socket (AM4, AM5, LGA1700, LGA1851, LGA1200). La plupart conviennent à plusieurs ; le check le vérifie.\n• Puissance : le chiffre en watts est la capacité de refroidissement. Elle doit correspondre au CPU (les CPU puissants comme un Core i9 ou Ryzen 9 demandent un AIO 240–360 mm ou un gros ventirad double tour).\n• Hauteur/place : les ventirads à air ont une hauteur (par ex. 155 mm) et doivent tenir dans le boîtier et au-dessus de la RAM. Le check ne le vérifie pas, mesure toi-même.\nLe ventirad boxed (le petit dans la boîte) ne suffit que pour de petits CPU jusqu'à environ 65 W. Les CPU Intel K sont livrés sans ventirad.")],
[M("Passt die Grafikkarte ins Gehäuse?","La carte graphique tient-elle dans le boîtier ?"),
M("Das prüft der Check nicht, weil die Länge je nach Hersteller und Modell verschieden ist. Miss die maximale Kartenlänge deines Gehäuses und vergleiche sie mit den Angaben des Herstellers zur konkreten Karte. Große Karten brauchen oft drei Slots Platz, und das Netzteil-Kabel (12V-2x6) darf nicht stark geknickt werden: Lass etwa 3–4 cm Platz vor dem Stecker, bevor das Kabel knickt. Prüfe auch die Höhe des CPU-Kühlers und die Länge des Netzteils.","Le check ne le vérifie pas, car la longueur varie selon le fabricant et le modèle. Mesure la longueur maximale de carte de ton boîtier et compare-la aux indications du fabricant pour la carte concernée. Les grosses cartes demandent souvent trois emplacements, et le câble de l'alimentation (12V-2x6) ne doit pas être fortement plié : laisse environ 3–4 cm devant le connecteur avant que le câble ne coude. Vérifie aussi la hauteur du ventirad CPU et la longueur de l'alimentation.")],
[M("Wie kombiniere ich Teile am sichersten?","Comment associer les composants en toute sécurité ?"),
M("In dieser Reihenfolge:\n1. Verwendung und Auflösung festlegen.\n2. Grafikkarte wählen, sie bestimmt am meisten.\n3. Passende CPU dazu, sodass die Balance im grünen Bereich ist.\n4. Mainboard mit dem richtigen Sockel und RAM-Typ; bei x8-Karten mindestens PCIe 4.0.\n5. RAM, SSD, dann Netzteil und Kühler nach der berechneten Leistung.\n6. Zum Schluss Gehäuse (Länge, Höhe, Format) und BIOS-Hinweise prüfen.\nKlicke in der Liste auf die Beispiele, um zu sehen, wie grüne Kombinationen aussehen. Oder nutze „Ziel-Stärke“, wenn du nur ein Ziel kennst: Die App stellt dann alles zusammen. Danach kannst du jedes Teil frei ändern.","Dans cet ordre :\n1. Définir l'usage et la résolution.\n2. Choisir la carte graphique, c'est elle qui compte le plus.\n3. Un CPU adapté, pour que l'équilibre soit dans le vert.\n4. Une carte mère avec le bon socket et le bon type de RAM ; pour les cartes x8, au moins PCIe 4.0.\n5. RAM, SSD, puis alimentation et ventirad selon la puissance calculée.\n6. Pour finir, vérifier le boîtier (longueur, hauteur, format) et les remarques BIOS.\nClique sur les exemples dans la liste pour voir à quoi ressemblent des combinaisons vertes. Ou utilise « Puissance visée » si tu ne connais qu'un objectif : l'appli assemble tout. Ensuite, tu peux modifier chaque composant librement.")]
];
var DBKEYS=["cpu","gpu","board","ram","ssd","psu","cool"];
var S={cpu:0,board:0,gpu:0,ram:0,ssd:0,psu:0,cool:0,use:0,res:1};
var DB={tab:0,q:"",brand:"",sortK:null,sortD:1};
var t=function(){return UI[LANG]};
var tx=function(o){return o[LANG]};
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function lvl(s){return s>=80?"ok":s>=50?"warn":"bad"}
function find(arr,name){for(var i=0;i<arr.length;i++)if(arr[i][0]===name)return i;return 0}
function isK(c){return c[1]==="Intel"&&/K/.test(c[0])}

function evaluate(s){
  var cpu=CPUS[s.cpu],bd=BOARDS[s.board],ch=CHIP[bd[1]],gpu=GPUS[s.gpu],ram=RAMS[s.ram],ssd=SSDS[s.ssd],psu=PSUS[s.psu],cool=COOLERS[s.cool];
  var use=USEK[s.use],res=RES[s.res][0];
  var C={},hints=[],hard=[];
  /* Kompatibilität */
  var parts=[];
  if(cpu[2]!==ch[0]){hard.push(1);parts.push(M("Die CPU hat Sockel "+cpu[2]+", das Mainboard ("+bd[1]+") hat Sockel "+ch[0]+". Sie passen mechanisch nicht.","Le CPU est en socket "+cpu[2]+", la carte mère ("+bd[1]+") en socket "+ch[0]+". Ils sont incompatibles mécaniquement."))}
  if(ram[1]!==bd[3]){hard.push(1);parts.push(M("Das Board nimmt "+(bd[3]==="D5"?"DDR5":"DDR4")+", der RAM ist "+(ram[1]==="D5"?"DDR5":"DDR4")+".","La carte accepte la "+(bd[3]==="D5"?"DDR5":"DDR4")+", la RAM est de la "+(ram[1]==="D5"?"DDR5":"DDR4")+"."))}
  if(cool[3].indexOf(cpu[2])<0){hard.push(1);parts.push(M("Dem Kühler fehlt die Halterung für "+cpu[2]+".","Le ventirad n'a pas de fixation pour "+cpu[2]+"."))}
  if(!parts.length)parts.push(M("Sockel ("+cpu[2]+"), RAM-Typ ("+(bd[3]==="D5"?"DDR5":"DDR4")+") und Kühlerhalterung passen.","Socket ("+cpu[2]+"), type de RAM ("+(bd[3]==="D5"?"DDR5":"DDR4")+") et fixation du ventirad sont compatibles."));
  C.compat={score:hard.length?0:100,parts:parts};
  /* Balance */
  var fRes={"1080p":1.15,"1440p":0.95,"4k":0.72}[res];
  var cpuEff=cpu[5],need,bparts=[],bs=100;
  if(use==="office"){bs=100;bparts.push(M("Für Büro und Programmieren reicht jede dieser CPUs; die Balance ist hier nicht entscheidend.","Pour la bureautique et la programmation, n'importe lequel de ces CPU suffit ; l'équilibre n'est pas décisif ici."));
    if(gpu[3]>40){hints.push({l:"info",m:M("Für Büro ist diese Grafikkarte überdimensioniert. Eine kleine Karte oder die Grafik der CPU spart Geld und Strom.","Pour la bureautique, cette carte graphique est surdimensionnée. Une petite carte ou le GPU intégré économise argent et énergie.")})}
  }else{
    if(use==="video"){cpuEff=0.35*cpu[5]+0.65*cpu[6];need=25+0.75*gpu[3]*0.85}else need=25+0.75*gpu[3]*fRes;
    if(use==="stream"){cpuEff=cpuEff*0.9}
    need=Math.max(need,8);
    var bn=Math.max(0,(need-cpuEff)/need);
    bs=100-bn*100*2.2;
    var r=cpuEff/need;
    if(bn>0.02){bparts.push(M("Die CPU bremst die Grafikkarte um etwa "+Math.round(bn*100)+" %. Du kannst die Karte nicht voll nutzen.","Le CPU freine la carte graphique d'environ "+Math.round(bn*100)+" %. Tu ne peux pas l'exploiter pleinement."))}
    else if(r>2.2){bs=Math.min(bs,65);bparts.push(M("Die CPU ist viel stärker als die Grafikkarte braucht. Das Geld wäre in einer besseren GPU besser angelegt.","Le CPU est bien plus puissant que nécessaire pour cette carte. L'argent serait mieux investi dans un meilleur GPU."))}
    else if(r>1.7){bs=Math.min(bs,85);bparts.push(M("Gut, aber die CPU hat deutlich Reserve; die Grafikkarte begrenzt.","Bien, mais le CPU a beaucoup de marge ; c'est la carte graphique qui limite."))}
    else bparts.push(M("CPU und Grafikkarte sind ausgewogen.","CPU et carte graphique sont bien équilibrés."));
  }
  C.bal={score:clamp(Math.round(bs),0,100),parts:bparts};
  /* Grafikleistung für Auflösung */
  var needPerf={"1080p":18,"1440p":30,"4k":55}[res],rs,rparts=[];
  if(use==="office"){rs=100;rparts.push(M("Für Büro ist keine besondere Grafikleistung nötig.","Aucune puissance graphique particulière n'est nécessaire pour la bureautique."))}
  else{var rr=gpu[3]/(use==="video"?25:needPerf);rs=Math.min(100,rr*100);
    var tier=rr>=2.2?M("weit über 60 FPS (120 FPS und mehr in vielen Spielen)","bien au-dessus de 60 FPS (120 FPS et plus dans beaucoup de jeux)"):rr>=1.4?M("locker flüssig (90 FPS und mehr bei hohen Details)","très fluide (90 FPS et plus en détails élevés)"):rr>=1?M("flüssig bei hohen Details (um 60 FPS)","fluide en détails élevés (autour de 60 FPS)"):M("unter 60 FPS bei hohen Details; Details senken oder stärkere Karte wählen","sous 60 FPS en détails élevés ; baisse les détails ou prends une carte plus puissante");
    rparts.push(M("Für "+RES[s.res][1]+": "+tier.de,"Pour "+RES[s.res][1]+" : "+tier.fr))}
  C.res={score:Math.round(rs),parts:rparts};
  /* VRAM */
  var vn={"1080p":8,"1440p":12,"4k":16}[res]+(use==="video"?4:0);if(use==="office")vn=2;
  var vs=Math.min(100,gpu[4]/vn*100);
  C.vram={score:Math.round(vs),parts:[gpu[4]>=vn?M(gpu[4]+" GB reichen (Richtwert: "+vn+" GB).",gpu[4]+" Go suffisent (repère : "+vn+" Go)."):M(gpu[4]+" GB sind knapp (Richtwert: "+vn+" GB). Texturen müssen reduziert werden.",gpu[4]+" Go, c'est juste (repère : "+vn+" Go). Il faudra réduire les textures.")]};
  /* Netzteil */
  var load=cpu[4]+gpu[2]+100,rec=Math.max(450,Math.ceil(load*1.2/50)*50);if(gpu[3]>=80)rec=Math.max(rec,1000);
  var ps,pparts=[];
  if(psu[1]>=rec){ps=100;pparts.push(M(psu[1]+" W reichen (Spitze ca. "+load+" W, empfohlen ab "+rec+" W).",psu[1]+" W suffisent (pointe env. "+load+" W, conseillé dès "+rec+" W)."))}
  else if(psu[1]>=load*1.05){ps=70;pparts.push(M(psu[1]+" W laufen, lassen aber wenig Reserve für Lastspitzen. Empfohlen ab "+rec+" W.",psu[1]+" W fonctionnent mais laissent peu de marge pour les pics. Conseillé dès "+rec+" W."))}
  else if(psu[1]>=load*0.9){ps=35;pparts.push(M(psu[1]+" W sind zu knapp (Spitze ca. "+load+" W). Abstürze unter Last sind wahrscheinlich. Empfohlen ab "+rec+" W.",psu[1]+" W, c'est trop juste (pointe env. "+load+" W). Des plantages en charge sont probables. Conseillé dès "+rec+" W."))}
  else{ps=10;pparts.push(M(psu[1]+" W reichen nicht (Spitze ca. "+load+" W). Empfohlen ab "+rec+" W.",psu[1]+" W ne suffisent pas (pointe env. "+load+" W). Conseillé dès "+rec+" W."))}
  if(gpu[3]>=80&&psu[1]<1000)ps=Math.min(ps,45);
  if(/^12V/.test(gpu[7])&&!psu[3]){hints.push({l:"warn",m:M("Diese Grafikkarte nutzt den "+gpu[7].split(" ")[0]+"-Stecker. Dein Netzteil hat keinen nativen 12V-2x6-Anschluss, du brauchst den Adapter aus dem Lieferumfang der Karte (sauber verlegen, nicht knicken).","Cette carte utilise le connecteur "+gpu[7].split(" ")[0]+". Ton alimentation n'a pas de 12V-2x6 natif ; il faut l'adaptateur fourni avec la carte (bien le poser, sans le plier).")})}
  C.psu={score:ps,parts:pparts};
  /* RAM */
  var need2={gaming:[32,16],stream:[32,16],video:[64,32],office:[16,8]}[use];
  var cap=ram[2],cs;
  if(use==="video"){cs=cap>=64?100:cap>=48?90:cap>=32?72:cap>=16?40:15}
  else if(use==="office"){cs=cap>=16?100:cap>=8?65:30}
  else{cs=cap>=32?100:cap>=24?90:cap>=16?72:cap>=8?35:10}
  var rp=[];
  rp.push(cap>=need2[0]?M(cap+" GB sind passend.",cap+" Go conviennent."):cap>=need2[1]?M(cap+" GB gehen, empfohlen sind "+need2[0]+" GB.",cap+" Go passent, "+need2[0]+" Go sont conseillés."):M(cap+" GB sind zu wenig (empfohlen "+need2[0]+" GB).",cap+" Go, c'est trop peu ("+need2[0]+" Go conseillés)."));
  var sf=1,isA=cpu[1]==="AMD";
  if(ram[1]==="D5"&&!hard.length||ram[1]==="D5"){
    if(isA&&cpu[2]==="AM5"){

  /* Gesamt */
  var total=0,wsum=0,k;for(k in W){total+=W[k]*C[k].score;wsum+=W[k]}

function suggest(){
  var cpu=CPUS[S.cpu],gpu=GPUS[S.gpu],use=USEK[S.use],i,best=-1;
  var ct=cpu[4]>=200?3:cpu[4]>=140?2:1;
  for(i=0;i<BOARDS.length;i++){var ch=CHIP[BOARDS[i][1]];if(ch[0]!==cpu[2])continue;
    if(cpu[2]==="LGA1700"&&BOARDS[i][3]!=="D5")continue;
    if(ch[4]<ct)continue;
    if(isK(cpu)&&!ch[5])continue;
    if(best<0||ch[4]<CHIP[BOARDS[best][1]][4]||(ch[4]===CHIP[BOARDS[best][1]][4]&&BOARDS[i][2]==="ATX"&&BOARDS[best][2]!=="ATX"))best=i}
  if(best<0)for(i=0;i<BOARDS.length;i++){if(CHIP[BOARDS[i][1]][0]===cpu[2]){best=i;break}}
  if(best>=0)S.board=best;
  var bd=BOARDS[S.board],ch2=CHIP[bd[1]],cap={gaming:32,stream:32,video:64,office:16}[use],tgt=bd[3]==="D5"?6000:3600,bk=-1,bd2=1e9;
  for(i=0;i<RAMS.length;i++){var r=RAMS[i];if(r[1]!==bd[3]||r[2]<cap||r[6]>2)continue;
    var pen=Math.abs(r[3]-tgt)+(r[2]-cap)*20+((cpu[1]==="AMD"&&r[5]==="xmp")||(cpu[1]!=="AMD"&&r[5]==="expo")?5000:0);
    if(pen<bd2){bd2=pen;bk=i}}
  if(bk>=0)S.ram=bk;
  var want=ch2[3]>=4?"N4":"N3",sk=-1;for(i=0;i<SSDS.length;i++){if(SSDS[i][1]===want&&SSDS[i][3]>=1000&&(sk<0||SSDS[i][2]>SSDS[sk][2]))sk=i}
  if(sk>=0)S.ssd=sk;
  var load=cpu[4]+gpu[2]+100,rec=Math.max(450,Math.ceil(load*1.2/50)*50);if(gpu[3]>=80)rec=Math.max(rec,1000);
  var pk=-1;for(i=0;i<PSUS.length;i++){var p=PSUS[i];if(p[1]<rec)continue;if(/^12V/.test(gpu[7])&&!p[3])continue;if(pk<0||p[1]<PSUS[pk][1]||(p[1]===PSUS[pk][1]&&p[3]>PSUS[pk][3]))pk=i}
  if(pk>=0)S.psu=pk;
  var ck=-1;for(i=0;i<COOLERS.length;i++){var c=COOLERS[i];if(c[3].indexOf(cpu[2])<0||c[2]<cpu[4]*0.8*0.9)continue;if(c[1]==="Boxed"&&cpu[4]>95)continue;if(ck<0||c[2]<COOLERS[ck][2])ck=i}
  if(ck>=0)S.cool=ck;
  render();
}
function balOf(cpu,gpu,use,res){
  if(use==="office")return 100;
  var f=[1.15,0.95,0.72][res],eff=cpu[5],need;
  if(use==="video"){eff=0.35*cpu[5]+0.65*cpu[6];need=25+0.75*gpu[3]*0.85}else need=25+0.75*gpu[3]*f;
  if(use==="stream")eff*=0.9;
  var bn=Math.max(0,(need-eff)/need),sc=100-bn*220,r=eff/need;
  if(bn<=0.02){if(r>2.2)sc=Math.min(sc,65);else if(r>1.8)sc=Math.min(sc,85)}
  return clamp(Math.round(sc),0,100);
}

  $("#t_gb").innerHTML=[["",T.tgany],["NVIDIA","NVIDIA"],["AMD","AMD"],["Intel","Intel"]].map(function(o){return '<option value="'+o[0]+'">'+esc(o[1])+'</option>'}).join("");$("#t_gb").value=TG.gb;

function pickTarget(){
  var use=USEK[S.use],x=HH[TG.base],best=null,bl=1e9,maxF=0;
  CPUS.forEach(function(c,ci){
    if(TG.cb&&c[1]!==TG.cb)return;if(TG.nw&&c[9]<2022)return;
    GPUS.forEach(function(g,gi){
      if(TG.gb&&g[1]!==TG.gb)return;if(TG.nw&&g[8]<2022)return;
      var F=hhAll(x,c,g,use),bal=balOf(c,g,use,S.res);if(bal>=60&&F>maxF)maxF=F;
      var loss=Math.abs(Math.log(F/TG.f))+(F<TG.f?0.35:0)+(100-bal)/100*0.9+(c[4]+g[2])/4000+(use==="office"?g[3]/200:0);
      if(bal<60)loss+=1;
      if(loss<bl){bl=loss;best={c:ci,g:gi,F:F,bal:bal}}})});
  var T=t(),msg=$("#tg-msg");
  if(!best){msg.className="tgmsg v-bad";msg.textContent=LANG==="fr"?"Aucune combinaison trouvée avec ces filtres.":"Mit diesen Filtern wurde keine Kombination gefunden.";return}
  S.cpu=best.c;S.gpu=best.g;suggest();
  var c=CPUS[best.c],g=GPUS[best.g],e=evaluate(S),base=x.s,low=best.F<TG.f*0.85,hi=best.F>TG.f*1.3;
  var a=LANG==="fr"?("Choisi : "+c[0]+" + "+g[0]+" ≈ ×"+fx(best.F)+" "+base+" (objectif ×"+fx(TG.f)+"), équilibre "+best.bal+" %, note globale "+e.total+" %."):("Gewählt: "+c[0]+" + "+g[0]+" ≈ ×"+fx(best.F)+" "+base+" (Ziel ×"+fx(TG.f)+"), Balance "+best.bal+" %, Gesamtwertung "+e.total+" %.");
  if(low)a+=LANG==="fr"?(" Plus n’est pas possible avec ces filtres (maximum ≈ ×"+fx(maxF)+"). Desserre les filtres ou choisis un objectif plus bas."):(" Mehr ist mit diesen Filtern nicht möglich (Maximum ≈ ×"+fx(maxF)+"). Lockere die Filter oder wähle ein niedrigeres Ziel.");
  else if(hi)a+=LANG==="fr"?" La plus petite combinaison équilibrée de la base de données dépasse déjà l’objectif.":" Die kleinste ausgewogene Kombination der Datenbank liegt schon über dem Ziel.";
  msg.className="tgmsg v-"+(low?"warn":"ok");msg.textContent=a;
}
